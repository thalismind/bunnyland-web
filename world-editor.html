<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland World Editor</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    #api-url { width: 220px; }
    #fragment-dropdown { width: 230px; }
    #add-component-dropdown { width: 260px; }
    #add-edge-type-dropdown { width: 190px; }
    #add-edge-target-dropdown { width: 260px; }
    #fragment-file { max-width: 220px; }
    #meta-seed { width: 190px; }
    #meta-generator { width: 120px; }
    #meta-epoch { width: 90px; }

    #main {
      grid-template-columns: minmax(250px, 330px) minmax(560px, 1fr) minmax(330px, 430px);
    }
    #main.snapshot-hidden {
      grid-template-columns: minmax(250px, 330px) minmax(560px, 1fr);
    }
    #main.snapshot-hidden #preview-pane {
      display: none;
    }
    #entity-search {
      margin: 8px 10px 6px 10px;
      width: calc(100% - 20px);
    }
    #entity-list {
      padding-bottom: 8px;
    }
    .editor-scroll { flex: 1; }
    textarea {
      min-height: 82px;
    }
    .component-json {
      display: block;
      width: 100%;
      min-height: 136px;
      margin-top: 4px;
    }
    .raw-json {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--bl-border);
      color: var(--bl-text);
    }
    .raw-json summary {
      display: inline-block;
      min-height: 22px;
      padding: 4px 8px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      color: var(--bl-text);
      background: var(--bl-surface);
      cursor: pointer;
      font-size: var(--bl-text-sm);
    }
    .raw-json summary:hover {
      border-color: var(--bl-accent);
      color: var(--bl-text-inverse);
    }
    .tag-editor {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 24px;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 3px 6px;
      border: 1px solid var(--bl-border-strong);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-surface);
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
    }
    .tag-pill span {
      overflow-wrap: anywhere;
    }
    .tag-pill button {
      padding: 0 4px;
      border-color: var(--bl-text-dim);
      line-height: 1.2;
    }
    .tag-entry {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tag-entry input, .tag-entry select { flex: 1; }
    .meter-editor {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .meter-line {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    input[type=range].meter-range {
      width: 100%;
      padding: 0;
      accent-color: var(--bl-accent);
    }
    .meter-readout {
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
      white-space: nowrap;
    }
    .meter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .meter-grid label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: var(--bl-text-xs);
      color: var(--bl-text-soft);
    }
    .meter-grid input { width: 100%; }
    .compound-editor {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .compound-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr) auto;
      gap: 6px;
      align-items: center;
    }
    .compound-row.object-row {
      grid-template-columns: minmax(120px, 180px) minmax(180px, 1fr);
    }
    .compound-row input, .compound-row textarea { width: 100%; }
    .compound-row textarea { min-height: 54px; }
    .semantic-input {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .semantic-input input { flex: 1; }
    .field-description, .epoch-preview {
      color: var(--bl-text-soft);
      font-size: var(--bl-text-xs);
    }
    .problem-link {
      padding: 0 4px;
      margin-right: 4px;
      font-size: var(--bl-text-xs);
    }

    @media (max-width: 1050px) {
      #main { grid-template-columns: 290px minmax(560px, 1fr); }
      #preview-pane { display: none; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

  </style>
</head>
<body class="bl-tool-page bl-page-world-editor">
<div id="app"></div>
<script src="assets/bunnyland-ui.js"></script>
<script type="module" src="/src/world-editor/app.tsx"></script>
</body>
</html>
