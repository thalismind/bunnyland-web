<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland World Editor</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #api-url { width: 220px; }
    #fragment-dropdown { width: 230px; }
    #add-component-dropdown { width: 260px; }
    #fragment-file { max-width: 220px; }
    #meta-seed { width: 190px; }
    #meta-generator { width: 120px; }
    #meta-epoch { width: 90px; }

    #main {
      display: grid;
      grid-template-columns: minmax(250px, 330px) minmax(560px, 1fr) minmax(330px, 430px);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    #main.snapshot-hidden {
      grid-template-columns: minmax(250px, 330px) minmax(560px, 1fr);
    }
    #main.snapshot-hidden #preview-pane {
      display: none;
    }
    #entity-search {
      margin: 8px 10px 6px 10px;
      width: calc(100% - 20px);
    }
    #entity-list {
      padding-bottom: 8px;
    }
    .editor-scroll { flex: 1; }
    textarea {
      min-height: 82px;
    }
    .component-json {
      display: block;
      width: 100%;
      min-height: 136px;
      margin-top: 4px;
    }
    .raw-json {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--bl-border);
      color: var(--bl-text);
    }
    .raw-json summary {
      display: inline-block;
      min-height: 22px;
      padding: 4px 8px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      color: var(--bl-text);
      background: var(--bl-surface);
      cursor: pointer;
      font-size: var(--bl-text-sm);
    }
    .raw-json summary:hover {
      border-color: var(--bl-accent);
      color: var(--bl-text-inverse);
    }
    .tag-editor {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 24px;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 3px 6px;
      border: 1px solid var(--bl-border-strong);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-surface);
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
    }
    .tag-pill span {
      overflow-wrap: anywhere;
    }
    .tag-pill button {
      padding: 0 4px;
      border-color: var(--bl-text-dim);
      line-height: 1.2;
    }
    .tag-entry {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tag-entry input, .tag-entry select { flex: 1; }
    .meter-editor {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .meter-line {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    input[type=range].meter-range {
      width: 100%;
      padding: 0;
      accent-color: var(--bl-accent);
    }
    .meter-readout {
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
      white-space: nowrap;
    }
    .meter-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .meter-grid label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: var(--bl-text-xs);
      color: var(--bl-text-soft);
    }
    .meter-grid input { width: 100%; }

    @media (max-width: 1050px) {
      #main { grid-template-columns: 290px minmax(560px, 1fr); }
      #preview-pane { display: none; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

<div id="toolbar">
  <div class="toolbar-row" id="toolbar-row1">
    <label for="file-input">World:</label>
    <input type="file" id="file-input" accept=".json,application/json">
    <button id="btn-new">New World</button>
    <span class="toolbar-sep">|</span>
    <label for="api-url">Server:</label>
    <input type="text" id="api-url" value="http://localhost:8765" spellcheck="false">
    <button id="btn-fetch">Load Snapshot</button>
    <button id="btn-save-live">Save Live</button>
    <button id="btn-toggle-live" disabled>⏯</button>
    <span id="runtime-status">runtime: offline</span>
    <span id="status">Ready</span>
    <a class="nav-link push" href="index.html">Inspector</a>
    <a class="nav-link" href="script-editor.html">Script Editor</a>
  </div>
  <div class="toolbar-row" id="toolbar-row2">
    <label for="meta-seed">Seed:</label>
    <input type="text" id="meta-seed" spellcheck="false">
    <label for="meta-generator">Generator:</label>
    <input type="text" id="meta-generator" spellcheck="false">
    <label for="meta-epoch">Epoch:</label>
    <input type="number" id="meta-epoch" min="0">
    <span class="toolbar-sep">|</span>
    <button id="btn-download">Download JSON</button>
    <button id="btn-copy">Copy JSON</button>
    <button id="btn-toggle-snapshot">Hide Snapshot</button>
    <span class="toolbar-sep">|</span>
    <span id="world-info"></span>
  </div>
  <div class="toolbar-row" id="toolbar-row3">
    <label for="fragment-file">Fragments:</label>
    <input type="file" id="fragment-file" accept=".json,application/json">
    <span id="library-select-wrap"></span>
    <button id="btn-refresh-library">Refresh Library</button>
    <button id="btn-import-fragment" disabled>Import Fragment</button>
    <button id="btn-export-fragment">Export Selected Fragment</button>
  </div>
</div>

<div id="main">
  <section class="pane">
    <div class="pane-header">
      <div class="pane-title">Entities</div>
      <span class="pane-count" id="entity-count">0</span>
      <button id="btn-add-entity">Add</button>
      <button id="btn-delete-entity">Delete</button>
    </div>
    <div class="pane-body">
      <input type="text" id="entity-search" placeholder="find entity..." spellcheck="false" autocomplete="off">
      <div id="entity-list"></div>
    </div>
  </section>

  <section class="pane">
    <div class="pane-header">
      <div class="pane-title">Entity Editor</div>
      <span class="pane-count" id="selected-label">No selection</span>
      <a class="nav-link push" id="inspector-link" href="index.html" hidden>Open Inspector</a>
    </div>
    <div class="editor-scroll" id="entity-editor"></div>
  </section>

  <section class="pane" id="preview-pane">
    <div class="pane-header">
      <div class="pane-title">Snapshot JSON</div>
      <span class="pane-count" id="json-size">0 bytes</span>
    </div>
    <textarea id="json-output" spellcheck="false" readonly></textarea>
    <div id="problems" class="ok">Valid world JSON.</div>
  </section>
</div>

<datalist id="component-options"></datalist>
<datalist id="edge-options"></datalist>
<datalist id="entity-options"></datalist>

<script src="assets/bunnyland-ui.js"></script>
<script>
'use strict';

const COMMON_COMPONENTS = [
  'ActionPointsComponent', 'CharacterComponent', 'ContainerComponent',
  'DescriptionComponent', 'DiscordControllerComponent', 'DoorComponent',
  'EditorDisplayComponent', 'FocusPointsComponent', 'IdentityComponent',
  'InitiativeComponent', 'LLMControllerComponent', 'LockableComponent',
  'PortableComponent', 'RoomComponent',
  'SuspendedComponent', 'SuspendedControllerComponent', 'WorldClockComponent'
];
const COMMON_EDGES = ['Contains', 'ControlledBy', 'ExitTo', 'HasThought', 'Holding', 'Wearing'];

function esc(s) {
  return BunnylandUI.escapeHtml(s);
}

function clone(value) {
  return BunnylandUI.cloneJson(value);
}

function parseObject(text) {
  const value = JSON.parse(text || '{}');
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('expected object');
  return value;
}

function makeEmptyWorld() {
  const clockId = 'entity_1';
  return {
    metadata: { version: '1.0', epoch: 0 },
    meta: {
      schema_version: 1,
      seed: '',
      prompt: '',
      generator: '',
      plugins: [],
      saved_at_epoch: 0,
      saved_at: null
    },
    entities: {
      [clockId]: {
        id: clockId,
        prefab: 'entity',
        created_epoch: 0,
        components: { WorldClockComponent: { game_time_seconds: 0, tick_index: 0, time_scale: 1.0 } },
        relationships: {}
      }
    }
  };
}

function parseSaveSnapshot(json) {
  const entities = {};
  for (const [id, fields] of Object.entries(json.entities || {})) {
    entities[id] = {
      id,
      prefab: fields.prefab || 'entity',
      created_epoch: fields.created_epoch || 0,
      components: {},
      relationships: {}
    };
  }
  for (const [ctype, table] of Object.entries(json.components || {})) {
    for (const [eid, fields] of Object.entries(table || {})) {
      if (!entities[eid]) {
        entities[eid] = { id: eid, prefab: 'entity', created_epoch: 0, components: {}, relationships: {} };
      }
      entities[eid].components[ctype] = fields || {};
    }
  }
  for (const [rtype, table] of Object.entries(json.relationships || {})) {
    for (const [eid, edges] of Object.entries(table || {})) {
      if (!entities[eid]) {
        entities[eid] = { id: eid, prefab: 'entity', created_epoch: 0, components: {}, relationships: {} };
      }
      entities[eid].relationships[rtype] = (edges || []).map(item => ({
        target: item.target,
        edge: item.edge || {}
      }));
    }
  }
  return {
    metadata: json.metadata || { version: '1.0', epoch: 0 },
    meta: json.bunnyland || {},
    entities
  };
}

function parseApiSnapshot(json) {
  const entities = {};
  for (const item of json.entities || []) {
    entities[item.id] = parseApiEntity(item);
  }
  return {
    metadata: { version: '1.0', epoch: json.world_epoch || 0 },
    meta: json.metadata || {},
    entities
  };
}

function parseApiEntity(item) {
  const relationships = {};
  for (const [rtype, edges] of Object.entries(item.relationships || {})) {
    relationships[rtype] = (edges || []).map(edge => ({
      target: edge.target_id || edge.target,
      edge: edge.edge || {}
    }));
  }
  return {
    id: item.id,
    prefab: item.prefab || 'entity',
    created_epoch: 0,
    components: item.components || {},
    relationships
  };
}

function parseWorld(json) {
  if (Array.isArray(json.entities)) return parseApiSnapshot(json);
  return parseSaveSnapshot(json);
}

function exportWorld(world) {
  const out = {
    metadata: {
      version: world.metadata?.version || '1.0',
      epoch: Number(world.metadata?.epoch || 0)
    },
    bunnyland: {
      schema_version: 1,
      seed: '',
      prompt: '',
      generator: '',
      plugins: [],
      saved_at_epoch: Number(world.metadata?.epoch || 0),
      saved_at: null,
      ...(world.meta || {})
    },
    prefabs: { entity: { components: {} } },
    entities: {},
    components: {},
    relationships: {},
    relics: []
  };
  out.bunnyland.saved_at_epoch = Number(world.metadata?.epoch || out.bunnyland.saved_at_epoch || 0);
  for (const entity of Object.values(world.entities)) {
    out.entities[entity.id] = {
      prefab: entity.prefab || 'entity',
      created_epoch: Number(entity.created_epoch || 0)
    };
    for (const [ctype, fields] of Object.entries(entity.components || {})) {
      if (!out.components[ctype]) out.components[ctype] = {};
      out.components[ctype][entity.id] = fields || {};
    }
    for (const [rtype, edges] of Object.entries(entity.relationships || {})) {
      const clean = (edges || []).filter(edge => edge.target);
      if (!clean.length) continue;
      if (!out.relationships[rtype]) out.relationships[rtype] = {};
      out.relationships[rtype][entity.id] = clean.map(edge => ({
        target: edge.target,
        edge: edge.edge || {}
      }));
    }
  }
  return out;
}

function entityType(entity) {
  const c = entity.components || {};
  if (c.RoomComponent) return 'room';
  if (c.CharacterComponent) return 'character';
  if (c.DoorComponent) return 'door';
  if (c.ContainerComponent) return 'container';
  if (c.PortableComponent) return 'item';
  if (c.WorldClockComponent) return 'clock';
  return 'other';
}

function entityIcon(entity) {
  const emoji = entity.components?.EditorDisplayComponent?.emoji;
  if (emoji) return emoji;
  return {
    room: '🏠', character: '🐰', door: '🚪', container: '📦',
    item: '✦', clock: '◷', other: '⬡'
  }[entityType(entity)] || '⬡';
}

function entityName(entity) {
  const c = entity.components || {};
  if (c.RoomComponent?.title) return c.RoomComponent.title;
  if (c.IdentityComponent?.name) return c.IdentityComponent.name;
  return entity.id;
}

function inferDirection(text) {
  const words = new Set(String(text || '').toLowerCase().replace(/[-_]/g, ' ').split(/\s+/));
  for (const direction of ['north', 'south', 'east', 'west', 'up', 'down', 'in', 'out', 'northeast', 'northwest', 'southeast', 'southwest']) {
    if (words.has(direction)) return direction;
  }
  return '';
}

function canContainItems(entity) {
  const c = entity?.components || {};
  return Boolean(c.RoomComponent || c.CharacterComponent || c.ContainerComponent);
}

function containModeForEntity(entity, fallback = 'room_content') {
  const c = entity?.components || {};
  if (c.CharacterComponent) return 'inventory';
  if (c.ContainerComponent) return 'container';
  if (c.RoomComponent) return 'room_content';
  return fallback;
}

function componentNames(world) {
  const names = new Set(COMMON_COMPONENTS);
  for (const entity of Object.values(world.entities)) {
    for (const name of Object.keys(entity.components || {})) names.add(name);
  }
  return [...names].sort();
}

function edgeNames(world) {
  const names = new Set(COMMON_EDGES);
  for (const entity of Object.values(world.entities)) {
    for (const name of Object.keys(entity.relationships || {})) names.add(name);
  }
  return [...names].sort();
}

class WorldEditor {
  constructor() {
    this.world = makeEmptyWorld();
    this.selectedId = 'entity_1';
    this.search = '';
    this.liveBase = null;
    this.authHeader = null;
    this.runtimePaused = null;
    this.runtimeRunning = false;
    this.worldSchema = null;
    this.libraryFragments = [];
    this.snapshotVisible = localStorage.getItem('bunnyland.editor.snapshotVisible') !== 'false';
    this._patchTimers = {};
    this._pendingEntityId = null;
    this._applyingDeepLink = false;
    this._bind();
    this._renderAll();
  }

  _bind() {
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (file) await this._loadFile(file);
    });
    document.getElementById('fragment-file').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (file) await this._loadFragmentFile(file);
      e.target.value = '';
    });
    document.getElementById('btn-new').addEventListener('click', () => this._newWorld());
    document.getElementById('btn-fetch').addEventListener('click', () => this._fetchSnapshot());
    document.getElementById('btn-save-live').addEventListener('click', () => this._saveLive());
    document.getElementById('btn-toggle-live').addEventListener('click', () => this._toggleLive());
    document.getElementById('btn-download').addEventListener('click', () => this._download());
    document.getElementById('btn-copy').addEventListener('click', () => this._copy());
    document.getElementById('btn-toggle-snapshot').addEventListener('click', () => this._toggleSnapshot());
    document.getElementById('btn-refresh-library').addEventListener('click', () => this._refreshLibrary({ prompt: true }));
    document.getElementById('btn-import-fragment').addEventListener('click', () => this._importSelectedFragment());
    document.getElementById('btn-export-fragment').addEventListener('click', () => this._exportSelectedFragment());
    document.getElementById('btn-add-entity').addEventListener('click', () => this._addEntity());
    document.getElementById('btn-delete-entity').addEventListener('click', () => this._deleteEntity());
    document.getElementById('entity-search').addEventListener('input', (e) => {
      this.search = e.target.value;
      this._renderEntities();
    });
    for (const id of ['meta-seed', 'meta-generator', 'meta-epoch']) {
      document.getElementById(id).addEventListener('input', () => {
        this.world.meta.seed = document.getElementById('meta-seed').value;
        this.world.meta.generator = document.getElementById('meta-generator').value;
        this.world.metadata.epoch = Number(document.getElementById('meta-epoch').value || 0);
        this.world.meta.saved_at_epoch = this.world.metadata.epoch;
        this._renderJson();
        this._renderInfo();
      });
    }
  }

  _status(text, kind) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = kind || '';
  }

  async _loadFile(file) {
    try {
      this.world = parseWorld(JSON.parse(await file.text()));
      this._selectEntity(this._initialEntityId(), { sync: false });
      this.liveBase = null;
      this.authHeader = null;
      this.worldSchema = null;
      this._setRuntime(null, false);
      this._renderAll();
      this._syncUrl();
      this._status('World loaded', 'ok');
    } catch (err) {
      this._status(`Load error: ${err.message}`, 'err');
    }
  }

  async _fetchSnapshot() {
    const base = document.getElementById('api-url').value.trim().replace(/\/$/, '');
    if (!base) return;
    try {
      const res = await fetch(`${base}/world/snapshot`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      this.world = parseWorld(await res.json());
      this._selectEntity(this._initialEntityId(), { sync: false });
      this.liveBase = base;
      this._renderAll();
      await this._refreshRuntime({ prompt: true });
      await this._refreshSchema({ prompt: true });
      await this._refreshLibrary({ prompt: false });
      this._syncUrl();
      this._status('Server snapshot loaded · live patches enabled', 'ok');
    } catch (err) {
      this._status(`Server error: ${err.message}`, 'err');
    }
  }

  _newWorld() {
    this.world = makeEmptyWorld();
    this._selectEntity('entity_1', { sync: false });
    this.liveBase = null;
    this.authHeader = null;
    this.worldSchema = null;
    this._setRuntime(null, false);
    this._renderAll();
    this._syncUrl();
    this._status('New world created', 'ok');
  }

  async _sendPatch(operations, { merge = false, status = 'Patch applied' } = {}) {
    if (!this.liveBase || !operations.length) return null;
    const data = await this._sendAdmin('/admin/world', {
      method: 'PATCH',
      body: JSON.stringify({ operations }),
      status
    });
    if (merge) this._mergePatchResponse(data);
    return data;
  }

  async _sendAdmin(path, { method, body = null, status = null, prompt = true }) {
    if (!this.liveBase) throw new Error('Load a server snapshot first');
    const headers = () => ({
      'Content-Type': 'application/json',
      ...(this.authHeader ? { Authorization: this.authHeader } : {})
    });
    let res = await fetch(`${this.liveBase}${path}`, { method, headers: headers(), body });
    if (res.status === 401 && prompt && this._promptBasicAuth()) {
      res = await fetch(`${this.liveBase}${path}`, { method, headers: headers(), body });
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    if (status) this._status(status, 'ok');
    return data;
  }

  async _saveLive() {
    try {
      const data = await this._sendAdmin('/admin/world/save', {
        method: 'POST',
        status: 'World saved'
      });
      if (data.world_epoch != null) {
        this.world.metadata.epoch = data.world_epoch;
        this.world.meta.saved_at_epoch = data.saved_at_epoch ?? data.world_epoch;
        this._renderAll();
      }
    } catch (err) {
      this._status(`Save error: ${err.message}`, 'err');
    }
  }

  async _refreshRuntime({ prompt = false } = {}) {
    try {
      const data = await this._sendAdmin('/admin/runtime', { method: 'GET', prompt });
      this._applyRuntime(data);
    } catch (err) {
      this._setRuntime(null, false);
      if (prompt) this._status(`Runtime error: ${err.message}`, 'err');
    }
  }

  async _refreshSchema({ prompt = false } = {}) {
    if (!this.liveBase) {
      this.worldSchema = null;
      return;
    }
    try {
      const res = await fetch(`${this.liveBase}/world/schema`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
      this.worldSchema = data;
      this._renderAll();
    } catch (err) {
      this.worldSchema = null;
      if (prompt) this._status(`Schema error: ${err.message}`, 'err');
    }
  }

  async _refreshLibrary({ prompt = false } = {}) {
    if (!this.liveBase) {
      if (prompt) this._status('Load a server snapshot before refreshing the library', 'err');
      return;
    }
    try {
      const res = await fetch(`${this.liveBase}/world/library`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
      this.libraryFragments = this._normalizeFragmentPayload(data, data.library_id || 'server');
      this._renderLibraryControls();
      if (prompt) this._status(`Loaded ${this.libraryFragments.length} library fragments`, 'ok');
    } catch (err) {
      if (prompt) this._status(`Library error: ${err.message}`, 'err');
    }
  }

  _normalizeFragmentPayload(data, source) {
    const raw = Array.isArray(data?.fragments) ? data.fragments : [data];
    return raw
      .filter(fragment => fragment && Array.isArray(fragment.operations))
      .map((fragment, index) => ({
        schema_version: fragment.schema_version || 1,
        id: fragment.id || `${source}/fragment-${index + 1}`,
        title: fragment.title || fragment.id || `Fragment ${index + 1}`,
        kind: fragment.kind || 'fragment',
        description: fragment.description || '',
        tags: Array.isArray(fragment.tags) ? fragment.tags : [],
        root_client_id: fragment.root_client_id || null,
        attach_edge: fragment.attach_edge || null,
        operations: clone(fragment.operations),
        source
      }));
  }

  async _loadFragmentFile(file) {
    try {
      const fragments = this._normalizeFragmentPayload(JSON.parse(await file.text()), file.name);
      if (!fragments.length) throw new Error('no fragments found');
      const existing = new Set(this.libraryFragments.map(fragment => fragment.id));
      for (const fragment of fragments) {
        const id = existing.has(fragment.id) ? `${file.name}/${fragment.id}` : fragment.id;
        this.libraryFragments.push({ ...fragment, id });
        existing.add(id);
      }
      this._renderLibraryControls();
      this._status(`Loaded ${fragments.length} fragment${fragments.length === 1 ? '' : 's'}`, 'ok');
    } catch (err) {
      this._status(`Fragment load error: ${err.message}`, 'err');
    }
  }

  async _toggleLive() {
    try {
      if (this.runtimePaused == null) await this._refreshRuntime({ prompt: true });
      if (this.runtimePaused == null) throw new Error('Runtime status unavailable');
      const data = await this._sendAdmin(this.runtimePaused ? '/admin/resume' : '/admin/pause', {
        method: 'POST',
        status: this.runtimePaused ? 'World resumed' : 'World paused'
      });
      this._applyRuntime(data);
    } catch (err) {
      this._status(`Runtime error: ${err.message}`, 'err');
    }
  }

  _applyRuntime(data) {
    if (data.world_epoch != null) this.world.metadata.epoch = data.world_epoch;
    this._setRuntime(data.paused, data.running);
    this._renderInfo();
  }

  _setRuntime(paused, running) {
    this.runtimePaused = paused == null ? null : Boolean(paused);
    this.runtimeRunning = Boolean(running);
    this._renderRuntime();
  }

  _toggleSnapshot() {
    this.snapshotVisible = !this.snapshotVisible;
    localStorage.setItem('bunnyland.editor.snapshotVisible', String(this.snapshotVisible));
    this._renderSnapshotVisibility();
  }

  _renderSnapshotVisibility() {
    const main = document.getElementById('main');
    const button = document.getElementById('btn-toggle-snapshot');
    main.classList.toggle('snapshot-hidden', !this.snapshotVisible);
    button.textContent = this.snapshotVisible ? 'Hide Snapshot' : 'Show Snapshot';
    button.title = this.snapshotVisible ? 'Hide snapshot JSON pane' : 'Show snapshot JSON pane';
  }

  _renderRuntime() {
    const button = document.getElementById('btn-toggle-live');
    const status = document.getElementById('runtime-status');
    button.disabled = !this.liveBase;
    if (!this.liveBase) {
      button.textContent = '⏯';
      button.title = 'Load a server snapshot before changing runtime state';
      status.textContent = 'runtime: offline';
    } else if (this.runtimePaused == null) {
      button.textContent = '⏯';
      button.title = 'Runtime status is locked or unavailable';
      status.textContent = 'runtime: locked';
    } else if (this.runtimePaused) {
      button.textContent = '▶';
      button.title = 'Resume world ticks';
      status.textContent = 'runtime: paused';
    } else {
      button.textContent = '⏸';
      button.title = 'Pause world ticks';
      status.textContent = this.runtimeRunning ? 'runtime: playing' : 'runtime: stopped';
    }
  }

  _promptBasicAuth() {
    const username = window.prompt('Admin username');
    if (!username) return false;
    const password = window.prompt('Admin password');
    if (password == null) return false;
    this.authHeader = `Basic ${btoa(`${username}:${password}`)}`;
    return true;
  }

  _mergePatchResponse(data) {
    for (const id of data.deleted_entities || []) {
      delete this.world.entities[id];
    }
    for (const item of data.changed_entities || []) {
      this.world.entities[item.id] = parseApiEntity(item);
    }
    if (data.world_epoch != null) {
      this.world.metadata.epoch = data.world_epoch;
      this.world.meta.saved_at_epoch = data.world_epoch;
    }
    if (this.selectedId && !this.world.entities[this.selectedId]) {
      this._selectEntity(Object.keys(this.world.entities)[0] || null, { sync: false });
    }
  }

  _debouncedPatch(key, operations, status) {
    if (!this.liveBase) return;
    clearTimeout(this._patchTimers[key]);
    this._patchTimers[key] = setTimeout(async () => {
      try {
        await this._sendPatch(operations, { status });
      } catch (err) {
        this._status(`Patch error: ${err.message}`, 'err');
      }
    }, 350);
  }

  _renderAll() {
    document.getElementById('meta-seed').value = this.world.meta?.seed || '';
    document.getElementById('meta-generator').value = this.world.meta?.generator || '';
    document.getElementById('meta-epoch').value = Number(this.world.metadata?.epoch || 0);
    this._renderOptions();
    this._renderEntities();
    this._renderEditor();
    this._renderJson();
    this._renderInfo();
    this._renderLibraryControls();
    this._renderSnapshotVisibility();
  }

  _renderOptions() {
    document.getElementById('component-options').innerHTML =
      this._componentNames().map(name => `<option value="${esc(name)}"></option>`).join('');
    document.getElementById('edge-options').innerHTML =
      edgeNames(this.world).map(name => `<option value="${esc(name)}"></option>`).join('');
    document.getElementById('entity-options').innerHTML =
      Object.keys(this.world.entities).sort().map(id => `<option value="${esc(id)}">${esc(entityName(this.world.entities[id]))}</option>`).join('');
  }

  _componentNames() {
    const names = new Set(componentNames(this.world));
    for (const name of Object.keys(this.worldSchema?.components || {})) names.add(name);
    return [...names].sort();
  }

  _componentSchema(type) {
    return this.worldSchema?.components?.[type]?.json_schema || null;
  }

  _resolveSchemaRef(schema, root) {
    if (!schema?.$ref) return schema || {};
    const prefix = '#/$defs/';
    if (!schema.$ref.startsWith(prefix)) return schema;
    return root?.$defs?.[schema.$ref.slice(prefix.length)] || schema;
  }

  _fieldSchema(schema, root) {
    const resolved = this._resolveSchemaRef(schema, root);
    const variants = this._schemaVariants(resolved);
    const concrete = variants
      ? variants.find(item => item.type !== 'null') || variants[0]
      : resolved;
    const field = { ...this._resolveSchemaRef(concrete, root) };
    if (Object.prototype.hasOwnProperty.call(schema || {}, 'default')) field.default = schema.default;
    if (Object.prototype.hasOwnProperty.call(resolved, 'default')) field.default = resolved.default;
    if (Object.prototype.hasOwnProperty.call(schema || {}, 'title')) field.title = schema.title;
    if (Object.prototype.hasOwnProperty.call(schema || {}, 'description')) field.description = schema.description;
    if (variants) field.nullable = variants.some(item => item.type === 'null');
    return field;
  }

  _schemaVariants(schema) {
    if (Array.isArray(schema?.anyOf)) return schema.anyOf;
    if (Array.isArray(schema?.oneOf)) return schema.oneOf;
    return null;
  }

  _enumOptions(schema, root) {
    const resolved = this._resolveSchemaRef(schema, root);
    if (Array.isArray(resolved.enum)) return resolved.enum;
    if (Object.prototype.hasOwnProperty.call(resolved, 'const')) return [resolved.const];
    const variants = this._schemaVariants(resolved);
    if (!variants) return [];
    const options = [];
    for (const variant of variants) {
      if (variant.type === 'null') continue;
      for (const option of this._enumOptions(variant, root)) {
        if (!options.includes(option)) options.push(option);
      }
    }
    return options;
  }

  _defaultForSchema(schema, root) {
    const field = this._fieldSchema(schema, root);
    if (Object.prototype.hasOwnProperty.call(field, 'default')) return clone(field.default);
    const enumOptions = this._enumOptions(field, root);
    if (enumOptions.length) return enumOptions[0];
    if (field.type === 'boolean') return false;
    if (field.type === 'integer' || field.type === 'number') return 0;
    if (field.type === 'array') return [];
    if (field.type === 'object') return {};
    return '';
  }

  _renderInfo() {
    const count = Object.keys(this.world.entities).length;
    document.getElementById('world-info').textContent = `${count} entities · epoch ${this.world.metadata?.epoch || 0}`;
    this._renderRuntime();
  }

  _renderLibraryControls() {
    const wrap = document.getElementById('library-select-wrap');
    const button = document.getElementById('btn-import-fragment');
    if (!wrap || !button) return;
    const value = this.libraryFragments[0]?.id || '';
    wrap.innerHTML = this._renderSearchDropdown({
      id: 'library-select',
      dropdownId: 'fragment-dropdown',
      options: this.libraryFragments.map(fragment => ({
        value: fragment.id,
        label: `${fragment.kind} · ${fragment.title}`
      })),
      value,
      placeholder: 'find fragment...',
      disabled: !this.libraryFragments.length
    });
    this._bindSearchDropdown(wrap.querySelector('.search-dropdown'));
    button.disabled = !this.libraryFragments.length;
  }

  _renderSearchDropdown({ id, dropdownId, options, value = '', placeholder = 'search...', disabled = false }) {
    const selected = options.find(option => option.value === value) || options[0] || null;
    return `
      <span class="search-dropdown" id="${esc(dropdownId)}" data-options="${esc(JSON.stringify(options))}">
        <input class="search-dropdown-input" type="text" value="${esc(selected?.label || '')}" placeholder="${esc(placeholder)}" spellcheck="false" autocomplete="off" ${disabled ? 'disabled' : ''}>
        <input class="search-dropdown-value" id="${esc(id)}" type="hidden" value="${esc(selected?.value || '')}">
        <div class="search-dropdown-menu hidden"></div>
      </span>
    `;
  }

  _bindSearchDropdown(root) {
    if (!root) return;
    BunnylandUI.bindSearchDropdown(root, {
      options: JSON.parse(root.dataset.options || '[]'),
      value: root.querySelector('.search-dropdown-value')?.value || ''
    });
  }

  _renderEntities() {
    const list = document.getElementById('entity-list');
    const q = this.search.trim().toLowerCase();
    const entities = Object.values(this.world.entities)
      .sort((a, b) => entityName(a).localeCompare(entityName(b)))
      .filter(entity => {
        if (!q) return true;
        return [
          entity.id, entityName(entity), entityType(entity),
          ...Object.keys(entity.components || {})
        ].join(' ').toLowerCase().includes(q);
      });
    document.getElementById('entity-count').textContent = `${entities.length}/${Object.keys(this.world.entities).length}`;
    if (!entities.length) {
      list.innerHTML = '<div class="empty">No entities.</div>';
      return;
    }
    list.innerHTML = entities.map(entity => `
      <div class="entity-row ${entity.id === this.selectedId ? 'active' : ''}" data-id="${esc(entity.id)}">
        <div>${entityIcon(entity)}</div>
        <div>
          <div class="entity-name">${esc(entityName(entity))}</div>
          <div class="entity-meta">${esc(entityType(entity))} · ${esc(entity.id)}</div>
        </div>
      </div>
    `).join('');
    for (const row of list.querySelectorAll('.entity-row')) {
      row.addEventListener('click', () => {
        this._selectEntity(row.dataset.id, { render: true });
      });
    }
  }

  _selected() {
    return this.selectedId ? this.world.entities[this.selectedId] : null;
  }

  _initialEntityId() {
    if (this._pendingEntityId && this.world.entities[this._pendingEntityId]) return this._pendingEntityId;
    return Object.keys(this.world.entities)[0] || null;
  }

  _selectEntity(id, { render = false, sync = true } = {}) {
    this.selectedId = id && this.world.entities[id] ? id : Object.keys(this.world.entities)[0] || null;
    if (this.selectedId && this.selectedId === this._pendingEntityId) this._pendingEntityId = null;
    if (render) {
      this._renderEntities();
      this._renderEditor();
    }
    if (sync) this._syncUrl();
  }

  _syncUrl() {
    if (this._applyingDeepLink) return;
    const url = new URL(location.href);
    if (this.liveBase) url.searchParams.set('server', this.liveBase);
    else url.searchParams.delete('server');
    url.hash = this.selectedId ? encodeURIComponent(this.selectedId) : '';
    history.replaceState(null, '', url.toString());
  }

  _serverUrlForLinks() {
    return this.liveBase || document.getElementById('api-url').value.trim().replace(/\/$/, '');
  }

  _inspectorHref(entityId) {
    const url = new URL('index.html', location.href);
    const server = this._serverUrlForLinks();
    if (server) url.searchParams.set('server', server);
    else url.searchParams.delete('server');
    url.hash = entityId ? `map/${encodeURIComponent(entityId)}` : '';
    return url.toString();
  }

  _applyDeepLink({ entity } = {}) {
    this._pendingEntityId = entity || null;
    if (!entity || !this.world.entities[entity]) {
      this._syncUrl();
      return;
    }
    this._applyingDeepLink = true;
    try {
      this._selectEntity(entity, { render: true, sync: false });
    } finally {
      this._applyingDeepLink = false;
      this._syncUrl();
    }
  }

  _renderEditor() {
    const root = document.getElementById('entity-editor');
    const entity = this._selected();
    document.getElementById('selected-label').textContent = entity ? entity.id : 'No selection';
    const inspectorLink = document.getElementById('inspector-link');
    inspectorLink.hidden = !entity;
    if (entity) inspectorLink.href = this._inspectorHref(entity.id);
    document.getElementById('btn-delete-entity').disabled = !entity;
    if (!entity) {
      root.innerHTML = '<div class="empty">Select or add an entity.</div>';
      return;
    }
    root.innerHTML = `
      <div class="section">
        <div class="section-title">Entity</div>
        <div class="form-grid">
          <label class="field wide">Entity ID
            <input id="entity-id" type="text" value="${esc(entity.id)}" spellcheck="false">
          </label>
          <label class="field">Prefab
            <input id="entity-prefab" type="text" value="${esc(entity.prefab || 'entity')}" spellcheck="false">
          </label>
          <label class="field">Created Epoch
            <input id="entity-created" type="number" min="0" value="${Number(entity.created_epoch || 0)}">
          </label>
        </div>
        <div class="button-row">
          <button id="btn-rename-entity">Apply Entity Fields</button>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Components ${this._renderAddComponentControl(entity)}</div>
        <div id="component-list">${this._renderComponents(entity)}</div>
      </div>
      ${this._renderGeneration(entity)}
      <div class="section">
        <div class="section-title">Outgoing Edges <button id="btn-add-edge">Add Edge</button></div>
        <div id="edge-list">${this._renderEdges(entity)}</div>
      </div>
    `;
    this._bindEditor(root, entity);
  }

  _renderAddComponentControl(entity) {
    const existing = new Set(Object.keys(entity.components || {}));
    const options = this._componentNames().filter(name => !existing.has(name));
    const disabled = options.length ? '' : ' disabled';
    return `
      ${this._renderSearchDropdown({
        id: 'add-component-type',
        dropdownId: 'add-component-dropdown',
        options: options.map(name => ({ value: name, label: name })),
        placeholder: 'find component...',
        disabled: !options.length
      })}
      <button id="btn-add-component"${disabled}>Add Component</button>
    `;
  }

  _renderComponents(entity) {
    const entries = Object.entries(entity.components || {}).sort(([a], [b]) => a.localeCompare(b));
    if (!entries.length) return '<div class="empty">No components.</div>';
    return entries.map(([type, fields]) => `
      <div class="record-card component-card" data-type="${esc(type)}">
        <div class="record-head">${esc(type)} <button data-delete-component="${esc(type)}">Delete</button></div>
        <div class="record-body">
          ${this._renderComponentFields(type, fields || {})}
        </div>
      </div>
    `).join('');
  }

  _renderComponentFields(type, fields) {
    const schema = this._componentSchema(type);
    const properties = schema?.properties || null;
    if (!properties) {
      return `
        <label class="field full">Fields
          <textarea class="component-json" spellcheck="false">${esc(JSON.stringify(fields || {}, null, 2))}</textarea>
        </label>
      `;
    }
    const rows = Object.entries(properties).map(([name, rawSchema]) => {
      const field = this._fieldSchema(rawSchema, schema);
      const value = Object.prototype.hasOwnProperty.call(fields, name)
        ? fields[name]
        : this._defaultForSchema(field, schema);
      return this._renderComponentField(name, field, value, schema);
    }).join('');
    return `
      <div class="form-grid typed-component-fields">${rows}</div>
      <details class="raw-json">
        <summary>Raw JSON</summary>
        <textarea class="component-json" spellcheck="false">${esc(JSON.stringify(fields || {}, null, 2))}</textarea>
      </details>
    `;
  }

  _renderComponentField(name, schema, value, root) {
    const label = esc(schema.title || name);
    const labelRow = this._fieldLabel(name, label, schema, value);
    const nullable = schema.nullable ? ' data-nullable="true"' : '';
    const disabled = schema.nullable && value == null ? ' disabled' : '';
    const data = `data-field="${esc(name)}" data-kind="${esc(schema.type || 'string')}"${nullable}${disabled}`;
    const enumOptions = this._enumOptions(schema, root);
    const hasMaxLength = Object.prototype.hasOwnProperty.call(schema, 'maxLength');
    const multilineTextNames = new Set([
      'appearance', 'biography', 'description', 'long', 'prompt', 'short', 'summary', 'text'
    ]);
    if (this._isTagListField(name, schema)) {
      const tags = Array.isArray(value) ? value.map(tag => String(tag)) : [];
      return `
        <div class="field full">${labelRow}
          <div class="tag-editor" data-tags-field="${esc(name)}">
            <input class="component-field component-tags-value" ${data} type="hidden" value="${esc(JSON.stringify(tags))}">
            <div class="tag-list">
              ${tags.map(tag => `
                <span class="tag-pill">
                  <span>${esc(tag)}</span>
                  <button type="button" data-remove-tag="${esc(tag)}" aria-label="Remove tag ${esc(tag)}">x</button>
                </span>
              `).join('') || '<span class="tiny">No tags.</span>'}
            </div>
            <div class="tag-entry">
              <input class="tag-input" type="text" placeholder="add tag..." spellcheck="false">
              <button type="button" data-add-tag>Add Tag</button>
            </div>
          </div>
        </div>
      `;
    }
    const itemEnumOptions = schema.type === 'array'
      ? this._enumOptions(Array.isArray(schema.items) ? schema.items[0] : schema.items, root)
      : [];
    if (schema.type === 'array' && itemEnumOptions.length) {
      const selected = Array.isArray(value) ? value.map(option => String(option)) : [];
      const available = itemEnumOptions.map(option => String(option)).filter(option => !selected.includes(option));
      return `
        <div class="field full">${labelRow}
          <div class="tag-editor enum-list-editor" data-enum-list-field="${esc(name)}" data-enum-options="${esc(JSON.stringify(itemEnumOptions.map(option => String(option))))}">
            <input class="component-field component-enum-list-value" ${data} type="hidden" value="${esc(JSON.stringify(selected))}">
            <div class="tag-list enum-list">
              ${selected.map(option => `
                <span class="tag-pill">
                  <span>${esc(option)}</span>
                  <button type="button" data-remove-enum-option="${esc(option)}" aria-label="Remove ${esc(option)}">x</button>
                </span>
              `).join('') || '<span class="tiny">No options selected.</span>'}
            </div>
            <div class="tag-entry">
              <select class="enum-list-select" ${available.length ? '' : 'disabled'}>
                ${available.map(option => `<option value="${esc(option)}">${esc(option)}</option>`).join('')}
              </select>
              <button type="button" data-add-enum-option ${available.length ? '' : 'disabled'}>Add Option</button>
            </div>
          </div>
        </div>
      `;
    }
    if (this._isMeterField(schema)) {
      const meter = this._meterValue(schema, value);
      return `
        <div class="field full">${labelRow}
          <div class="meter-editor">
            <input class="component-field component-meter-value" ${data} type="hidden" value="${esc(JSON.stringify(meter))}">
            <div class="meter-controls">${this._renderMeterEditor(meter)}</div>
          </div>
        </div>
      `;
    }
    if (enumOptions.length) {
      return `
        <label class="field wide">${labelRow}
          <select class="component-field" ${data}>
            ${schema.nullable ? `<option value="" ${value == null ? 'selected' : ''}></option>` : ''}
            ${enumOptions.map(option => {
              const optionValue = String(option);
              return `<option value="${esc(optionValue)}" ${optionValue === String(value ?? '') ? 'selected' : ''}>${esc(optionValue)}</option>`;
            }).join('')}
          </select>
        </label>
      `;
    }
    if (schema.type === 'boolean') {
      return `
        <label class="field">${labelRow}
          <input class="component-field" ${data} type="checkbox" ${value ? 'checked' : ''}>
        </label>
      `;
    }
    if (schema.type === 'integer' || schema.type === 'number') {
      const step = schema.type === 'integer' ? '1' : 'any';
      return `
        <label class="field">${labelRow}
          <input class="component-field" ${data} type="number" step="${step}" value="${esc(value ?? '')}">
        </label>
      `;
    }
    if (schema.type === 'array' || schema.type === 'object') {
      return `
        <label class="field full">${labelRow}
          <textarea class="component-field component-field-json" ${data} spellcheck="false">${esc(JSON.stringify(value ?? (schema.type === 'array' ? [] : {}), null, 2))}</textarea>
        </label>
      `;
    }
    if (
      schema.type === 'string' &&
      (hasMaxLength
        ? Number(schema.maxLength || 0) > 80
        : multilineTextNames.has(String(name).toLowerCase()))
    ) {
      return `
        <label class="field full">${labelRow}
          <textarea class="component-field" ${data} spellcheck="false">${esc(value ?? '')}</textarea>
        </label>
      `;
    }
    return `
      <label class="field wide">${labelRow}
        <input class="component-field" ${data} type="text" value="${esc(value ?? '')}" spellcheck="false">
      </label>
    `;
  }

  _fieldLabel(name, label, schema, value) {
    if (!schema.nullable) return label;
    return `
      <span class="field-label">
        <span>${label}</span>
        <span class="nullable-choice">
          <input class="nullable-toggle" type="checkbox" data-field="${esc(name)}" ${value == null ? 'checked' : ''}>
          null
        </span>
      </span>
    `;
  }

  _isTagListField(name, schema) {
    const itemSchema = Array.isArray(schema.items) ? schema.items[0] : schema.items;
    const fieldName = String(name).toLowerCase();
    const title = String(schema.title || '').toLowerCase();
    return (
      schema.type === 'array' &&
      itemSchema?.type === 'string' &&
      (fieldName === 'tags' || fieldName === 'labels' || title === 'tags' || title === 'labels')
    );
  }

  _isMeterField(schema) {
    const properties = schema.properties || {};
    return (
      schema.type === 'object' &&
      (schema.title === 'Meter' ||
        ('value' in properties && 'minimum' in properties && 'maximum' in properties))
    );
  }

  _meterValue(schema, value) {
    const properties = schema.properties || {};
    const meter = value && typeof value === 'object' && !Array.isArray(value) ? { ...value } : {};
    for (const [key, field] of Object.entries(properties)) {
      if (!Object.prototype.hasOwnProperty.call(meter, key) && Object.prototype.hasOwnProperty.call(field, 'default')) {
        meter[key] = field.default;
      }
    }
    return {
      value: 0,
      minimum: 0,
      maximum: 100,
      ...meter
    };
  }

  _renderMeterEditor(meter) {
    const minimum = Number(meter.minimum ?? 0);
    const maximum = Number(meter.maximum ?? 100);
    const value = Math.max(minimum, Math.min(maximum, Number(meter.value ?? minimum)));
    const fields = [
      ['value', 'Value'],
      ['minimum', 'Minimum'],
      ['maximum', 'Maximum'],
      ['warning_at', 'Warning'],
      ['urgent_at', 'Urgent'],
      ['crisis_at', 'Crisis']
    ].filter(([key]) => Object.prototype.hasOwnProperty.call(meter, key));
    return `
      <div class="meter-line">
        <input class="meter-range" data-meter-key="value" type="range" min="${esc(minimum)}" max="${esc(maximum)}" step="any" value="${esc(value)}">
        <span class="meter-readout">${esc(this._formatMeterValue(value))} / ${esc(this._formatMeterValue(maximum))}</span>
      </div>
      <div class="meter-grid">
        ${fields.map(([key, title]) => `
          <label>${esc(title)}
            <input class="meter-input" data-meter-key="${esc(key)}" type="number" step="any" value="${esc(meter[key] ?? '')}">
          </label>
        `).join('')}
      </div>
    `;
  }

  _formatMeterValue(value) {
    const number = Number(value);
    return Number.isFinite(number) ? number.toFixed(1) : String(value ?? '');
  }

  _renderGeneration(entity) {
    const sections = [];
    const disabled = this.liveBase ? '' : ' disabled';
    if (entity.components?.DoorComponent) {
      sections.push(`
        <div class="record-card">
          <div class="record-head">Generate Room</div>
          <div class="record-body">
            <div class="form-grid">
              <label class="field">Direction
                <input id="gen-room-direction" type="text" value="${esc(inferDirection(entityName(entity)))}" spellcheck="false"${disabled}>
              </label>
              <label class="field full">Prompt / Theme
                <textarea id="gen-room-prompt" spellcheck="false"${disabled}></textarea>
              </label>
            </div>
            <div class="button-row">
              <button id="btn-gen-room"${disabled}>Generate and Apply Room</button>
            </div>
          </div>
        </div>
      `);
    }
    if (entity.components?.RoomComponent) {
      sections.push(`
        <div class="record-card">
          <div class="record-head">Generate Character</div>
          <div class="record-body">
            <label class="field full">Prompt / Theme
              <textarea id="gen-character-prompt" spellcheck="false"${disabled}></textarea>
            </label>
            <div class="button-row">
              <button id="btn-gen-character"${disabled}>Generate and Apply Character</button>
            </div>
          </div>
        </div>
      `);
    }
    if (canContainItems(entity)) {
      sections.push(`
        <div class="record-card">
          <div class="record-head">Generate Item</div>
          <div class="record-body">
            <label class="field full">Prompt / Theme
              <textarea id="gen-item-prompt" spellcheck="false"${disabled}></textarea>
            </label>
            <div class="button-row">
              <button id="btn-gen-item"${disabled}>Generate and Apply Item</button>
            </div>
          </div>
        </div>
      `);
    }
    if (!sections.length) return '';
    return `
      <div class="section">
        <div class="section-title">DM Generation</div>
        ${sections.join('')}
        ${this.liveBase ? '' : '<div class="tiny">Load a server snapshot to generate live patches.</div>'}
      </div>
    `;
  }

  _renderEdges(entity) {
    const rows = [];
    for (const [type, edges] of Object.entries(entity.relationships || {}).sort(([a], [b]) => a.localeCompare(b))) {
      for (const [index, edge] of (edges || []).entries()) {
        rows.push(`
          <div class="record-card edge-card" data-type="${esc(type)}" data-index="${index}">
            <div class="record-head">${esc(type)} → ${esc(edge.target || '')} <button data-delete-edge="${esc(type)}:${index}">Delete</button></div>
            <div class="record-body">
              <div class="form-grid">
                <label class="field wide">Target
                  <input class="edge-target" list="entity-options" type="text" value="${esc(edge.target || '')}" spellcheck="false">
                </label>
                <label class="field full">Edge Fields
                  <textarea class="edge-json" spellcheck="false">${esc(JSON.stringify(edge.edge || {}, null, 2))}</textarea>
                </label>
              </div>
            </div>
          </div>
        `);
      }
    }
    return rows.join('') || '<div class="empty">No outgoing edges.</div>';
  }

  _bindEditor(root, entity) {
    document.getElementById('btn-rename-entity').addEventListener('click', () => this._applyEntityFields());
    document.getElementById('btn-add-component').addEventListener('click', () => this._addComponent());
    document.getElementById('btn-add-edge').addEventListener('click', () => this._addEdge());
    this._bindSearchDropdown(root.querySelector('#add-component-dropdown'));
    root.querySelector('#btn-gen-room')?.addEventListener('click', () => this._generateRoom());
    root.querySelector('#btn-gen-character')?.addEventListener('click', () => this._generateCharacter());
    root.querySelector('#btn-gen-item')?.addEventListener('click', () => this._generateItem());
    for (const btn of root.querySelectorAll('[data-delete-component]')) {
      btn.addEventListener('click', () => this._deleteComponent(btn.dataset.deleteComponent));
    }
    for (const btn of root.querySelectorAll('[data-delete-edge]')) {
      btn.addEventListener('click', () => {
        const [type, rawIndex] = btn.dataset.deleteEdge.split(':');
        this._deleteEdge(type, Number(rawIndex));
      });
    }
    for (const card of root.querySelectorAll('.component-card')) {
      const type = card.dataset.type;
      const textarea = card.querySelector('.component-json');
      textarea?.addEventListener('input', () => {
        textarea.classList.remove('bad-json');
        try {
          const fields = parseObject(textarea.value);
          entity.components[type] = fields;
          this._renderJson();
          this._renderEntities();
          this._renderOptions();
          this._debouncedPatch(
            `component:${entity.id}:${type}`,
            [{ op: 'set_component', entity_id: entity.id, component: { type, fields } }],
            'Component patched'
          );
        } catch (_err) {
          textarea.classList.add('bad-json');
        }
      });
      for (const input of card.querySelectorAll('.component-field')) {
        input.addEventListener('input', () => this._updateTypedComponent(card, entity, type));
        input.addEventListener('change', () => this._updateTypedComponent(card, entity, type));
      }
      for (const toggle of card.querySelectorAll('.nullable-toggle')) {
        this._syncNullableControl(toggle);
        toggle.addEventListener('change', () => {
          this._syncNullableControl(toggle);
          this._updateTypedComponent(card, entity, type);
        });
      }
      for (const editor of card.querySelectorAll('.tag-editor:not(.enum-list-editor)')) {
        this._bindTagEditor(editor, card, entity, type);
      }
      for (const editor of card.querySelectorAll('.enum-list-editor')) {
        this._bindEnumListEditor(editor, card, entity, type);
      }
      for (const editor of card.querySelectorAll('.meter-editor')) {
        this._bindMeterEditor(editor, card, entity, type);
      }
    }
    for (const card of root.querySelectorAll('.edge-card')) {
      const type = card.dataset.type;
      const index = Number(card.dataset.index);
      const target = card.querySelector('.edge-target');
      const json = card.querySelector('.edge-json');
      let lastTarget = entity.relationships[type]?.[index]?.target || '';
      const update = () => {
        json.classList.remove('bad-json');
        try {
          const nextTarget = target.value.trim();
          const edge = parseObject(json.value);
          entity.relationships[type][index] = { target: nextTarget, edge };
          this._renderJson();
          if (nextTarget) {
            const operations = [];
            if (lastTarget && lastTarget !== nextTarget) {
              operations.push({
                op: 'remove_edge',
                source_id: entity.id,
                target_id: lastTarget,
                edge_type: type
              });
            }
            operations.push({
              op: 'set_edge',
              source_id: entity.id,
              target_id: nextTarget,
              edge: { type, fields: edge }
            });
            lastTarget = nextTarget;
            this._debouncedPatch(
              `edge:${entity.id}:${type}:${index}`,
              operations,
              'Edge patched'
            );
          }
        } catch (_err) {
          json.classList.add('bad-json');
        }
      };
      target.addEventListener('input', update);
      json.addEventListener('input', update);
    }
  }

  _bindTagEditor(editor, card, entity, type) {
    const input = editor.querySelector('.tag-input');
    const add = editor.querySelector('[data-add-tag]');
    const hidden = editor.querySelector('.component-tags-value');
    const update = (tags) => {
      hidden.value = JSON.stringify(tags);
      this._renderTagEditor(editor, tags);
      this._updateTypedComponent(card, entity, type);
    };
    const readTags = () => {
      try {
        const parsed = JSON.parse(hidden.value || '[]');
        return Array.isArray(parsed) ? parsed.map(tag => String(tag)) : [];
      } catch (_err) {
        return [];
      }
    };
    const addTag = () => {
      const tag = input.value.trim();
      if (!tag) return;
      const tags = readTags();
      if (!tags.includes(tag)) tags.push(tag);
      input.value = '';
      update(tags);
      input.focus();
    };
    add?.addEventListener('click', addTag);
    input?.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      addTag();
    });
    editor.addEventListener('click', (event) => {
      const button = event.target.closest('[data-remove-tag]');
      if (!button) return;
      update(readTags().filter(tag => tag !== button.dataset.removeTag));
    });
  }

  _renderTagEditor(editor, tags) {
    const list = editor.querySelector('.tag-list');
    if (!list) return;
    list.innerHTML = tags.length
      ? tags.map(tag => `
        <span class="tag-pill">
          <span>${esc(tag)}</span>
          <button type="button" data-remove-tag="${esc(tag)}" aria-label="Remove tag ${esc(tag)}">x</button>
        </span>
      `).join('')
      : '<span class="tiny">No tags.</span>';
  }

  _bindEnumListEditor(editor, card, entity, type) {
    const select = editor.querySelector('.enum-list-select');
    const add = editor.querySelector('[data-add-enum-option]');
    const hidden = editor.querySelector('.component-enum-list-value');
    const options = JSON.parse(editor.dataset.enumOptions || '[]');
    const readSelected = () => {
      try {
        const parsed = JSON.parse(hidden.value || '[]');
        return Array.isArray(parsed) ? parsed.map(option => String(option)) : [];
      } catch (_err) {
        return [];
      }
    };
    const writeSelected = (selected) => {
      hidden.value = JSON.stringify(selected);
      this._renderEnumListEditor(editor, options, selected);
      this._updateTypedComponent(card, entity, type);
    };
    add?.addEventListener('click', () => {
      const value = select.value;
      if (!value) return;
      const selected = readSelected();
      if (!selected.includes(value)) selected.push(value);
      writeSelected(selected);
    });
    editor.addEventListener('click', (event) => {
      const button = event.target.closest('[data-remove-enum-option]');
      if (!button) return;
      writeSelected(readSelected().filter(option => option !== button.dataset.removeEnumOption));
    });
  }

  _renderEnumListEditor(editor, options, selected) {
    const list = editor.querySelector('.enum-list');
    const select = editor.querySelector('.enum-list-select');
    const add = editor.querySelector('[data-add-enum-option]');
    const available = options.filter(option => !selected.includes(option));
    if (list) {
      list.innerHTML = selected.length
        ? selected.map(option => `
          <span class="tag-pill">
            <span>${esc(option)}</span>
            <button type="button" data-remove-enum-option="${esc(option)}" aria-label="Remove ${esc(option)}">x</button>
          </span>
        `).join('')
        : '<span class="tiny">No options selected.</span>';
    }
    if (select) {
      select.innerHTML = available.map(option => `<option value="${esc(option)}">${esc(option)}</option>`).join('');
      select.disabled = available.length === 0;
    }
    if (add) add.disabled = available.length === 0;
  }

  _bindMeterEditor(editor, card, entity, type) {
    const hidden = editor.querySelector('.component-meter-value');
    const readMeter = () => {
      try {
        const parsed = JSON.parse(hidden.value || '{}');
        return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
      } catch (_err) {
        return {};
      }
    };
    const writeMeter = (meter) => {
      const minimum = Number(meter.minimum ?? 0);
      const maximum = Number(meter.maximum ?? 100);
      const value = Number(meter.value ?? minimum);
      if (Number.isFinite(minimum) && Number.isFinite(maximum) && Number.isFinite(value)) {
        meter.value = Math.max(minimum, Math.min(maximum, value));
      }
      hidden.value = JSON.stringify(meter);
      this._syncMeterEditor(editor, meter);
      this._updateTypedComponent(card, entity, type);
    };
    editor.addEventListener('input', (event) => {
      const control = event.target.closest('[data-meter-key]');
      if (!control) return;
      const meter = readMeter();
      const value = Number(control.value);
      meter[control.dataset.meterKey] = Number.isFinite(value) ? value : 0;
      writeMeter(meter);
    });
  }

  _syncMeterEditor(editor, meter) {
    const minimum = Number(meter.minimum ?? 0);
    const maximum = Number(meter.maximum ?? 100);
    const value = Number(meter.value ?? minimum);
    const range = editor.querySelector('.meter-range');
    if (range) {
      range.min = String(minimum);
      range.max = String(maximum);
      range.value = String(value);
    }
    const readout = editor.querySelector('.meter-readout');
    if (readout) {
      readout.textContent = `${this._formatMeterValue(value)} / ${this._formatMeterValue(maximum)}`;
    }
    for (const input of editor.querySelectorAll('.meter-input')) {
      if (input === document.activeElement) continue;
      input.value = String(meter[input.dataset.meterKey] ?? '');
    }
  }

  _syncNullableControl(toggle) {
    const field = toggle.closest('.field');
    if (!field) return;
    for (const control of field.querySelectorAll('.component-field')) {
      control.disabled = toggle.checked;
    }
  }

  _updateTypedComponent(card, entity, type) {
    try {
      const fields = {};
      for (const input of card.querySelectorAll('.component-field')) {
        input.classList.remove('bad-json');
        fields[input.dataset.field] = this._readComponentField(input);
      }
      entity.components[type] = fields;
      const raw = card.querySelector('.component-json');
      if (raw) raw.value = JSON.stringify(fields, null, 2);
      this._renderJson();
      this._renderEntities();
      this._renderOptions();
      this._debouncedPatch(
        `component:${entity.id}:${type}`,
        [{ op: 'set_component', entity_id: entity.id, component: { type, fields } }],
        'Component patched'
      );
    } catch (err) {
      if (err.input) err.input.classList.add('bad-json');
    }
  }

  _readComponentField(input) {
    const kind = input.dataset.kind;
    const nullable = input.dataset.nullable === 'true';
    const nullToggle = input.closest('.field')?.querySelector('.nullable-toggle');
    if (nullable && nullToggle?.checked) return null;
    if (nullable && input.value === '') return null;
    if (kind === 'boolean') return input.checked;
    if (kind === 'integer') return input.value === '' ? 0 : parseInt(input.value, 10);
    if (kind === 'number') return input.value === '' ? 0 : Number(input.value);
    if (kind === 'array' || kind === 'object') {
      try {
        return JSON.parse(input.value || (kind === 'array' ? '[]' : '{}'));
      } catch (err) {
        err.input = input;
        throw err;
      }
    }
    return input.value;
  }

  async _generateAndApply(path, body, selectEntity, label) {
    try {
      if (!this.liveBase) throw new Error('Load a server snapshot first');
      const generated = await this._sendAdmin(path, {
        method: 'POST',
        body: JSON.stringify(body),
        status: `${label} generated`
      });
      const patch = generated.patch?.operations || [];
      if (!patch.length) throw new Error('Generator returned an empty patch');
      const applied = await this._sendPatch(patch, { merge: true, status: `${label} applied` });
      const nextId = selectEntity(generated, applied);
      if (nextId && this.world.entities[nextId]) this._selectEntity(nextId, { sync: false });
      this._renderAll();
      this._syncUrl();
    } catch (err) {
      this._status(`${label} error: ${err.message}`, 'err');
    }
  }

  _findChanged(applied, predicate) {
    return (applied?.changed_entities || []).find(predicate)?.id || null;
  }

  async _generateRoom() {
    const entity = this._selected();
    if (!entity) return;
    await this._generateAndApply(
      '/admin/world/generate-room',
      {
        door_entity_id: entity.id,
        direction: document.getElementById('gen-room-direction')?.value.trim() || null,
        prompt: document.getElementById('gen-room-prompt')?.value.trim() || ''
      },
      (generated, applied) => this._findChanged(applied, item =>
        item.id !== generated.source_room_id && item.components?.RoomComponent
      ),
      'Room'
    );
  }

  async _generateCharacter() {
    const entity = this._selected();
    if (!entity) return;
    await this._generateAndApply(
      '/admin/world/generate-character',
      {
        room_entity_id: entity.id,
        prompt: document.getElementById('gen-character-prompt')?.value.trim() || ''
      },
      (generated, applied) => this._findChanged(applied, item =>
        item.components?.IdentityComponent?.name === generated.generated_name &&
        item.components?.CharacterComponent
      ),
      'Character'
    );
  }

  async _generateItem() {
    const entity = this._selected();
    if (!entity) return;
    await this._generateAndApply(
      '/admin/world/generate-item',
      {
        container_entity_id: entity.id,
        prompt: document.getElementById('gen-item-prompt')?.value.trim() || ''
      },
      (generated, applied) => this._findChanged(applied, item =>
        item.components?.IdentityComponent?.name === generated.generated_name
      ),
      'Item'
    );
  }

  _selectedFragment() {
    const id = document.getElementById('library-select')?.value;
    return this.libraryFragments.find(fragment => fragment.id === id) || null;
  }

  _fragmentImportOperations(fragment, destination) {
    const operations = clone(fragment.operations || []);
    if (fragment.root_client_id && fragment.attach_edge) {
      if (!destination) throw new Error('select a destination entity first');
      const edge = clone(fragment.attach_edge);
      if (edge.type === 'Contains') {
        edge.fields = {
          ...(edge.fields || {}),
          mode: containModeForEntity(destination, edge.fields?.mode || 'room_content')
        };
      }
      operations.push({
        op: 'set_edge',
        source_id: destination.id,
        target_id: fragment.root_client_id,
        edge
      });
    }
    return operations;
  }

  async _importSelectedFragment() {
    const fragment = this._selectedFragment();
    if (!fragment) return;
    try {
      const operations = this._fragmentImportOperations(fragment, this._selected());
      if (!operations.length) throw new Error('fragment has no operations');
      if (this.liveBase) {
        const data = await this._sendPatch(operations, {
          merge: true,
          status: `${fragment.title} imported`
        });
        const created = data?.changed_entities?.find(entity => entity.id !== this.selectedId)?.id;
        if (created) this._selectEntity(created, { sync: false });
      } else {
        const created = this._applyLocalPatch(operations);
        if (created[0]) this._selectEntity(created[0], { sync: false });
        this._status(`${fragment.title} imported`, 'ok');
      }
      this._renderAll();
      this._syncUrl();
    } catch (err) {
      this._status(`Import error: ${err.message}`, 'err');
    }
  }

  _resolveLocalId(raw, aliases) {
    if (aliases[raw]) return aliases[raw];
    if (!this.world.entities[raw]) throw new Error(`entity ${raw} does not exist`);
    return raw;
  }

  _applyLocalPatch(operations) {
    const aliases = {};
    const created = [];
    for (const operation of operations) {
      if (operation.op === 'add_entity') {
        const id = this._nextEntityId();
        if (operation.client_id) aliases[operation.client_id] = id;
        created.push(id);
        this.world.entities[id] = {
          id,
          prefab: operation.prefab || 'entity',
          created_epoch: Number(this.world.metadata?.epoch || 0),
          components: Object.fromEntries(
            (operation.components || []).map(component => [component.type, clone(component.fields || {})])
          ),
          relationships: {}
        };
      } else if (operation.op === 'set_edge') {
        const source = this._resolveLocalId(operation.source_id, aliases);
        const target = this._resolveLocalId(operation.target_id, aliases);
        const entity = this.world.entities[source];
        const type = operation.edge?.type;
        if (!type) throw new Error('edge type is required');
        if (!entity.relationships[type]) entity.relationships[type] = [];
        entity.relationships[type].push({ target, edge: clone(operation.edge.fields || {}) });
      } else if (operation.op === 'add_component' || operation.op === 'set_component') {
        const entity = this.world.entities[this._resolveLocalId(operation.entity_id, aliases)];
        entity.components[operation.component.type] = clone(operation.component.fields || {});
      } else {
        throw new Error(`unsupported offline fragment operation ${operation.op}`);
      }
    }
    return created;
  }

  _incomingAttachEdge(entityId) {
    for (const entity of Object.values(this.world.entities)) {
      for (const [type, edges] of Object.entries(entity.relationships || {})) {
        const found = (edges || []).find(edge => edge.target === entityId);
        if (found) return { type, fields: clone(found.edge || {}) };
      }
    }
    return null;
  }

  _exportSelectedFragment() {
    const entity = this._selected();
    if (!entity) {
      this._status('Select an entity before exporting a fragment', 'err');
      return;
    }
    const title = entityName(entity);
    const slug = title.toLowerCase().replace(/[^a-z0-9_.-]+/g, '-').replace(/^-|-$/g, '');
    const identity = entity.components?.IdentityComponent || {};
    const fragment = {
      schema_version: 1,
      id: `export/${slug || entity.id}`,
      title,
      kind: entityType(entity),
      description: '',
      tags: Array.isArray(identity.tags) ? identity.tags : [],
      root_client_id: '$root',
      attach_edge: this._incomingAttachEdge(entity.id),
      operations: [{
        op: 'add_entity',
        client_id: '$root',
        prefab: entity.prefab || 'entity',
        components: Object.entries(entity.components || {}).map(([type, fields]) => ({
          type,
          fields: clone(fields || {})
        }))
      }]
    };
    if (!fragment.attach_edge) delete fragment.attach_edge;
    const text = JSON.stringify(fragment, null, 2);
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${slug || entity.id}.fragment.json`;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(a.href);
    a.remove();
    this._status('Fragment JSON downloaded', 'ok');
  }

  _applyEntityFields() {
    const entity = this._selected();
    if (!entity) return;
    const nextId = document.getElementById('entity-id').value.trim();
    if (!nextId) {
      this._status('Entity ID is required', 'err');
      return;
    }
    if (nextId !== entity.id && this.world.entities[nextId]) {
      this._status('Entity ID already exists', 'err');
      return;
    }
    if (this.liveBase && nextId !== entity.id) {
      this._status('Live ECS entity IDs cannot be renamed', 'err');
      return;
    }
    entity.prefab = document.getElementById('entity-prefab').value.trim() || 'entity';
    entity.created_epoch = Number(document.getElementById('entity-created').value || 0);
    if (nextId !== entity.id) this._renameEntity(entity.id, nextId);
    this._renderAll();
    this._status('Entity updated', 'ok');
  }

  _renameEntity(oldId, nextId) {
    const entity = this.world.entities[oldId];
    delete this.world.entities[oldId];
    entity.id = nextId;
    this.world.entities[nextId] = entity;
    for (const other of Object.values(this.world.entities)) {
      for (const edges of Object.values(other.relationships || {})) {
        for (const edge of edges || []) {
          if (edge.target === oldId) edge.target = nextId;
        }
      }
    }
    this._selectEntity(nextId, { sync: false });
  }

  _nextEntityId() {
    let i = Object.keys(this.world.entities).length + 1;
    while (this.world.entities[`entity_${i}`]) i += 1;
    return `entity_${i}`;
  }

  async _addEntity() {
    if (this.liveBase) {
      try {
        const data = await this._sendPatch(
          [{
            op: 'add_entity',
            components: [{
              type: 'IdentityComponent',
              fields: { name: 'entity', kind: 'entity', tags: [] }
            }]
          }],
          { merge: true, status: 'Entity added' }
        );
        const created = data?.changed_entities?.[0]?.id;
        if (created) this._selectEntity(created, { sync: false });
        this._renderAll();
        this._syncUrl();
      } catch (err) {
        this._status(`Patch error: ${err.message}`, 'err');
      }
      return;
    }
    const id = this._nextEntityId();
    this.world.entities[id] = {
      id,
      prefab: 'entity',
      created_epoch: Number(this.world.metadata?.epoch || 0),
      components: { IdentityComponent: { name: id, kind: 'entity', tags: [] } },
      relationships: {}
    };
    this._selectEntity(id, { sync: false });
    this._renderAll();
    this._syncUrl();
    this._status('Entity added', 'ok');
  }

  async _deleteEntity() {
    const entity = this._selected();
    if (!entity) return;
    if (!window.confirm(`Delete ${entity.id}? Incoming edges will also be removed.`)) return;
    if (this.liveBase) {
      try {
        await this._sendPatch(
          [{ op: 'delete_entity', entity_id: entity.id }],
          { merge: true, status: 'Entity deleted' }
        );
      } catch (err) {
        this._status(`Patch error: ${err.message}`, 'err');
        return;
      }
    } else {
      delete this.world.entities[entity.id];
    }
    for (const other of Object.values(this.world.entities)) {
      for (const [type, edges] of Object.entries(other.relationships || {})) {
        other.relationships[type] = (edges || []).filter(edge => edge.target !== entity.id);
        if (!other.relationships[type].length) delete other.relationships[type];
      }
    }
    this._selectEntity(Object.keys(this.world.entities)[0] || null, { sync: false });
    this._renderAll();
    this._syncUrl();
    this._status('Entity deleted', 'ok');
  }

  async _addComponent() {
    const entity = this._selected();
    if (!entity) return;
    const type = document.getElementById('add-component-type')?.value;
    if (!type) return;
    if (entity.components[type]) {
      this._status('Entity already has that component', 'err');
      return;
    }
    const fields = this._defaultComponent(type, entity);
    if (this.liveBase) {
      try {
        await this._sendPatch(
          [{ op: 'add_component', entity_id: entity.id, component: { type, fields } }],
          { merge: true, status: 'Component added' }
        );
        this._renderAll();
      } catch (err) {
        this._status(`Patch error: ${err.message}`, 'err');
      }
      return;
    }
    entity.components[type] = fields;
    this._renderAll();
    this._status('Component added', 'ok');
  }

  _defaultComponent(type, entity) {
    const schema = this._componentSchema(type);
    if (schema?.properties) {
      const fields = {};
      for (const [name, rawSchema] of Object.entries(schema.properties)) {
        fields[name] = this._defaultForSchema(rawSchema, schema);
      }
      return fields;
    }
    if (type === 'IdentityComponent') return { name: entity.id, kind: 'entity', tags: [] };
    if (type === 'RoomComponent') return { title: entity.id, biome: 'unknown', indoor: false, private: false, safe: true };
    if (type === 'CharacterComponent') return { species: 'bunny', biography: '', public: true };
    if (type === 'WorldClockComponent') return { game_time_seconds: 0, tick_index: 0, time_scale: 1.0 };
    return {};
  }

  async _deleteComponent(type) {
    const entity = this._selected();
    if (!entity) return;
    if (this.liveBase) {
      try {
        await this._sendPatch(
          [{ op: 'remove_component', entity_id: entity.id, component_type: type }],
          { merge: true, status: 'Component deleted' }
        );
      } catch (err) {
        this._status(`Patch error: ${err.message}`, 'err');
        return;
      }
    }
    delete entity.components[type];
    this._renderAll();
    this._status('Component deleted', 'ok');
  }

  async _addEdge() {
    const entity = this._selected();
    if (!entity) return;
    const type = window.prompt('Edge type', 'Contains');
    if (!type) return;
    const target = window.prompt('Target entity id', Object.keys(this.world.entities).find(id => id !== entity.id) || '');
    if (!target) return;
    const edge = this._defaultEdge(type);
    if (this.liveBase) {
      try {
        await this._sendPatch(
          [{
            op: 'set_edge',
            source_id: entity.id,
            target_id: target,
            edge: { type, fields: edge }
          }],
          { merge: true, status: 'Edge added' }
        );
        this._renderAll();
      } catch (err) {
        this._status(`Patch error: ${err.message}`, 'err');
      }
      return;
    }
    if (!entity.relationships[type]) entity.relationships[type] = [];
    entity.relationships[type].push({ target, edge });
    this._renderAll();
    this._status('Edge added', 'ok');
  }

  _defaultEdge(type) {
    if (type === 'Contains') return { mode: 'room_content', visible: true, discovered: true, order: 0 };
    if (type === 'ExitTo') return { direction: '', label: '', locked: false, hidden: false, action_cost: 1 };
    if (type === 'ControlledBy') return { generation: 0, since_epoch: Number(this.world.metadata?.epoch || 0) };
    return {};
  }

  async _deleteEdge(type, index) {
    const entity = this._selected();
    if (!entity?.relationships?.[type]) return;
    const target = entity.relationships[type][index]?.target;
    if (this.liveBase && target) {
      try {
        await this._sendPatch(
          [{ op: 'remove_edge', source_id: entity.id, target_id: target, edge_type: type }],
          { merge: true, status: 'Edge deleted' }
        );
      } catch (err) {
        this._status(`Patch error: ${err.message}`, 'err');
        return;
      }
    }
    entity.relationships[type].splice(index, 1);
    if (!entity.relationships[type].length) delete entity.relationships[type];
    this._renderAll();
    this._status('Edge deleted', 'ok');
  }

  _renderJson() {
    const exported = exportWorld(this.world);
    const text = JSON.stringify(exported, null, 2);
    document.getElementById('json-output').value = text;
    document.getElementById('json-size').textContent = `${new Blob([text]).size} bytes`;
    const problems = this._validate(exported);
    const el = document.getElementById('problems');
    if (problems.length) {
      el.className = '';
      el.innerHTML = problems.map(esc).join('<br>');
    } else {
      el.className = 'ok';
      el.textContent = 'Valid world JSON.';
    }
  }

  _validate(snapshot) {
    const problems = [];
    const ids = new Set(Object.keys(snapshot.entities || {}));
    const clocks = Object.entries(snapshot.components?.WorldClockComponent || {});
    if (clocks.length !== 1) problems.push(`expected exactly one WorldClockComponent, found ${clocks.length}`);
    for (const [type, table] of Object.entries(snapshot.relationships || {})) {
      for (const [source, edges] of Object.entries(table || {})) {
        if (!ids.has(source)) problems.push(`${type}: source ${source} does not exist`);
        for (const edge of edges || []) {
          if (!ids.has(edge.target)) problems.push(`${type}: target ${edge.target} does not exist`);
        }
      }
    }
    return problems;
  }

  _download() {
    const text = document.getElementById('json-output').value;
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const seed = (this.world.meta?.seed || 'world').replace(/[^a-zA-Z0-9_.-]+/g, '_');
    a.download = `${seed || 'world'}.json`;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(a.href);
    a.remove();
    this._status('World JSON downloaded', 'ok');
  }

  async _copy() {
    try {
      await navigator.clipboard.writeText(document.getElementById('json-output').value);
      this._status('World JSON copied', 'ok');
    } catch (_err) {
      this._status('Clipboard unavailable', 'err');
    }
  }
}

window.app = new WorldEditor();

async function readConfig() {
  try {
    const res = await fetch('config.json', { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (_err) {
    return null;
  }
}

function parseEditorDeepLink() {
  let server = new URLSearchParams(location.search).get('server');
  let hash = location.hash.replace(/^#/, '');
  const qi = hash.indexOf('?');
  if (qi >= 0) {
    if (!server) server = new URLSearchParams(hash.slice(qi + 1)).get('server');
    hash = hash.slice(0, qi);
  }
  const parts = hash.split('/').filter(Boolean).map(decodeURIComponent);
  const entity = parts.length > 1 ? parts.slice(1).join('/') : parts[0] || null;
  return { server, entity };
}

(async function boot() {
  const cfg = await readConfig();
  const dl = parseEditorDeepLink();
  const server = dl.server || (cfg && typeof cfg.serverUrl === 'string' ? cfg.serverUrl : null);
  if (server) document.getElementById('api-url').value = server;
  if (dl.entity) window.app._pendingEntityId = dl.entity;
  if (dl.server || (cfg && cfg.autoConnect && server)) {
    await window.app._fetchSnapshot();
  } else if (dl.entity) {
    window.app._applyDeepLink(dl);
  }
}());
</script>
