<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland Inspector</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.13/css/litegraph.css">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    #breadcrumb {
      flex: 1;
      font-size: var(--bl-text-sm);
      color: var(--bl-text-dim);
      padding-left: 4px;
    }
    #breadcrumb .crumb { color: var(--bl-accent); cursor: pointer; }
    #breadcrumb .crumb:hover { text-decoration: underline; }
    #breadcrumb .crumb-current { color: var(--bl-text); }
    #api-url { width: 190px; }
    #runtime-status { white-space: nowrap; }

    /* ── Search / jump-to-entity ── */
    #search-box { position: relative; }
    #search-input {
      width: 170px;
    }
    #search-results {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 3px;
      min-width: 240px;
      max-height: 320px;
      overflow-y: auto;
      background: var(--bl-bg);
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      z-index: 20;
      box-shadow: var(--bl-shadow-popover);
    }
    #search-results.hidden { display: none; }
    .search-item {
      padding: 4px 9px;
      font-size: var(--bl-text-sm);
      color: var(--bl-text);
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 1px solid var(--bl-bg-strong);
    }
    .search-item:hover, .search-item.active { background: var(--bl-surface); }
    .search-item .si-icon { margin-right: 4px; }
    .search-item .si-type { color: var(--bl-text-dim); margin-left: 5px; }
    .search-empty { padding: 8px 10px; font-size: var(--bl-text-sm); color: var(--bl-text-muted); }
    #parents-toggle {
      font-size: var(--bl-text-sm);
      color: var(--bl-text-soft);
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      cursor: pointer;
    }
    #parents-toggle input { cursor: pointer; }

    /* ── Graph area ── */
    #graph-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #graph-canvas { display: block; }
    #graph-context-menu {
      position: absolute;
      min-width: 250px;
      max-width: 310px;
      background: var(--bl-bg);
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      box-shadow: var(--bl-shadow-popover);
      z-index: 25;
      padding: 5px;
      color: var(--bl-text);
    }
    #graph-context-menu.hidden { display: none; }
    .graph-menu-title {
      padding: 4px 7px 6px;
      color: var(--bl-text-dim);
      font-size: var(--bl-text-sm);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid var(--bl-bg-strong);
      margin-bottom: 4px;
    }
    .graph-menu-item {
      width: 100%;
      display: block;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--bl-text);
      border-radius: var(--bl-radius-sm);
      padding: 6px 8px;
      font: inherit;
      font-size: var(--bl-text-sm);
      cursor: pointer;
    }
    .graph-menu-item:hover:not(:disabled) { background: var(--bl-surface); }
    .graph-menu-item:disabled {
      color: var(--bl-text-muted);
      cursor: not-allowed;
    }
    .graph-menu-select {
      width: 100%;
      margin: 4px 0;
      font-size: var(--bl-text-sm);
    }
    .graph-menu-sep {
      height: 1px;
      margin: 4px 0;
      background: var(--bl-bg-strong);
    }

    #drop-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: var(--bl-overlay-solid);
      z-index: 10;
      font-size: 14px;
      color: var(--bl-text-soft);
      pointer-events: none;
    }
    #drop-overlay.hidden { display: none; }
    #drop-overlay .title { font-size: 20px; color: var(--bl-text); }
    #drop-overlay .hint { margin-top: 4px; }

    /* ── Right sidebar (inspector + optional event feed) ── */
    #sidebar {
      width: 370px;
      min-width: 260px;
      border-left: 1px solid var(--bl-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Inspector panel ── */
    #inspector {
      flex: 1;
      min-height: 0;
      background: var(--bl-bg-strong);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Event feed panel (optional, under the inspector) ── */
    #event-panel {
      flex-shrink: 0;
      height: 45%;
      display: flex;
      flex-direction: column;
      background: var(--bl-bg-strong);
      border-top: 1px solid var(--bl-border);
    }
    #event-panel.hidden { display: none; }
    #event-panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      font-size: var(--bl-text-sm);
      color: var(--bl-accent-strong);
      background: var(--bl-bg);
      border-bottom: 1px solid var(--bl-border);
      flex-shrink: 0;
    }
    #event-panel-header .ev-title { font-weight: bold; }
    #event-count { color: var(--bl-text-muted); }
    #event-clear {
      margin-left: auto;
      font-size: var(--bl-text-xs);
      padding: 1px 7px;
    }
    #event-list {
      flex: 1;
      overflow-y: auto;
      padding: 3px 0;
      font-size: var(--bl-text-sm);
      line-height: 1.65;
    }
    #event-list::-webkit-scrollbar { width: 6px; }
    #event-list::-webkit-scrollbar-thumb { background: var(--bl-surface); border-radius: var(--bl-radius-sm); }
    #event-empty { padding: 16px; text-align: center; color: var(--bl-text-muted); }
    .ev-row {
      padding: 1px 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid var(--bl-bg-row);
    }
    .ev-row:hover { background: var(--bl-bg); }
    .ev-epoch { color: var(--bl-text-muted); margin-right: 5px; }
    .ev-icon { margin-right: 4px; }
    .ev-actor { color: var(--bl-accent); cursor: pointer; }
    .ev-actor:hover { text-decoration: underline; }
    .ev-text { color: var(--bl-text-soft); }
    #events-toggle {
      font-size: var(--bl-text-sm);
      color: var(--bl-text-soft);
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      cursor: pointer;
    }
    #events-toggle input { cursor: pointer; }

    /* ── View switch (Map / Social) ── */
    #view-switch { display: inline-flex; border: 1px solid var(--bl-border-control); border-radius: var(--bl-radius-sm); overflow: hidden; }
    #view-switch button {
      padding: 2px 8px;
      background: var(--bl-bg);
      border: none;
      border-right: 1px solid var(--bl-border-control);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      cursor: pointer;
    }
    #view-switch button:last-child { border-right: none; }
    #view-switch button.active { background: var(--bl-surface-hover); color: var(--bl-text); }
    #view-switch button:hover:not(.active) { background: var(--bl-surface); }

    /* ── Social view legend ── */
    #social-legend {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 9;
      background: var(--bl-overlay-strong);
      border: 1px solid var(--bl-border);
      border-radius: var(--bl-radius-md);
      padding: 7px 10px;
      font-size: var(--bl-text-sm);
      color: var(--bl-text-soft);
      pointer-events: none;
    }
    #social-legend.hidden { display: none; }
    #social-legend .leg-title { color: var(--bl-accent-strong); margin-bottom: 4px; font-weight: bold; }
    #social-legend .leg-item { display: flex; align-items: center; gap: 6px; line-height: 1.7; }
    #social-legend .leg-swatch { display: inline-block; width: 16px; height: 3px; border-radius: 2px; }

    #inspector-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--bl-border);
      background: var(--bl-bg);
      flex-shrink: 0;
    }
    #inspector-name {
      font-size: 14px;
      font-weight: bold;
      color: var(--bl-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #inspector-id {
      font-size: 10px;
      color: var(--bl-text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #inspector-links {
      margin-top: 5px;
    }
    #inspector-links:empty {
      display: none;
    }
    #inspector-kind {
      font-size: var(--bl-text-sm);
      margin-top: 3px;
      color: var(--bl-text-soft);
    }
    .control-badge {
      font-weight: bold;
      white-space: nowrap;
    }
    .status-badges {
      margin-top: 4px;
      font-size: var(--bl-text-sm);
      color: var(--bl-text);
    }

    #inspector-body {
      flex: 1;
      overflow-y: auto;
    }
    #inspector-body::-webkit-scrollbar { width: 6px; }
    #inspector-body::-webkit-scrollbar-track { background: var(--bl-bg-strong); }
    #inspector-body::-webkit-scrollbar-thumb { background: var(--bl-surface); border-radius: var(--bl-radius-sm); }

    #inspector-empty {
      padding: 20px;
      text-align: center;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-md);
      line-height: 1.8;
    }

    /* ── Component sections ── */
    .comp-section {
      border-bottom: 1px solid var(--bl-bg);
    }
    .comp-section > summary {
      padding: 5px 10px;
      cursor: pointer;
      font-size: var(--bl-text-sm);
      color: var(--bl-accent-strong);
      background: var(--bl-bg);
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .comp-section > summary::before { content: '▶'; font-size: 9px; color: var(--bl-border-control); }
    .comp-section[open] > summary::before { content: '▼'; }
    .comp-section > summary:hover { background: var(--bl-bg-subtle); }
    .comp-section[open] > summary { color: var(--bl-accent); }

    .comp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--bl-text-sm);
    }
    .comp-table tr { border-bottom: 1px solid var(--bl-bg-row); }
    .comp-table tr:hover { background: var(--bl-bg); }
    .comp-table td {
      padding: 2px 8px;
      vertical-align: top;
    }
    .comp-table td.key {
      color: var(--bl-accent);
      width: 42%;
      white-space: nowrap;
      padding-right: 4px;
      padding-left: 20px;
    }
    .comp-table td.val { color: var(--bl-text); word-break: break-word; }

    .val-null { color: var(--bl-text-muted); font-style: italic; }
    .val-bool-t { color: var(--bl-ok); }
    .val-bool-f { color: var(--bl-error); }
    .val-num { color: var(--bl-warn); }
    .val-str { color: var(--bl-ok); }

    /* nested object inside a table cell */
    .sub-table { margin: 2px 0 2px 8px; }
    .sub-table td.key { padding-left: 4px; color: var(--bl-info); }

    /* ── Relationships section ── */
    .rel-section {
      padding: 5px 10px 8px 10px;
      border-bottom: 1px solid var(--bl-bg);
    }
    .rel-title {
      font-size: var(--bl-text-sm);
      color: var(--bl-accent-strong);
      margin-bottom: 4px;
    }
    .rel-row {
      font-size: var(--bl-text-xs);
      color: var(--bl-text-soft);
      padding: 1px 0 1px 10px;
      line-height: 1.5;
    }
    .rel-edge-type { color: var(--bl-accent-strong); }
    .rel-target { color: var(--bl-accent); cursor: pointer; }
    .rel-target:hover { text-decoration: underline; }
    .rel-edge-data { color: var(--bl-text-dim); }

    /* ── Meter bars (for hunger, thirst, etc.) ── */
    .meter-bar-row td.val { padding-top: 1px; }
    .meter-bar {
      display: inline-block;
      height: 6px;
      border-radius: 3px;
      vertical-align: middle;
      margin-right: 4px;
    }

  </style>
</head>
<body class="bl-tool-page bl-page-inspector">
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.13/build/litegraph.js"></script>
<script src="assets/bunnyland-ui.js?v=20260718-formal-v1"></script>
<script src="assets/bunnyland-api.js?v=20260718-formal-v1"></script>
<script src="assets/bunnyland-events.js"></script>
<script src="assets/bunnyland-world.js"></script>
<script type="module" src="/src/inspector/app.tsx"></script>
</body>
</html>
