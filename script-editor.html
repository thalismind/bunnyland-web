<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Script Editor</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #script-id { width: 230px; }
    #script-name { width: 220px; }
    #script-version { width: 78px; }
    #main {
      grid-template-columns: minmax(250px, 320px) minmax(520px, 1fr) minmax(330px, 430px);
    }

    #entity-search {
      width: 100%;
      margin: 8px 10px 6px 10px;
      width: calc(100% - 20px);
    }
    #entity-list {
      padding-bottom: 8px;
      border-bottom: 1px solid var(--bl-border);
      max-height: 45%;
      overflow-y: auto;
    }
    #entity-detail {
      padding: 10px;
      font-size: 11px;
      line-height: 1.65;
    }
    .detail-title {
      color: var(--bl-text);
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail-id {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      word-break: break-all;
      margin-bottom: 8px;
    }
    .pill-row { margin: 5px 0 9px 0; }
    .mini-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-top: 8px;
    }
    #editor-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      overflow: hidden;
    }
    #block-list {
      border-right: 1px solid var(--bl-border);
      min-height: 0;
      overflow-y: auto;
    }
    .block-row {
      padding: 7px 9px;
      border-bottom: 1px solid var(--bl-bg-row);
      cursor: pointer;
      font-size: var(--bl-text-sm);
    }
    .block-row:hover, .block-row.active { background: var(--bl-surface); }
    .block-name {
      color: var(--bl-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .block-meta {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      margin-top: 3px;
    }
    textarea { min-height: 74px; }

    @media (max-width: 1050px) {
      #main { grid-template-columns: 280px minmax(520px, 1fr); }
      #preview-pane { display: none; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

<div id="toolbar">
  <div class="toolbar-row" id="toolbar-row1">
    <label for="snapshot-input">Snapshot:</label>
    <input type="file" id="snapshot-input" accept=".json,application/json">
    <span class="toolbar-sep">|</span>
    <label for="script-input">Script:</label>
    <input type="file" id="script-input" accept=".json,application/json">
    <button id="btn-new">New</button>
    <button id="btn-download">Download JSON</button>
    <button id="btn-copy">Copy JSON</button>
    <span id="save-status">Ready</span>
    <button id="btn-client-menu" class="client-menu-button" type="button">Menu</button>
  </div>
  <div class="toolbar-row" id="toolbar-row2">
    <label for="script-id">ID:</label>
    <input type="text" id="script-id" spellcheck="false">
    <label for="script-name">Name:</label>
    <input type="text" id="script-name" spellcheck="false">
    <label for="script-version">Version:</label>
    <input type="text" id="script-version" spellcheck="false">
    <span class="toolbar-sep">|</span>
    <span id="world-info">No snapshot loaded</span>
  </div>
</div>

<div id="main" class="app-grid">
  <section class="pane" id="library-pane">
    <div class="pane-header">
      <div class="pane-title">Entity Library</div>
      <span class="pane-count" id="entity-count">0</span>
    </div>
    <div class="pane-body">
      <input type="text" id="entity-search" placeholder="find entity..." spellcheck="false" autocomplete="off">
      <div id="entity-list">
        <div class="empty">Load a snapshot.</div>
      </div>
      <div id="entity-detail">
        <div class="empty">No entity selected.</div>
      </div>
    </div>
  </section>

  <section class="pane" id="editor-pane">
    <div class="pane-header">
      <div class="pane-title">Blocks</div>
      <span class="pane-count" id="block-count">0</span>
      <button id="btn-add-block">Add Block</button>
      <button id="btn-delete-block">Delete</button>
    </div>
    <div id="editor-grid">
      <div id="block-list"></div>
      <div class="editor-scroll" id="block-editor">
        <div class="empty">Add or select a block.</div>
      </div>
    </div>
  </section>

  <section class="pane" id="preview-pane">
    <div class="pane-header">
      <div class="pane-title">JSON</div>
      <span class="pane-count" id="json-size">0 bytes</span>
    </div>
    <textarea id="json-output" spellcheck="false" readonly></textarea>
    <div id="problems" class="ok">Valid script JSON.</div>
  </section>
</div>

<script src="assets/bunnyland-ui.js"></script>
<script src="assets/bunnyland-world.js"></script>
<script>
'use strict';

BunnylandUI.initClientMenu();

const COMMON_COMPONENTS = [
  'CharacterComponent', 'RoomComponent', 'IdentityComponent', 'PortableComponent',
  'ContainerComponent', 'SuspendedComponent', 'DeadComponent', 'DownedComponent',
  'LLMControllerComponent', 'DiscordControllerComponent', 'SuspendedControllerComponent'
];

const DEFAULT_SCRIPT = {
  id: 'local.script',
  name: 'Local Script',
  version: '0.1.0',
  bindings: {},
  blocks: []
};

const parseSnapshot = BunnylandWorld.parseSnapshot;

function esc(s) {
  return BunnylandUI.escapeHtml(s);
}

function clone(value) {
  return BunnylandUI.cloneJson(value);
}

function parseJsonObject(text, fallback) {
  const trimmed = String(text || '').trim();
  if (!trimmed) return fallback;
  const parsed = JSON.parse(trimmed);
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
    throw new Error('expected JSON object');
  }
  return parsed;
}

function parseJsonArray(text, fallback) {
  const trimmed = String(text || '').trim();
  if (!trimmed) return fallback;
  const parsed = JSON.parse(trimmed);
  if (!Array.isArray(parsed)) throw new Error('expected JSON array');
  return parsed;
}

const entityType = BunnylandWorld.entityType;
const entityIcon = BunnylandWorld.entityIcon;
const entityDisplayName = BunnylandWorld.entityDisplayName;

function entitySubtitle(entity, world) {
  const c = entity.components;
  if (c.RoomComponent) {
    return [c.RoomComponent.biome, c.RoomComponent.indoor ? 'indoor' : 'outdoor']
      .filter(Boolean).join(' · ');
  }
  if (c.CharacterComponent) {
    const ctrl = controlKind(entity, world);
    return [c.CharacterComponent.species || 'character', ctrl].filter(Boolean).join(' · ');
  }
  if (c.IdentityComponent) return c.IdentityComponent.kind || '';
  return Object.keys(c).slice(0, 3).join(', ');
}

function controlKind(entity, world) {
  return BunnylandWorld.controlInfo(entity, world)?.kind || '';
}

function componentNamesFromWorld(world) {
  return BunnylandWorld.componentNames(world, COMMON_COMPONENTS);
}

function makeDefaultBlock(index) {
  return {
    name: `block_${index}`,
    priority: 0,
    execution: 'once',
    cooldown_seconds: 0,
    trigger: { tick: true },
    actions: []
  };
}

function makeDefaultSubmitAction() {
  return {
    kind: 'submit_command',
    target: {
      mode: 'one',
      bind: 'actor',
      query: { components: ['CharacterComponent'] }
    },
    command_type: 'say',
    payload: { text: '' },
    cost: { action: 0, focus: 0 },
    lane: 'world',
    on_insufficient_points: 'queue'
  };
}

function makeDefaultPatchAction() {
  return {
    kind: 'patch_world',
    operations: [
      {
        op: 'add_entity',
        bind: 'new_entity',
        components: [
          { type: 'IdentityComponent', fields: { name: 'new marker', kind: 'marker' } }
        ]
      }
    ]
  };
}

class ScriptEditor {
  constructor() {
    this.world = null;
    this.entities = [];
    this.selectedEntityId = null;
    this.script = clone(DEFAULT_SCRIPT);
    this.selectedBlock = 0;
    this.entitySearch = '';
    this._bindDom();
    this._renderAll();
  }

  _bindDom() {
    document.getElementById('snapshot-input').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) this._loadSnapshotFile(file);
    });
    document.getElementById('script-input').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) this._loadScriptFile(file);
    });
    document.getElementById('btn-new').addEventListener('click', () => {
      this.script = clone(DEFAULT_SCRIPT);
      this.selectedBlock = 0;
      this._renderAll();
      this._status('New script', 'ok');
    });
    document.getElementById('btn-download').addEventListener('click', () => this._download());
    document.getElementById('btn-copy').addEventListener('click', () => this._copyJson());
    document.getElementById('btn-add-block').addEventListener('click', () => this._addBlock());
    document.getElementById('btn-delete-block').addEventListener('click', () => this._deleteBlock());
    document.getElementById('entity-search').addEventListener('input', (e) => {
      this.entitySearch = e.target.value;
      this._renderEntityList();
    });
    for (const id of ['script-id', 'script-name', 'script-version']) {
      document.getElementById(id).addEventListener('input', () => {
        this.script.id = document.getElementById('script-id').value.trim() || 'local.script';
        this.script.name = document.getElementById('script-name').value;
        this.script.version = document.getElementById('script-version').value.trim() || '0.1.0';
        this._renderBlocks();
        this._renderJson();
      });
    }
  }

  async _readJsonFile(file) {
    return JSON.parse(await file.text());
  }

  async _loadSnapshotFile(file) {
    try {
      this.world = parseSnapshot(await this._readJsonFile(file));
      this.entities = Object.values(this.world.entities)
        .sort((a, b) => entityDisplayName(a).localeCompare(entityDisplayName(b)));
      this.selectedEntityId = this.entities[0]?.id || null;
      this._renderEntityLibrary();
      this._renderBlockEditor();
      const meta = this.world.meta || {};
      const source = [meta.generator, meta.seed].filter(Boolean).join(' · ');
      document.getElementById('world-info').textContent =
        `${this.entities.length} entities · epoch ${this.world.epoch}${source ? ' · ' + source : ''}`;
      this._status('Snapshot loaded', 'ok');
    } catch (err) {
      this._status(`Snapshot error: ${err.message}`, 'err');
    }
  }

  async _loadScriptFile(file) {
    try {
      const data = await this._readJsonFile(file);
      this.script = this._normalizeScript(data);
      this.selectedBlock = 0;
      this._renderAll();
      this._status('Script loaded', 'ok');
    } catch (err) {
      this._status(`Script error: ${err.message}`, 'err');
    }
  }

  _normalizeScript(data) {
    return {
      id: data.id || 'local.script',
      name: data.name || '',
      version: data.version || '0.1.0',
      bindings: data.bindings || {},
      blocks: Array.isArray(data.blocks) ? data.blocks.map((block, i) => ({
        name: block.name || `block_${i + 1}`,
        priority: Number(block.priority || 0),
        execution: block.execution || 'once',
        cooldown_seconds: Number(block.cooldown_seconds || 0),
        trigger: block.trigger || { tick: true },
        actions: Array.isArray(block.actions) ? block.actions : []
      })) : []
    };
  }

  _status(text, kind) {
    const el = document.getElementById('save-status');
    el.textContent = text;
    el.className = kind || '';
  }

  _renderAll() {
    document.getElementById('script-id').value = this.script.id;
    document.getElementById('script-name').value = this.script.name || '';
    document.getElementById('script-version').value = this.script.version || '0.1.0';
    this._renderEntityLibrary();
    this._renderBlocks();
    this._renderBlockEditor();
    this._renderJson();
  }

  _renderEntityLibrary() {
    this._renderEntityList();
    this._renderEntityDetail();
  }

  _renderEntityList() {
    const list = document.getElementById('entity-list');
    const q = this.entitySearch.trim().toLowerCase();
    const entities = this.entities.filter((entity) => {
      if (!q) return true;
      const haystack = [
        entity.id,
        entityDisplayName(entity),
        entitySubtitle(entity, this.world),
        entityType(entity),
        ...Object.keys(entity.components)
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    });
    document.getElementById('entity-count').textContent = `${entities.length}/${this.entities.length}`;
    if (!entities.length) {
      list.innerHTML = '<div class="empty">No matching entities.</div>';
      return;
    }
    list.innerHTML = entities.map(entity => `
      <div class="entity-row ${entity.id === this.selectedEntityId ? 'active' : ''}" data-id="${esc(entity.id)}">
        <div>${entityIcon(entity)}</div>
        <div>
          <div class="entity-name">${esc(entityDisplayName(entity))}</div>
          <div class="entity-meta">${esc(entityType(entity))}${entitySubtitle(entity, this.world) ? ' · ' + esc(entitySubtitle(entity, this.world)) : ''}</div>
        </div>
      </div>
    `).join('');
    for (const row of list.querySelectorAll('.entity-row')) {
      row.addEventListener('click', () => {
        this.selectedEntityId = row.dataset.id;
        this._renderEntityLibrary();
      });
    }
  }

  _renderEntityDetail() {
    const detail = document.getElementById('entity-detail');
    if (!this.world || !this.selectedEntityId) {
      detail.innerHTML = '<div class="empty">No entity selected.</div>';
      return;
    }
    const entity = this.world.entities[this.selectedEntityId];
    if (!entity) {
      detail.innerHTML = '<div class="empty">No entity selected.</div>';
      return;
    }
    const components = Object.keys(entity.components).sort();
    const identity = entity.components.IdentityComponent || {};
    const room = entity.components.RoomComponent || {};
    detail.innerHTML = `
      <div class="detail-title">${entityIcon(entity)} ${esc(entityDisplayName(entity))}</div>
      <div class="detail-id">${esc(entity.id)}</div>
      <div class="pill-row">
        <span class="pill">${esc(entityType(entity))}</span>
        ${controlKind(entity, this.world) ? `<span class="pill">${esc(controlKind(entity, this.world))}</span>` : ''}
      </div>
      <div class="tiny">components</div>
      <div class="pill-row">${components.map(name => `<span class="pill">${esc(name)}</span>`).join('')}</div>
      <div class="mini-actions">
        <button data-use="id">Use ID</button>
        <button data-use="identity">Use Name</button>
        <button data-use="room">Use Room</button>
        <button data-use="binding">Bind Entity</button>
      </div>
    `;
    detail.querySelector('[data-use="id"]').addEventListener('click', () => this._applyEntityToQuery({ id: entity.id }));
    detail.querySelector('[data-use="identity"]').addEventListener('click', () => {
      if (identity.name) this._applyEntityToQuery({ identity_name: identity.name, identity_kind: identity.kind || '' });
    });
    detail.querySelector('[data-use="room"]').addEventListener('click', () => {
      if (room.title) this._applyEntityToQuery({ room_title: room.title, components: ['RoomComponent'] });
    });
    detail.querySelector('[data-use="binding"]').addEventListener('click', () => {
      const key = window.prompt('Binding name', this._suggestBinding(entity));
      if (!key) return;
      this.script.bindings = this.script.bindings || {};
      this.script.bindings[key] = entity.id;
      this._renderJson();
      this._status(`Bound $${key}`, 'ok');
    });
  }

  _suggestBinding(entity) {
    const name = entityDisplayName(entity).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    return name || 'entity';
  }

  _currentBlock() {
    return this.script.blocks[this.selectedBlock] || null;
  }

  _addBlock() {
    this.script.blocks.push(makeDefaultBlock(this.script.blocks.length + 1));
    this.selectedBlock = this.script.blocks.length - 1;
    this._renderBlocks();
    this._renderBlockEditor();
    this._renderJson();
  }

  _deleteBlock() {
    if (!this.script.blocks.length) return;
    this.script.blocks.splice(this.selectedBlock, 1);
    this.selectedBlock = Math.max(0, Math.min(this.selectedBlock, this.script.blocks.length - 1));
    this._renderBlocks();
    this._renderBlockEditor();
    this._renderJson();
  }

  _renderBlocks() {
    const list = document.getElementById('block-list');
    document.getElementById('block-count').textContent = String(this.script.blocks.length);
    document.getElementById('btn-delete-block').disabled = this.script.blocks.length === 0;
    if (!this.script.blocks.length) {
      list.innerHTML = '<div class="empty">No blocks.</div>';
      return;
    }
    list.innerHTML = this.script.blocks.map((block, i) => `
      <div class="block-row ${i === this.selectedBlock ? 'active' : ''}" data-index="${i}">
        <div class="block-name">${esc(block.name || `block_${i + 1}`)}</div>
        <div class="block-meta">${esc(this._triggerLabel(block.trigger))} · ${esc(block.execution || 'once')}</div>
      </div>
    `).join('');
    for (const row of list.querySelectorAll('.block-row')) {
      row.addEventListener('click', () => {
        this.selectedBlock = Number(row.dataset.index);
        this._renderBlocks();
        this._renderBlockEditor();
      });
    }
  }

  _triggerLabel(trigger) {
    if (!trigger) return 'trigger';
    if (trigger.tick) return 'tick';
    if (trigger.epoch_at_least != null) return `epoch >= ${trigger.epoch_at_least}`;
    if (trigger.event_type) return trigger.event_type;
    if (trigger.all) return 'all';
    if (trigger.any) return 'any';
    if (trigger.not) return 'not';
    return 'trigger';
  }

  _renderBlockEditor() {
    const root = document.getElementById('block-editor');
    const block = this._currentBlock();
    if (!block) {
      root.innerHTML = '<div class="empty">Add or select a block.</div>';
      return;
    }
    root.innerHTML = `
      <div class="form-section">
        <div class="section-title">Block</div>
        <div class="form-grid">
          <label class="field wide">Name
            <input id="block-name" type="text" value="${esc(block.name || '')}" spellcheck="false">
          </label>
          <label class="field">Priority
            <input id="block-priority" type="number" value="${Number(block.priority || 0)}">
          </label>
          <label class="field">Execution
            <select id="block-execution">
              <option value="once">once</option>
              <option value="always">always</option>
            </select>
          </label>
          <label class="field">Cooldown
            <input id="block-cooldown" type="number" min="0" value="${Number(block.cooldown_seconds || 0)}">
          </label>
        </div>
      </div>
      <div class="form-section">
        <div class="section-title">Trigger</div>
        ${this._renderTriggerForm(block.trigger || { tick: true })}
      </div>
      <div class="form-section">
        <div class="section-title">Actions</div>
        <div id="action-list">${block.actions.map((action, i) => this._renderAction(action, i)).join('')}</div>
        <div class="button-row">
          <button id="btn-add-submit">Add submit_command</button>
          <button id="btn-add-patch">Add patch_world</button>
        </div>
      </div>
    `;
    document.getElementById('block-execution').value = block.execution || 'once';
    this._bindBlockEditor(root);
  }

  _renderTriggerForm(trigger) {
    let type = 'tick';
    if (trigger.epoch_at_least != null) type = 'epoch';
    else if (trigger.event_type != null) type = 'event';
    else if (trigger.all || trigger.any || trigger.not) type = 'raw';
    return `
      <div class="form-grid">
        <label class="field">Type
          <select id="trigger-type">
            <option value="tick">tick</option>
            <option value="epoch">epoch_at_least</option>
            <option value="event">event</option>
            <option value="raw">raw JSON</option>
          </select>
        </label>
        <label class="field">Epoch
          <input id="trigger-epoch" type="number" min="0" value="${trigger.epoch_at_least ?? 0}">
        </label>
        <label class="field wide">Event Type
          <input id="trigger-event" type="text" value="${esc(trigger.event_type || '')}" spellcheck="false">
        </label>
        <label class="field full">Event Fields / Raw Trigger
          <textarea id="trigger-json" spellcheck="false">${esc(JSON.stringify(type === 'raw' ? trigger : (trigger.event_fields || {}), null, 2))}</textarea>
        </label>
      </div>
    `;
  }

  _renderAction(action, index) {
    if (action.kind === 'patch_world') {
      return `
        <div class="action-card" data-action="${index}">
          <div class="action-head">patch_world <button data-delete-action="${index}">Delete</button></div>
          <div class="action-body">
            <label class="field full">Operations
              <textarea class="action-ops" spellcheck="false">${esc(JSON.stringify(action.operations || [], null, 2))}</textarea>
            </label>
          </div>
        </div>
      `;
    }
    return `
      <div class="action-card" data-action="${index}">
        <div class="action-head">submit_command <button data-delete-action="${index}">Delete</button></div>
        <div class="action-body">
          <div class="form-grid">
            <label class="field">Mode
              <select class="target-mode">
                <option value="one">one</option>
                <option value="first">first</option>
                <option value="each">each</option>
              </select>
            </label>
            <label class="field">Bind
              <input class="target-bind" type="text" value="${esc(action.target?.bind || 'actor')}" spellcheck="false">
            </label>
            <label class="field wide">Command
              <input class="command-type" type="text" value="${esc(action.command_type || '')}" spellcheck="false">
            </label>
            <label class="field">Lane
              <select class="command-lane">
                <option value="world">world</option>
                <option value="focus">focus</option>
              </select>
            </label>
            <label class="field">On Points
              <select class="command-points">
                <option value="queue">queue</option>
                <option value="deny">deny</option>
              </select>
            </label>
            <label class="field">Action Cost
              <input class="cost-action" type="number" min="0" value="${Number(action.cost?.action || 0)}">
            </label>
            <label class="field">Focus Cost
              <input class="cost-focus" type="number" min="0" value="${Number(action.cost?.focus || 0)}">
            </label>
            <label class="field full">Target Query
              <textarea class="target-query" spellcheck="false">${esc(JSON.stringify(action.target?.query || {}, null, 2))}</textarea>
            </label>
            <label class="field full">Payload
              <textarea class="command-payload" spellcheck="false">${esc(JSON.stringify(action.payload || {}, null, 2))}</textarea>
            </label>
          </div>
        </div>
      </div>
    `;
  }

  _bindBlockEditor(root) {
    const block = this._currentBlock();
    const updateBlock = () => {
      block.name = document.getElementById('block-name').value.trim() || block.name;
      block.priority = Number(document.getElementById('block-priority').value || 0);
      block.execution = document.getElementById('block-execution').value;
      block.cooldown_seconds = Number(document.getElementById('block-cooldown').value || 0);
      this._updateTriggerFromForm(block);
      this._updateActionsFromForm(block);
      this._renderBlocks();
      this._renderJson();
    };
    for (const el of root.querySelectorAll('input, select, textarea')) {
      el.addEventListener('input', updateBlock);
      el.addEventListener('change', updateBlock);
    }
    document.getElementById('btn-add-submit').addEventListener('click', () => {
      block.actions.push(makeDefaultSubmitAction());
      this._renderBlockEditor();
      this._renderJson();
    });
    document.getElementById('btn-add-patch').addEventListener('click', () => {
      block.actions.push(makeDefaultPatchAction());
      this._renderBlockEditor();
      this._renderJson();
    });
    for (const btn of root.querySelectorAll('[data-delete-action]')) {
      btn.addEventListener('click', () => {
        block.actions.splice(Number(btn.dataset.deleteAction), 1);
        this._renderBlockEditor();
        this._renderJson();
      });
    }
    for (const card of root.querySelectorAll('.action-card')) {
      const idx = Number(card.dataset.action);
      const action = block.actions[idx];
      if (action.kind === 'submit_command') {
        card.querySelector('.target-mode').value = action.target?.mode || 'one';
        card.querySelector('.command-lane').value = action.lane || 'world';
        card.querySelector('.command-points').value = action.on_insufficient_points || 'queue';
      }
    }
    document.getElementById('trigger-type').value = this._triggerFormType(block.trigger);
  }

  _triggerFormType(trigger) {
    if (trigger?.epoch_at_least != null) return 'epoch';
    if (trigger?.event_type != null) return 'event';
    if (trigger?.all || trigger?.any || trigger?.not) return 'raw';
    return 'tick';
  }

  _updateTriggerFromForm(block) {
    const type = document.getElementById('trigger-type').value;
    const jsonEl = document.getElementById('trigger-json');
    jsonEl.classList.remove('bad-json');
    try {
      if (type === 'tick') {
        block.trigger = { tick: true };
      } else if (type === 'epoch') {
        block.trigger = { epoch_at_least: Number(document.getElementById('trigger-epoch').value || 0) };
      } else if (type === 'event') {
        block.trigger = {
          event_type: document.getElementById('trigger-event').value.trim() || 'DomainEvent',
          event_fields: parseJsonObject(jsonEl.value, {})
        };
      } else {
        block.trigger = parseJsonObject(jsonEl.value, { tick: true });
      }
    } catch (_err) {
      jsonEl.classList.add('bad-json');
    }
  }

  _updateActionsFromForm(block) {
    for (const card of document.querySelectorAll('.action-card')) {
      const idx = Number(card.dataset.action);
      const action = block.actions[idx];
      if (!action) continue;
      if (action.kind === 'patch_world') {
        const el = card.querySelector('.action-ops');
        el.classList.remove('bad-json');
        try {
          action.operations = parseJsonArray(el.value, []);
        } catch (_err) {
          el.classList.add('bad-json');
        }
      } else {
        const queryEl = card.querySelector('.target-query');
        const payloadEl = card.querySelector('.command-payload');
        queryEl.classList.remove('bad-json');
        payloadEl.classList.remove('bad-json');
        action.target = action.target || { query: {}, mode: 'one', bind: 'actor' };
        action.target.mode = card.querySelector('.target-mode').value;
        action.target.bind = card.querySelector('.target-bind').value.trim() || 'actor';
        action.command_type = card.querySelector('.command-type').value.trim();
        action.lane = card.querySelector('.command-lane').value;
        action.on_insufficient_points = card.querySelector('.command-points').value;
        action.cost = {
          action: Number(card.querySelector('.cost-action').value || 0),
          focus: Number(card.querySelector('.cost-focus').value || 0)
        };
        try {
          action.target.query = parseJsonObject(queryEl.value, {});
        } catch (_err) {
          queryEl.classList.add('bad-json');
        }
        try {
          action.payload = parseJsonObject(payloadEl.value, {});
        } catch (_err) {
          payloadEl.classList.add('bad-json');
        }
      }
    }
  }

  _applyEntityToQuery(patch) {
    const block = this._currentBlock();
    if (!block) return;
    const action = block.actions.find(item => item.kind === 'submit_command');
    if (!action) {
      this._status('Add a submit_command action first', 'err');
      return;
    }
    action.target = action.target || { mode: 'one', bind: 'actor', query: {} };
    action.target.query = patch.id ? { id: patch.id } : { ...patch };
    this._renderBlockEditor();
    this._renderJson();
    this._status('Target query updated', 'ok');
  }

  _scriptForExport() {
    const out = this._normalizeScript(this.script);
    out.bindings = this.script.bindings || {};
    return out;
  }

  _renderJson() {
    const out = this._scriptForExport();
    const text = JSON.stringify(out, null, 2);
    document.getElementById('json-output').value = text;
    document.getElementById('json-size').textContent = `${new Blob([text]).size} bytes`;
    const problems = this._validate(out);
    const el = document.getElementById('problems');
    if (problems.length) {
      el.className = '';
      el.innerHTML = problems.map(esc).join('<br>');
    } else {
      el.className = 'ok';
      el.textContent = 'Valid script JSON.';
    }
  }

  _validate(script) {
    const problems = [];
    if (!script.id) problems.push('script.id is required');
    const seen = new Set();
    for (const [i, block] of script.blocks.entries()) {
      if (!block.name) problems.push(`blocks[${i}].name is required`);
      if (seen.has(block.name)) problems.push(`duplicate block name: ${block.name}`);
      seen.add(block.name);
      if (!block.trigger || !Object.keys(block.trigger).length) problems.push(`${block.name}: trigger is required`);
      for (const [j, action] of (block.actions || []).entries()) {
        if (!action.kind) problems.push(`${block.name}: actions[${j}].kind is required`);
        if (action.kind === 'submit_command') {
          if (!action.command_type) problems.push(`${block.name}: submit_command requires command_type`);
          if (!action.target?.query) problems.push(`${block.name}: submit_command requires target.query`);
        }
      }
    }
    return problems;
  }

  _download() {
    const text = document.getElementById('json-output').value;
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(this.script.id || 'script').replace(/[^a-zA-Z0-9_.-]+/g, '_')}.json`;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(a.href);
    a.remove();
    this._status('JSON downloaded', 'ok');
  }

  async _copyJson() {
    try {
      await navigator.clipboard.writeText(document.getElementById('json-output').value);
      this._status('JSON copied', 'ok');
    } catch (_err) {
      this._status('Clipboard unavailable', 'err');
    }
  }
}

window.app = new ScriptEditor();
</script>
