<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland Script Editor</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    #script-id { width: 230px; }
    #script-name { width: 220px; }
    #script-version { width: 78px; }
    #main {
      grid-template-columns: minmax(250px, 320px) minmax(520px, 1fr) minmax(330px, 430px);
    }

    #entity-search {
      margin: 8px 10px 6px 10px;
      width: calc(100% - 20px);
    }
    #entity-list {
      padding-bottom: 8px;
      border-bottom: 1px solid var(--bl-border);
      max-height: 45%;
      overflow-y: auto;
    }
    #entity-detail {
      padding: 10px;
      font-size: 11px;
      line-height: 1.65;
    }
    .detail-title {
      color: var(--bl-text);
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail-id {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      word-break: break-all;
      margin-bottom: 8px;
    }
    .pill-row { margin: 5px 0 9px 0; }
    .mini-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-top: 8px;
    }
    #editor-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      overflow: hidden;
    }
    #block-list {
      border-right: 1px solid var(--bl-border);
      min-height: 0;
      overflow-y: auto;
    }
    .block-row {
      padding: 7px 9px;
      border-bottom: 1px solid var(--bl-bg-row);
      cursor: pointer;
      font-size: var(--bl-text-sm);
    }
    .block-row:hover, .block-row.active { background: var(--bl-surface); }
    .block-name {
      color: var(--bl-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .block-meta {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      margin-top: 3px;
    }
    textarea { min-height: 74px; }

    @media (max-width: 1050px) {
      #main { grid-template-columns: 280px minmax(520px, 1fr); }
      #preview-pane { display: none; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

  </style>
</head>
<body class="bl-tool-page bl-page-script-editor">
  <div id="app"></div>
  <script src="assets/bunnyland-ui.js?v=20260718-formal-v1"></script>
  <script src="assets/bunnyland-world.js"></script>
  <script type="module" src="/src/script-editor/app.tsx"></script>
</body>
</html>
