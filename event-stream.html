<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland Event Stream</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    .pane-title { margin: 0; }
    #api-url { width: 240px; }
    #poll-interval { width: 72px; }
    #event-search { width: 100%; }

    #main { grid-template-columns: 300px minmax(460px, 1fr); }
    #controls-pane .pane-body { padding: 10px; }
    .control-stack { gap: 9px; }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }

    .control-row input[type="checkbox"] { margin: 0; }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .metric {
      border: 1px solid var(--bl-border);
      border-radius: var(--bl-radius-md);
      background: var(--bl-bg);
      padding: 9px;
    }

    .metric strong {
      display: block;
      color: var(--bl-text);
      font-size: 18px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
    }

    #event-type-filter { width: 100%; }

    #event-list {
      height: 100%;
      overflow-y: auto;
      background: var(--bl-bg-strong);
    }

    .event-record {
      border-bottom: 1px solid var(--bl-border-muted);
      background: var(--bl-bg-strong);
      contain: layout paint style;
      content-visibility: auto;
      contain-intrinsic-size: auto 36px;
    }

    .event-record[open] { background: var(--bl-bg); }

    .event-record summary {
      display: grid;
      grid-template-columns: 82px 32px 190px minmax(0, 1fr) 94px;
      gap: 8px;
      align-items: center;
      min-height: 36px;
      padding: 6px 10px;
      cursor: pointer;
      list-style: none;
    }

    .event-record summary::-webkit-details-marker { display: none; }
    .event-record summary:hover { background: var(--bl-bg-subtle); }

    .ev-epoch,
    .ev-type,
    .ev-actor,
    .ev-summary,
    .ev-visibility {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ev-epoch,
    .ev-visibility {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
    }

    .ev-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      color: var(--bl-accent-strong);
      background: var(--bl-bg);
      font-family: var(--bl-font-mono);
      font-size: var(--bl-text-sm);
      font-weight: bold;
    }

    .ev-type {
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
      font-weight: bold;
    }

    .ev-actor {
      color: var(--bl-accent);
      font-size: var(--bl-text-sm);
    }

    .ev-summary {
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }

    .event-detail {
      display: grid;
      grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
      gap: 12px;
      padding: 0 10px 12px 132px;
    }

    .detail-box {
      min-width: 0;
      border: 1px solid var(--bl-border);
      border-radius: var(--bl-radius-md);
      background: var(--bl-bg-strong);
      padding: 9px;
    }

    .detail-title {
      margin-bottom: 7px;
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      font-weight: bold;
      text-transform: uppercase;
    }

    .entity-chip-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .entity-chip {
      min-width: 0;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg);
      padding: 6px;
    }

    .entity-chip strong,
    .entity-chip code {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entity-chip strong {
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
    }

    .entity-chip code {
      margin-top: 3px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
    }

    .json-view {
      max-height: 360px;
      overflow: auto;
      margin: 0;
      color: var(--bl-text-soft);
      font-family: var(--bl-font-mono);
      font-size: var(--bl-text-sm);
      line-height: 1.45;
      white-space: pre;
    }

    .empty {
      padding: 18px 14px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    @media (max-width: 1050px) {
      #main { grid-template-columns: 1fr; }

      .event-record summary {
        grid-template-columns: 72px 28px minmax(120px, 0.5fr) minmax(0, 1fr);
      }

      .ev-visibility { display: none; }

      .event-detail {
        grid-template-columns: 1fr;
        padding-left: 10px;
      }
    }

  </style>
</head>
<body class="bl-tool-page bl-page-event-stream">
<div id="app"></div>
<script src="assets/bunnyland-ui.js"></script>
<script src="assets/bunnyland-api.js"></script>
<script src="assets/bunnyland-events.js"></script>
<script src="assets/bunnyland-world.js"></script>
<script type="module" src="/src/event-stream/page.tsx"></script>
</body>
</html>
