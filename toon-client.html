<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Toon</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #api-url { width: 190px; }
    #api-status { font-size: var(--bl-text-sm); white-space: nowrap; }
    #player-select, #claim-fallback, #claim-timeout, #room-title { font-size: var(--bl-text-sm); }
    #claim-timeout { width: 56px; }
    #room-title { color: var(--bl-text-soft); }

    /* ── Split layout: visual world on the left, actions on the right ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    #stage-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bl-bg-deep);
    }

    /* The room view: a fixed coordinate plane whose origin (0,0) is its centre. */
    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: crosshair;
      outline: none;
    }
    #stage.spectating { cursor: default; }

    #room-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-md);
      z-index: 0;
    }

    .sprite {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      user-select: none;
      pointer-events: none;
      text-align: center;
    }
    .sprite .glyph {
      font-size: 30px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
    }
    .sprite img.glyph {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .sprite .label {
      font-size: var(--bl-text-xs);
      color: var(--bl-text-soft);
      background: rgba(17, 17, 27, 0.7);
      border-radius: var(--bl-radius-sm);
      padding: 0 3px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sprite.player .glyph { filter: drop-shadow(0 0 6px var(--bl-accent)); }
    .sprite.player .label { color: var(--bl-accent); }

    /* Doors are pinned to the edge matching their compass direction. */
    .door {
      position: absolute;
      z-index: 5000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 3px 7px;
      background: var(--bl-surface);
      border: 1px solid var(--bl-border-strong);
      border-radius: var(--bl-radius-md);
      color: var(--bl-text);
      font-size: var(--bl-text-xs);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--bl-shadow-popover);
    }
    .door:hover { background: var(--bl-surface-hover); border-color: var(--bl-accent); }
    .door .door-dir { color: var(--bl-text-dim); }

    #stage-hint {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 6000;
      font-size: var(--bl-text-xs);
      color: var(--bl-text-muted);
      background: rgba(17, 17, 27, 0.8);
      padding: 3px 8px;
      border-radius: var(--bl-radius-sm);
      pointer-events: none;
    }

    #stage-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--bl-text-muted);
      z-index: 7000;
    }
    #stage-empty .title { font-size: 18px; color: var(--bl-text); }
    #stage-empty.hidden { display: none; }

    /* ── Right sidebar: room action verbs (reserved, mostly empty for now) ── */
    #actions {
      width: 300px;
      min-width: 220px;
      border-left: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #actions-header {
      padding: 7px 12px;
      border-bottom: 1px solid var(--bl-border);
      font-size: var(--bl-text-md);
      color: var(--bl-text);
    }
    #actions-body { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .action-section-title {
      font-size: var(--bl-text-xs);
      color: var(--bl-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 12px 0 6px;
    }
    .action-section-title:first-child { margin-top: 0; }

    #pt-summary {
      display: flex;
      gap: 12px;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: var(--bl-bg-subtle);
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-md);
      font-size: var(--bl-text-sm);
    }
    #pt-summary .pt.ap { color: var(--bl-warn); }
    #pt-summary .pt.fp { color: var(--bl-info); }
    #pt-summary .pt-empty { color: var(--bl-text-muted); }

    .verb-list { display: flex; flex-direction: column; gap: 4px; }
    .verb {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 9px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-surface);
      font-size: var(--bl-text-sm);
      color: var(--bl-text);
    }
    .verb.ready { cursor: pointer; }
    .verb.ready:hover { background: var(--bl-surface-hover); border-color: var(--bl-accent); }
    .verb.unafford { opacity: 0.45; cursor: not-allowed; }
    .verb-name { white-space: nowrap; }
    .verb-cost { display: flex; align-items: center; gap: 4px; }
    .verb-cost .cost {
      font-size: var(--bl-text-xs);
      padding: 0 4px;
      border-radius: var(--bl-radius-sm);
      border: 1px solid var(--bl-border-control);
    }
    .verb-cost .cost.ap { color: var(--bl-warn); }
    .verb-cost .cost.fp { color: var(--bl-info); }
    .verb-cost .cost.free { color: var(--bl-text-dim); }
    .verb-cost .verb-note { font-size: var(--bl-text-xs); color: var(--bl-text-dim); }

    .queued-list { display: flex; flex-direction: column; gap: 6px; }
    .queued-action {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 6px 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      font-size: var(--bl-text-sm);
    }
    .queued-action-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--bl-text);
    }
    .queued-action-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queued-action-lane {
      flex: 0 0 auto;
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
    }
    .queued-action-detail {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .queued-empty {
      padding: 6px 8px;
      border: 1px dashed var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    /* ── Target picker (overlays the visual world) ── */
    #target-overlay {
      position: absolute;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17, 17, 27, 0.6);
    }
    .target-card {
      width: 300px;
      max-height: 75%;
      display: flex;
      flex-direction: column;
      background: var(--bl-bg);
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      box-shadow: var(--bl-shadow-popover);
      overflow: hidden;
    }
    .target-card-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--bl-border);
      font-size: var(--bl-text-md);
      color: var(--bl-text);
    }
    .target-list { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .target-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border-radius: var(--bl-radius-sm);
      background: var(--bl-surface);
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
      cursor: pointer;
    }
    .target-item:hover { background: var(--bl-surface-hover); }
    .target-item .ti-icon { font-size: 18px; line-height: 1; }
    .target-empty { padding: 12px; color: var(--bl-text-muted); font-size: var(--bl-text-sm); }
    .target-card-footer { padding: 8px 12px; border-top: 1px solid var(--bl-border); display: flex; justify-content: flex-end; }
  </style>
</head>
<body>

<div id="toolbar">
  <div class="toolbar-row" id="toolbar-row1">
    <span style="color: var(--bl-text);">🐰 Bunnyland Toon</span>
    <span class="toolbar-sep">|</span>
    <label for="api-url">Server:</label>
    <input type="text" id="api-url" value="http://localhost:8765" spellcheck="false">
    <button id="btn-connect">Connect Live</button>
    <span id="api-status">○ Offline</span>
    <span class="toolbar-sep">|</span>
    <label for="player-select">Player:</label>
    <select id="player-select"><option value="">— none —</option></select>
    <label for="claim-fallback">Fallback:</label>
    <select id="claim-fallback">
      <option value="suspend">Suspend</option>
      <option value="llm">LLM</option>
    </select>
    <label for="claim-timeout">Timeout:</label>
    <input type="number" id="claim-timeout" min="5" max="60" step="1" value="30">
    <button id="btn-client-menu" class="client-menu-button" type="button">Menu</button>
  </div>
  <div class="toolbar-row" id="toolbar-row2">
    <button id="btn-follow" title="Re-centre the view on your player's room">⌖ Follow player</button>
    <span class="toolbar-sep">|</span>
    <span id="room-title">Not connected</span>
  </div>
</div>

<div id="main">
  <div id="stage-wrapper">
    <div id="stage" tabindex="0">
      <div id="room-bg"></div>
    </div>
    <div id="stage-hint"></div>
    <div id="stage-empty">
      <div class="title">No room to show</div>
      <div>Connect to a running server, then pick a player.</div>
    </div>
  </div>
  <div id="actions">
    <div id="actions-header">⚔ Actions</div>
    <div id="actions-body"></div>
  </div>
</div>

<script src="assets/bunnyland-ui.js"></script>
<script>
'use strict';

BunnylandUI.initClientMenu();

// ── Entity-model helpers (shared shapes with the Inspector) ────────────────────

// Live server format: entities are an array, relationship edges use target_id.
function parseApiSnapshot(data) {
  const entities = {};
  for (const e of data.entities || []) {
    const rels = {};
    for (const [rtype, edges] of Object.entries(e.relationships || {})) {
      rels[rtype] = edges.map(({ target_id, edge }) => ({ target: target_id, edge: edge || {} }));
    }
    entities[e.id] = { id: e.id, components: e.components || {}, relationships: rels };
  }
  return { entities, epoch: data.world_epoch || 0, queuedCommands: data.queued_commands || [] };
}

const KIND_ICON = {
  room: '🏠', character: '🐰', container: '📦', item: '✦',
  door: '🚪', food: '🍎', water: '💧', chair: '🪑', table: '🪵',
  bed: '🛏', art: '🖼', window: '🪟', other: '⬡',
};

function entityType(entity) {
  const c = entity.components;
  if (c.RoomComponent) return 'room';
  if (c.CharacterComponent) return 'character';
  if (c.DoorComponent) return 'door';
  if (c.ContainerComponent) return 'container';
  if (c.PortableComponent) return 'item';
  return 'other';
}

// A custom EditorDisplayComponent.emoji wins; else fall back to kind iconography.
function entityIcon(entity) {
  const emoji = entity?.components?.EditorDisplayComponent?.emoji;
  if (emoji) return emoji;
  const kind = entity?.components?.IdentityComponent?.kind;
  return KIND_ICON[kind] || KIND_ICON[entityType(entity)] || KIND_ICON.other;
}

function entityName(entity) {
  const c = entity.components;
  if (c.RoomComponent) return c.RoomComponent.title || entity.id;
  return c.IdentityComponent?.name || entity.id.slice(0, 16);
}

// Compass direction → unit edge offset, mirroring the Inspector's room layout.
const DIR_EDGE = {
  north: [0, -1], south: [0, 1], east: [1, 0], west: [-1, 0],
  northeast: [1, -1], northwest: [-1, -1], southeast: [1, 1], southwest: [-1, 1],
  up: [0, -1], down: [0, 1], fore: [0, -1], aft: [0, 1], port: [-1, 0], starboard: [1, 0],
};

const SYNC_INTERVAL_MS = 500;   // how often optimistic moves are pushed to the server
const MOVE_STEP = 18;           // pixels per arrow/WASD keypress
const CLIENT_DB_NAME = 'bunnyland-toon';
const CLIENT_DB_STORE = 'settings';
const CLIENT_ID_KEY = 'client-id';

// The common room/focus verbs a player can attempt, mirroring the canonical costs in
// the server's llm_agents/tools.py. `ap`/`fp` are the action/focus cost; `target` names
// the payload key plus which nearby entities are candidates (resolved by the picker);
// `prompt` names a free-text arg to collect. Domain/situational verbs (farming, ships,
// economy, ...) are intentionally omitted for now.
const ACTION_VERBS = [
  { tool: 'move',      label: 'Move',      cmd: 'move',  ap: 1, fp: 0, lane: 'world', target: { key: 'exit_id', kind: 'exits' } },
  { tool: 'take',      label: 'Take',      cmd: 'take',  ap: 1, fp: 0, lane: 'world', target: { key: 'item_id', kind: 'roomItems' } },
  { tool: 'drop',      label: 'Drop',      cmd: 'put',   ap: 1, fp: 0, lane: 'world', target: { key: 'item_id', kind: 'inventory' } },
  { tool: 'use',       label: 'Use',       cmd: 'use',   ap: 1, fp: 0, lane: 'world', target: { key: 'target_id', kind: 'reachableItems' } },
  { tool: 'eat',       label: 'Eat',       cmd: 'eat',   ap: 1, fp: 0, lane: 'world', target: { key: 'item_id', kind: 'reachableItems' } },
  { tool: 'drink',     label: 'Drink',     cmd: 'drink', ap: 1, fp: 0, lane: 'world', target: { key: 'source_id', kind: 'reachableItems' } },
  { tool: 'tell',      label: 'Tell',      cmd: 'tell',  ap: 1, fp: 1, lane: 'world', target: { key: 'target_id', kind: 'characters' }, prompt: 'text' },
  { tool: 'say',       label: 'Say',       cmd: 'say',   ap: 1, fp: 1, lane: 'world', prompt: 'text' },
  { tool: 'wait',      label: 'Wait',      cmd: 'wait',  ap: 0, fp: 0, lane: 'world' },
  { tool: 'take_note', label: 'Take note', cmd: 'take-note', ap: 0, fp: 1, lane: 'focus', prompt: 'text' },
  { tool: 'remember',  label: 'Remember',  cmd: 'remember',  ap: 0, fp: 1, lane: 'focus', prompt: 'query' },
  { tool: 'reflect',   label: 'Reflect',   cmd: 'reflect',   ap: 0, fp: 1, lane: 'focus', prompt: 'text' },
];

const fmtPoints = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));

function randomClientId() {
  if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  if (globalThis.crypto?.getRandomValues) {
    crypto.getRandomValues(bytes);
  } else {
    for (let i = 0; i < bytes.length; i += 1) {
      bytes[i] = Math.floor(Math.random() * 256);
    }
  }
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = [...bytes].map((byte) => byte.toString(16).padStart(2, '0'));
  return `${hex.slice(0, 4).join('')}-${hex.slice(4, 6).join('')}-${hex.slice(6, 8).join('')}-${hex.slice(8, 10).join('')}-${hex.slice(10, 16).join('')}`;
}

async function persistentClientId() {
  if (!window.indexedDB) return persistentClientIdFallback();

  return new Promise((resolve) => {
    const open = indexedDB.open(CLIENT_DB_NAME, 1);
    open.onupgradeneeded = () => {
      open.result.createObjectStore(CLIENT_DB_STORE);
    };
    open.onerror = () => {
      console.warn('Could not open IndexedDB for Bunnyland client id', open.error);
      resolve(persistentClientIdFallback());
    };
    open.onsuccess = () => {
      const db = open.result;
      const tx = db.transaction(CLIENT_DB_STORE, 'readwrite');
      const store = tx.objectStore(CLIENT_DB_STORE);
      const get = store.get(CLIENT_ID_KEY);
      get.onerror = () => {
        console.warn('Could not read Bunnyland client id from IndexedDB', get.error);
        resolve(persistentClientIdFallback());
      };
      get.onsuccess = () => {
        const existing = typeof get.result === 'string' ? get.result : '';
        const clientId = existing || randomClientId();
        if (!existing) store.put(clientId, CLIENT_ID_KEY);
        resolve(clientId);
      };
    };
  });
}

function persistentClientIdFallback() {
  const key = 'bunnyland.toon.clientId';
  try {
    let clientId = localStorage.getItem(key);
    if (!clientId) {
      clientId = randomClientId();
      localStorage.setItem(key, clientId);
    }
    return clientId;
  } catch (err) {
    console.warn('Could not persist Bunnyland client id in localStorage', err);
    return randomClientId();
  }
}

// ── The room client ────────────────────────────────────────────────────────────

class RoomClient {
  constructor() {
    this.apiBase = null;
    this.ws = null;
    this.world = null;
    this.playerId = '';
    this.control = null;
    this.viewRoomId = null;
    this.followPlayer = true;
    this.localPos = null;        // optimistic {x, y} for the player, room-centred
    this.localDirty = false;
    this._refreshTimer = null;
    this._clientId = null;
    this._clientIdPromise = persistentClientId();

    this._bindUi();
    this.render();                 // show the initial (disconnected) action panel
    this._restoreServerParam();
    setInterval(() => this._syncTick(), SYNC_INTERVAL_MS);
  }

  _bindUi() {
    document.getElementById('btn-connect').addEventListener('click', () => {
      if (this.ws) this.disconnect();
      else this.connect(document.getElementById('api-url').value.trim());
    });
    document.getElementById('player-select').addEventListener('change', (e) => {
      this._selectPlayer(e.target.value);
    });
    document.getElementById('claim-fallback').addEventListener('change', () => {
      this._updateClaimFallback();
    });
    document.getElementById('claim-timeout').addEventListener('change', () => {
      this._updateClaimFallback();
    });
    document.getElementById('btn-follow').addEventListener('click', () => {
      this.followPlayer = true;
      this._recenterOnPlayer();
      this.render();
    });

    const stage = document.getElementById('stage');
    stage.addEventListener('click', (e) => this._onStageClick(e));
    stage.addEventListener('keydown', (e) => this._onKey(e));
  }

  _restoreServerParam() {
    const server = new URLSearchParams(location.search).get('server');
    if (server) {
      document.getElementById('api-url').value = server;
      this.connect(server);
    }
  }

  // ── Connection ───────────────────────────────────────────────────────────────

  connect(url) {
    if (!url) return;
    this.disconnect();
    this.apiBase = url.replace(/\/$/, '');
    const wsUrl = this.apiBase.replace(/^http/, 'ws') + '/world/updates';
    const ws = new WebSocket(wsUrl);
    this.ws = ws;

    ws.onopen = () => {
      this._setStatus('live', '● Connected');
      document.getElementById('btn-connect').textContent = 'Disconnect';
      this._syncUrl();
    };
    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'snapshot') {
        this._applyWorld(parseApiSnapshot(msg.data));
      } else if (msg.type === 'event' || msg.type === 'patch') {
        clearTimeout(this._refreshTimer);
        this._refreshTimer = setTimeout(() => this._refresh(), 250);
      }
    };
    ws.onclose = () => {
      if (this.ws === ws) {
        this.ws = null;
        this._setStatus('', '○ Offline');
        document.getElementById('btn-connect').textContent = 'Connect Live';
      }
    };
    ws.onerror = () => this._setStatus('error', '⚠ Connection failed');
  }

  disconnect() {
    clearTimeout(this._refreshTimer);
    if (this.ws) {
      this.ws.onclose = null;
      this.ws.close();
      this.ws = null;
    }
    this._setStatus('', '○ Offline');
    document.getElementById('btn-connect').textContent = 'Connect Live';
    this._syncUrl();
  }

  async _refresh() {
    try {
      const res = await fetch(`${this.apiBase}/world/snapshot`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      this._applyWorld(parseApiSnapshot(await res.json()));
      this._setStatus('live', `● Live · epoch ${this.world.epoch}s`);
    } catch (err) {
      this._setStatus('error', `⚠ ${err.message}`);
    }
  }

  _applyWorld(world) {
    this.world = world;
    this._refreshPlayerOptions();
    if (this.followPlayer) this._recenterOnPlayer();
    if (!this.viewRoomId || !this.world.entities[this.viewRoomId]) {
      this.viewRoomId = this._playerRoomId() || this._firstRoomId();
    }
    this.render();
  }

  _setStatus(cls, text) {
    const el = document.getElementById('api-status');
    el.className = cls;
    el.textContent = text;
  }

  _syncUrl() {
    const url = new URL(location.href);
    if (this.apiBase) url.searchParams.set('server', this.apiBase);
    else url.searchParams.delete('server');
    history.replaceState(null, '', url);
  }

  // ── World queries ──────────────────────────────────────────────────────────

  _rooms() {
    return Object.values(this.world?.entities || {}).filter(e => e.components.RoomComponent);
  }

  _firstRoomId() {
    const room = this._rooms()[0];
    return room ? room.id : null;
  }

  // The room directly containing an entity (rooms own members via Contains edges).
  _roomOf(entityId) {
    if (!entityId) return null;
    for (const room of this._rooms()) {
      for (const { target } of (room.relationships.Contains || [])) {
        if (target === entityId) return room.id;
      }
    }
    return null;
  }

  _playerRoomId() {
    return this._roomOf(this.playerId);
  }

  // Members (characters + objects) sitting directly in a room.
  _roomMembers(roomId) {
    const room = this.world.entities[roomId];
    if (!room) return [];
    return (room.relationships.Contains || [])
      .map(({ target }) => this.world.entities[target])
      .filter(Boolean);
  }

  _spritePos(entity) {
    const p = entity.components.SpritePosition;
    return p ? { x: p.x || 0, y: p.y || 0 } : { x: 0, y: 0 };
  }

  _spriteLayer(entity) {
    return entity.components.SpriteLayer?.layer ?? 20;
  }

  _spriteScale(entity) {
    return entity.components.SpriteScale?.scale ?? 1;
  }

  // ── Player control ───────────────────────────────────────────────────────────

  _refreshPlayerOptions() {
    const select = document.getElementById('player-select');
    const chars = Object.values(this.world.entities)
      .filter(e => e.components.CharacterComponent)
      .sort((a, b) => entityName(a).localeCompare(entityName(b)));
    const current = this.playerId;
    select.innerHTML = '<option value="">— none —</option>' +
      chars.map(c => `<option value="${c.id}">${BunnylandUI.escapeHtml(entityName(c))}</option>`).join('');
    if (current && this.world.entities[current]) select.value = current;
    else {
      this.playerId = '';
      this.control = null;
    }
  }

  _selectPlayer(id) {
    this.playerId = id;
    this.control = null;
    document.getElementById('player-select').value = id;
    this.followPlayer = true;
    this.localPos = null;          // adopt the server position for the new player
    this._recenterOnPlayer();
    this.render();
    if (id) this._claimPlayer(id);
  }

  _recenterOnPlayer() {
    const roomId = this._playerRoomId();
    if (roomId) this.viewRoomId = roomId;
  }

  // Controller (id + generation) claimed by this browser client.
  _playerControl() {
    if (this.control?.characterId === this.playerId) {
      return { controllerId: this.control.controllerId, generation: this.control.generation };
    }
    return null;
  }

  async _clientIdValue() {
    if (!this._clientId) this._clientId = await this._clientIdPromise;
    return this._clientId;
  }

  async _claimPlayer(playerId = this.playerId) {
    if (!this.apiBase || !playerId) return null;
    try {
      const clientId = await this._clientIdValue();
      const res = await fetch(`${this.apiBase}/world/controllers/web/claim`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...this._claimSettings(),
          character_id: playerId,
          client_id: clientId,
          label: 'toon',
        }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const control = {
        characterId: data.character_id,
        controllerId: data.controller_id,
        generation: data.controller_generation,
      };
      if (this.playerId === playerId) this.control = control;
      return control;
    } catch (err) {
      console.warn('Could not claim Bunnyland web controller', err);
      return null;
    }
  }

  _claimSettings() {
    const fallback = document.getElementById('claim-fallback').value;
    const rawMinutes = Number(document.getElementById('claim-timeout').value);
    const minutes = Number.isFinite(rawMinutes) ? Math.min(60, Math.max(5, rawMinutes)) : 30;
    return { fallback_controller: fallback, timeout_seconds: Math.round(minutes * 60) };
  }

  async _updateClaimFallback() {
    if (!this.apiBase || !this.playerId || !this.control) return;
    try {
      const clientId = await this._clientIdValue();
      const res = await fetch(`${this.apiBase}/world/controllers/web/fallback`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...this._claimSettings(),
          character_id: this.playerId,
          client_id: clientId,
        }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      this.control = {
        characterId: data.character_id,
        controllerId: data.controller_id,
        generation: data.controller_generation,
      };
    } catch (err) {
      console.warn('Could not update Bunnyland claim fallback', err);
    }
  }

  _playerInView() {
    return this.playerId && this.viewRoomId && this._playerRoomId() === this.viewRoomId;
  }

  // The player's live action/focus points, read from the snapshot.
  _playerPoints() {
    const p = this.world?.entities[this.playerId];
    const ap = p?.components?.ActionPointsComponent;
    const fp = p?.components?.FocusPointsComponent;
    return {
      has: !!p,
      ap: ap?.current ?? 0, apMax: ap?.maximum ?? 0,
      fp: fp?.current ?? 0, fpMax: fp?.maximum ?? 0,
    };
  }

  _playerQueuedCommands() {
    return (this.world?.queuedCommands || []).filter(command => command.character_id === this.playerId);
  }

  // Submit a command as this browser client's claimed controller.
  // Returns true on a 2xx response.
  async _postCommand(commandType, payload, ap, fp, lane = 'world') {
    const control = this._playerControl() || await this._claimPlayer();
    if (!this.apiBase || !control) return false;
    try {
      const res = await fetch(`${this.apiBase}/world/commands`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          character_id: this.playerId,
          controller_id: control.controllerId,
          controller_generation: control.generation,
          command_type: commandType,
          payload,
          cost: { action: ap, focus: fp },
          lane,
          on_insufficient_points: 'queue',
        }),
      });
      return res.ok;
    } catch (err) {
      console.warn('Could not submit Bunnyland command', err);
      return false;
    }
  }

  // ── Optimistic movement + periodic sync ──────────────────────────────────────

  _moveTo(x, y) {
    if (!this._playerInView()) return;
    this.localPos = { x, y };
    this.localDirty = true;
    this.render();
  }

  _onStageClick(e) {
    if (e.target.closest('.door')) return;       // door clicks navigate, not move
    if (!this._playerInView()) return;
    const stage = document.getElementById('stage');
    const rect = stage.getBoundingClientRect();
    this._moveTo(e.clientX - rect.left - rect.width / 2, e.clientY - rect.top - rect.height / 2);
  }

  _onKey(e) {
    if (!this._playerInView()) return;
    const deltas = {
      ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0],
    };
    const delta = deltas[e.key];
    if (!delta) return;
    e.preventDefault();
    const base = this.localPos || this._spritePos(this.world.entities[this.playerId]);
    this._moveTo(base.x + delta[0] * MOVE_STEP, base.y + delta[1] * MOVE_STEP);
  }

  async _syncTick() {
    if (!this.localDirty || !this.ws || !this.localPos) return;
    const pos = this.localPos;
    this.localDirty = false;
    // move-sprite is free (0 AP / 0 FP); retry on the next tick if it fails.
    const ok = await this._postCommand('move-sprite', { x: pos.x, y: pos.y }, 0, 0);
    if (!ok) this.localDirty = true;
  }

  // ── Room action verbs ────────────────────────────────────────────────────────

  async _doVerb(verb) {
    const payload = {};
    if (verb.target) {
      const choice = await this._pickTarget(verb);
      if (!choice) return;                  // cancelled
      payload[verb.target.key] = choice.value;
    }
    if (verb.prompt) {
      const value = window.prompt(`${verb.label} — ${verb.prompt}:`);
      if (value == null || value === '') return;
      payload[verb.prompt] = value;
    }
    if (await this._postCommand(verb.cmd, payload, verb.ap, verb.fp, verb.lane)) {
      await this._refresh();
    }
  }

  // Entities the player is carrying (inventory, held, or worn).
  _carried(playerId) {
    const player = this.world?.entities[playerId];
    if (!player) return [];
    const out = [];
    for (const rtype of ['Contains', 'Holding', 'Wearing']) {
      for (const { target } of (player.relationships[rtype] || [])) {
        const entity = this.world.entities[target];
        if (entity) out.push(entity);
      }
    }
    return out;
  }

  // Candidate targets for a verb, drawn from what's reachable in the player's room.
  // The server still validates reachability/edibility/etc., so this can be permissive.
  _targetCandidates(kind) {
    const roomId = this._playerRoomId();
    const room = this.world?.entities[roomId];
    const asTarget = (e) => ({ value: e.id, label: entityName(e), icon: entityIcon(e) });
    const members = this._roomMembers(roomId)
      .filter(e => e.id !== this.playerId && !e.components.RoomComponent);
    const roomItems = members.filter(e => !e.components.CharacterComponent);
    const carried = this._carried(this.playerId);

    if (kind === 'exits') {
      return (room?.relationships.ExitTo || []).map(({ target, edge }) => {
        const dest = this.world.entities[target];
        const dir = edge?.direction || 'exit';
        return { value: target, label: `${dir} → ${dest ? entityName(dest) : target}`, icon: '🚪' };
      });
    }
    if (kind === 'roomItems') return roomItems.filter(e => e.components.PortableComponent).map(asTarget);
    if (kind === 'inventory') return carried.map(asTarget);
    if (kind === 'characters') return members.filter(e => e.components.CharacterComponent).map(asTarget);
    if (kind === 'reachableItems') return [...roomItems, ...carried].map(asTarget);
    return [];
  }

  // Show a modal list of candidate targets; resolves to a choice or null if cancelled.
  _pickTarget(verb) {
    return new Promise((resolve) => {
      const esc = BunnylandUI.escapeHtml;
      const candidates = this._targetCandidates(verb.target.kind);
      const overlay = document.createElement('div');
      overlay.id = 'target-overlay';
      const rows = candidates.length
        ? candidates.map((c, i) =>
            `<div class="target-item" data-i="${i}">` +
            `<span class="ti-icon">${esc(c.icon)}</span><span>${esc(c.label)}</span></div>`).join('')
        : '<div class="target-empty">No valid targets nearby.</div>';
      overlay.innerHTML =
        `<div class="target-card">` +
        `<div class="target-card-header">${esc(verb.label)} — choose a target</div>` +
        `<div class="target-list">${rows}</div>` +
        `<div class="target-card-footer"><button class="target-cancel">Cancel</button></div></div>`;

      const close = (value) => {
        document.removeEventListener('keydown', onKey);
        overlay.remove();
        resolve(value);
      };
      const onKey = (e) => { if (e.key === 'Escape') close(null); };
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(null); });
      overlay.querySelector('.target-cancel').addEventListener('click', () => close(null));
      for (const el of overlay.querySelectorAll('.target-item')) {
        el.addEventListener('click', () => close(candidates[+el.dataset.i]));
      }
      document.addEventListener('keydown', onKey);
      document.getElementById('stage-wrapper').appendChild(overlay);
    });
  }

  // The action menu: each verb shows its cost and is disabled when the player cannot
  // afford it (or when no player is selected). Verbs needing an entity target are shown
  // for reference but not yet submittable (no in-room target picker).
  _renderActions() {
    const body = document.getElementById('actions-body');
    const pts = this._playerPoints();
    const hasPlayer = !!this.playerId && pts.has;
    const esc = BunnylandUI.escapeHtml;

    const summary = hasPlayer
      ? `<span class="pt ap">⚡ ${fmtPoints(pts.ap)} / ${fmtPoints(pts.apMax)} AP</span>` +
        `<span class="pt fp">🔹 ${fmtPoints(pts.fp)} / ${fmtPoints(pts.fpMax)} FP</span>`
      : '<span class="pt-empty">Select a player to see their actions.</span>';

    let html = `<div id="pt-summary">${summary}</div>`;
    for (const [title, lane] of [['Room actions', 'world'], ['Focus actions', 'focus']]) {
      html += `<div class="action-section-title">${title}</div><div class="verb-list">`;
      html += ACTION_VERBS.filter(v => v.lane === lane)
        .map(v => this._verbRowHtml(v, pts, hasPlayer, esc)).join('');
      html += '</div>';
    }
    html += this._queuedActionsHtml(this._playerQueuedCommands(), esc);
    body.innerHTML = html;

    for (const el of body.querySelectorAll('.verb.ready[data-tool]')) {
      const verb = ACTION_VERBS.find(v => v.tool === el.dataset.tool);
      el.addEventListener('click', () => this._doVerb(verb));
    }
  }

  _queuedActionsHtml(commands, esc) {
    if (!commands.length) {
      return '<div class="action-section-title">Queued actions</div>' +
        '<div class="queued-empty">No queued actions.</div>';
    }
    const rows = commands.map(command => {
      const name = this._queuedCommandName(command);
      const cost = this._queuedCommandCost(command);
      const detail = this._queuedCommandDetail(command);
      return `<div class="queued-action">` +
        `<div class="queued-action-head">` +
        `<span class="queued-action-name">${esc(name)}</span>` +
        `<span class="queued-action-lane">${esc(command.lane || '')}</span>` +
        `</div>` +
        `<div class="queued-action-detail">${esc([cost, detail].filter(Boolean).join(' · '))}</div>` +
        `</div>`;
    }).join('');
    return `<div class="action-section-title">Queued actions</div><div class="queued-list">${rows}</div>`;
  }

  _queuedCommandName(command) {
    const verb = ACTION_VERBS.find(v => v.cmd === command.command_type);
    if (verb) return verb.label;
    return String(command.command_type || 'command').replaceAll('-', ' ');
  }

  _queuedCommandCost(command) {
    const cost = command.cost || {};
    const parts = [];
    if (cost.action) parts.push(`${cost.action} AP`);
    if (cost.focus) parts.push(`${cost.focus} FP`);
    return parts.length ? parts.join(' + ') : 'free';
  }

  _queuedCommandDetail(command) {
    const payload = command.payload || {};
    return Object.entries(payload)
      .filter(([, value]) => value !== '' && value != null)
      .map(([key, value]) => `${key}: ${String(value)}`)
      .join(', ');
  }

  _verbRowHtml(verb, pts, hasPlayer, esc) {
    const affordable = pts.ap >= verb.ap && pts.fp >= verb.fp;
    const ready = hasPlayer && affordable;
    const title = !hasPlayer ? 'Select a player'
      : !affordable ? 'Not enough points'
      : verb.target ? `${verb.label}: choose a target`
      : `Perform: ${verb.label}`;

    const cost = verb.ap || verb.fp
      ? (verb.ap ? `<span class="cost ap">${verb.ap} AP</span>` : '') +
        (verb.fp ? `<span class="cost fp">${verb.fp} FP</span>` : '')
      : '<span class="cost free">free</span>';
    const note = verb.target ? '<span class="verb-note">⌖ target</span>' : '';

    return `<div class="verb ${ready ? 'ready' : 'unafford'}"${ready ? ` data-tool="${verb.tool}"` : ''} title="${esc(title)}">` +
      `<span class="verb-name">${esc(verb.label)}</span>` +
      `<span class="verb-cost">${note}${cost}</span></div>`;
  }

  // ── Rendering ────────────────────────────────────────────────────────────────

  render() {
    this._renderActions();

    const stage = document.getElementById('stage');
    const empty = document.getElementById('stage-empty');
    const room = this.viewRoomId && this.world?.entities[this.viewRoomId];

    for (const el of stage.querySelectorAll('.sprite, .door')) el.remove();

    if (!room) {
      empty.classList.remove('hidden');
      document.getElementById('room-bg').style.backgroundImage = '';
      document.getElementById('room-bg').textContent = '';
      document.getElementById('room-title').textContent = this.ws ? 'No room' : 'Not connected';
      return;
    }
    empty.classList.add('hidden');

    const rect = stage.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;

    // Background = the room's own sprite (layer 0), or a labelled placeholder.
    const bg = document.getElementById('room-bg');
    const roomImg = room.components.SpriteImage?.url;
    bg.style.backgroundImage = roomImg ? `url("${roomImg}")` : '';
    bg.textContent = roomImg ? '' : `“${entityName(room)}”`;

    document.getElementById('room-title').textContent =
      `${entityName(room)}${this._playerInView() ? '' : '  ·  spectating'}`;
    stage.classList.toggle('spectating', !this._playerInView());

    // Sprites: every member, ordered by layer, placed by SpritePosition (player uses
    // its optimistic local position so movement feels instant).
    const members = this._roomMembers(this.viewRoomId)
      .filter(e => !e.components.DoorComponent)
      .sort((a, b) => this._spriteLayer(a) - this._spriteLayer(b));
    for (const member of members) {
      const isPlayer = member.id === this.playerId;
      const pos = (isPlayer && this.localPos) ? this.localPos : this._spritePos(member);
      stage.appendChild(this._spriteEl(member, cx + pos.x, cy + pos.y, isPlayer));
    }

    this._renderDoors(stage, room, rect);

    const hint = document.getElementById('stage-hint');
    hint.textContent = this._playerInView()
      ? 'Click or use arrow keys / WASD to move · doors lead to other rooms'
      : (this.playerId ? 'Spectating another room — “Follow player” to return' : 'Pick a player to move');
  }

  _spriteEl(entity, left, top, isPlayer) {
    const el = document.createElement('div');
    el.className = 'sprite' + (isPlayer ? ' player' : '');
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    el.style.zIndex = String(1000 + this._spriteLayer(entity));
    // Sprites arrive at different sizes, so normalize each by its SpriteScale before
    // compositing. Only the glyph scales; the name label stays legible.
    const scale = this._spriteScale(entity);
    const scaleStyle = scale !== 1 ? ` style="transform: scale(${scale})"` : '';
    const img = entity.components.SpriteImage?.url;
    const glyph = img
      ? `<img class="glyph" src="${img}" alt=""${scaleStyle}>`
      : `<div class="glyph"${scaleStyle}>${entityIcon(entity)}</div>`;
    el.innerHTML = `${glyph}<div class="label">${BunnylandUI.escapeHtml(entityName(entity))}</div>`;
    return el;
  }

  _renderDoors(stage, room, rect) {
    const margin = 14;
    for (const { target, edge } of (room.relationships.ExitTo || [])) {
      const dest = this.world.entities[target];
      if (!dest) continue;
      const dir = (edge?.direction || '').toLowerCase();
      const [ox, oy] = DIR_EDGE[dir] || [1, 0];
      const door = document.createElement('div');
      door.className = 'door';
      door.innerHTML =
        `🚪 ${BunnylandUI.escapeHtml(entityName(dest))}` +
        (dir ? `<span class="door-dir">${BunnylandUI.escapeHtml(dir)}</span>` : '');
      // Pin to the edge the exit points toward.
      door.style.left = ox === 0 ? '50%' : (ox < 0 ? `${margin}px` : 'auto');
      door.style.right = ox > 0 ? `${margin}px` : 'auto';
      door.style.top = oy === 0 ? '50%' : (oy < 0 ? `${margin}px` : 'auto');
      door.style.bottom = oy > 0 ? `${margin}px` : 'auto';
      if (ox === 0) door.style.transform = 'translateX(-50%)';
      if (oy === 0) door.style.transform = 'translateY(-50%)';
      door.title = `Go to ${entityName(dest)}`;
      door.addEventListener('click', () => {
        this.viewRoomId = target;
        this.followPlayer = false;
        this.render();
      });
      stage.appendChild(door);
    }
  }
}

window.addEventListener('resize', () => window.app?.render());
window.app = new RoomClient();
</script>
</body>
</html>
