<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Toon</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #api-url { width: 190px; }
    #player-select, #claim-fallback, #claim-timeout, #room-title, #btn-release-character { font-size: var(--bl-text-sm); }
    #claim-timeout { width: 56px; }
    #room-title { color: var(--bl-text-soft); }

    /* ── Split layout: visual world on the left, actions on the right ── */
    #stage-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bl-bg-deep);
    }

    /* The room view: a fixed coordinate plane whose origin (0,0) is its centre. */
    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: crosshair;
      outline: none;
    }
    #stage.spectating { cursor: default; }

    #room-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-md);
      z-index: 0;
    }

    .sprite {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      user-select: none;
      pointer-events: none;
      text-align: center;
    }
    .sprite .glyph {
      font-size: 30px;
      line-height: 1;
      filter: drop-shadow(var(--bl-shadow-text));
    }
    .sprite img.glyph {
      width: 48px;
      height: 48px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .sprite .label {
      font-size: var(--bl-text-xs);
      color: var(--bl-text-soft);
      background: var(--bl-overlay);
      border-radius: var(--bl-radius-sm);
      padding: 0 3px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sprite.player .glyph { filter: drop-shadow(0 0 6px var(--bl-accent)); }
    .sprite.player .label { color: var(--bl-accent); }
    .sprite.selected .glyph { outline: 2px solid var(--bl-accent); outline-offset: 3px; }

    .debug-box {
      position: absolute;
      z-index: 4500;
      pointer-events: none;
      box-sizing: border-box;
      border: 1px solid;
      background: transparent;
    }
    .debug-box.room {
      border-color: rgba(137, 180, 250, 0.95);
      background: rgba(137, 180, 250, 0.04);
    }
    .debug-box.collision {
      border-color: rgba(249, 226, 175, 0.95);
      background: rgba(249, 226, 175, 0.08);
    }
    .debug-box.nocollision {
      border-color: rgba(166, 227, 161, 0.95);
      background: rgba(166, 227, 161, 0.08);
    }

    /* Doors are pinned to the edge matching their compass direction. */
    .door {
      position: absolute;
      z-index: 5000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 3px 7px;
      background: var(--bl-surface);
      border: 1px solid var(--bl-border-strong);
      border-radius: var(--bl-radius-md);
      color: var(--bl-text);
      font-size: var(--bl-text-xs);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--bl-shadow-popover);
    }
    .door:hover { background: var(--bl-surface-hover); border-color: var(--bl-accent); }
    .door .door-dir { color: var(--bl-text-dim); }

    #stage-hint {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 6000;
      font-size: var(--bl-text-xs);
      color: var(--bl-text-muted);
      background: var(--bl-overlay-strong);
      padding: 3px 8px;
      border-radius: var(--bl-radius-sm);
      pointer-events: none;
    }

    #stage-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--bl-text-muted);
      z-index: 7000;
    }
    #stage-empty .title { font-size: 18px; color: var(--bl-text); }
    #stage-empty.hidden { display: none; }

    /* ── Right sidebar: room action verbs (reserved, mostly empty for now) ── */
    #actions {
      width: 300px;
      min-width: 220px;
      border-left: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #actions-header {
      padding: 7px 12px;
      border-bottom: 1px solid var(--bl-border);
      font-size: var(--bl-text-md);
      color: var(--bl-text);
    }
    #actions-body { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .action-section-title {
      font-size: var(--bl-text-xs);
      color: var(--bl-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 12px 0 6px;
    }
    .action-section-title:first-child { margin-top: 0; }

    #pt-summary {
      display: flex;
      gap: 12px;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: var(--bl-bg-subtle);
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-md);
      font-size: var(--bl-text-sm);
    }
    #pt-summary .pt.ap { color: var(--bl-warn); }
    #pt-summary .pt.fp { color: var(--bl-info); }
    #pt-summary .pt-empty { color: var(--bl-text-muted); }

    #action-filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-bottom: 4px;
    }
    #action-filter {
      width: 100%;
      min-width: 0;
    }
    #action-filter-clear {
      padding-left: 8px;
      padding-right: 8px;
    }

    .verb-list { display: flex; flex-direction: column; gap: 4px; }
    .verb {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 9px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-surface);
      font-size: var(--bl-text-sm);
      color: var(--bl-text);
    }
    .verb.ready { cursor: pointer; }
    .verb.ready:hover { background: var(--bl-surface-hover); border-color: var(--bl-accent); }
    .verb.unavailable {
      opacity: 0.58;
      background: var(--bl-bg-subtle);
      border-color: var(--bl-border-muted);
    }
    .verb.unavailable .verb-name { color: var(--bl-text-muted); }
    .verb-name { white-space: nowrap; }
    .verb-cost { display: flex; align-items: center; gap: 4px; }
    .verb-cost .cost {
      font-size: var(--bl-text-xs);
      padding: 0 4px;
      border-radius: var(--bl-radius-sm);
      border: 1px solid var(--bl-border-control);
    }
    .verb-cost .cost.ap { color: var(--bl-warn); }
    .verb-cost .cost.fp { color: var(--bl-info); }
    .verb-cost .cost.free { color: var(--bl-text-dim); }
    .verb-cost .verb-note { font-size: var(--bl-text-xs); color: var(--bl-text-dim); }
    .verb-cost .verb-reason {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--bl-text-xs);
      color: var(--bl-warn);
    }

    .queued-list { display: flex; flex-direction: column; gap: 6px; }
    .queued-action {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 6px 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      font-size: var(--bl-text-sm);
      color: var(--bl-text);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .queued-action:hover { border-color: var(--bl-accent); background: var(--bl-surface-hover); }
    .queued-action-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--bl-text);
    }
    .queued-action-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queued-action-lane {
      flex: 0 0 auto;
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
    }
    .queued-action-detail {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .queued-empty {
      padding: 6px 8px;
      border: 1px dashed var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }
    .activity-list { display: flex; flex-direction: column; gap: 6px; }
    .activity-row {
      padding: 6px 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text-dim);
      font-size: var(--bl-text-sm);
      line-height: 1.3;
    }
    .activity-row.kind-rejection { color: var(--bl-warn); }
    .activity-empty {
      padding: 6px 8px;
      border: 1px dashed var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    /* ── Target picker (overlays the visual world) ── */
    .target-card {
      width: 300px;
      max-height: 75%;
      display: flex;
      flex-direction: column;
      background: var(--bl-bg);
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      box-shadow: var(--bl-shadow-popover);
      overflow: hidden;
    }
    .target-card-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--bl-border);
      font-size: var(--bl-text-md);
      color: var(--bl-text);
    }
    .target-card-footer { padding: 8px 12px; border-top: 1px solid var(--bl-border); display: flex; justify-content: flex-end; gap: 8px; }

    /* ── Action form overlay (one modal collecting an action's fields) ── */
    #action-form-overlay {
      position: absolute;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bl-overlay);
    }
    .af-body { overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
    .af-field { display: flex; flex-direction: column; gap: 4px; }
    .af-label { font-size: var(--bl-text-sm); color: var(--bl-text-muted); }
    .af-input {
      padding: 6px 9px;
      border-radius: var(--bl-radius-sm);
      border: 1px solid var(--bl-border-control);
      background: var(--bl-surface);
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
    }
    .af-error { color: var(--bl-error); font-size: var(--bl-text-sm); min-height: 1em; }

    /* ── Loading splash overlay (brief title + bunny) ── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bl-overlay-strong);
      opacity: 1;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
    }
    #loading-overlay.hidden {
      display: none;
    }
    #loading-overlay.fading {
      opacity: 0;
    }
    .loading-card {
      width: 280px;
      padding: 14px 16px 16px;
      background: var(--bl-bg);
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-lg);
      color: var(--bl-text);
      box-shadow: var(--bl-shadow-popover);
      text-align: center;
    }
    .loading-title {
      font-size: 22px;
      margin-bottom: 10px;
    }
    .loading-bunny {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 18px;
      line-height: 1.05;
      color: var(--bl-text-soft);
      white-space: pre;
    }
  </style>
</head>

<script>
'use strict';

BunnylandUI.initClientMenu();

const {
  actionArguments,
  actionAvailable,
  actionCost,
  actionFields,
  actionLane,
  actionTitle,
  actionTool,
  actionUnavailableReason,
  cancelQueuedCommand,
  claimSettings,
  claimWebController,
  controlFromResponse,
  drainNarratedEvents,
  entityIcon,
  entityName,
  fetchCharacterList,
  fetchCharacterProjection,
  fetchQueuedCommands,
  fetchRecentEvents,
  fetchRoomProjection,
  filterActions,
  playerControl,
  queuedCommandCost,
  queuedCommandDetail,
  queuedCommandName,
  queuedCountdownSeconds,
  randomClientId,
  submitCommand,
  updateWebControllerFallback,
} = BunnylandPlay;

// Compass direction → unit edge offset, mirroring the Inspector's room layout.
const DIR_EDGE = {
  north: [0, -1], south: [0, 1], east: [1, 0], west: [-1, 0],
  northeast: [1, -1], northwest: [-1, -1], southeast: [1, 1], southwest: [-1, 1],
  up: [0, -1], down: [0, 1], fore: [0, -1], aft: [0, 1], port: [-1, 0], starboard: [1, 0],
};

const SYNC_INTERVAL_MS = 500;   // how often optimistic moves are pushed to the server
const POLL_INTERVAL_MS = 2000;  // how often the live view re-polls the player-facing projections
const ROOM_WIDTH = 100;
const ROOM_HEIGHT = 100;
const MOVE_STEP = 4;            // normalized room units per arrow/WASD keypress
const CLIENT_DB_NAME = 'bunnyland-toon';
const CLIENT_DB_STORE = 'settings';
const CLIENT_ID_KEY = 'client-id';
const FURNITURE_KINDS = new Set([
  'chair', 'table', 'bed', 'art', 'window', 'workstation', 'sofa', 'couch',
  'shelf', 'desk', 'lamp', 'rug', 'cabinet', 'dresser', 'stool', 'bench',
]);
const SURFACE_KINDS = new Set(['table', 'desk', 'shelf', 'counter', 'workbench', 'workstation']);

// The common room/focus verbs a player can attempt, mirroring the canonical costs in
// the server's llm_agents/tools.py. `ap`/`fp` are the action/focus cost; `target` names
// the payload key plus which nearby entities are candidates (resolved by the picker);
// `prompt` names a free-text arg to collect. Domain/situational verbs (farming, ships,
// economy, ...) are intentionally omitted for now.
const ACTION_VERBS = [
  { tool: 'move',      label: 'Move',      cmd: 'move',  ap: 1, fp: 0, lane: 'world', target: { key: 'exit_id', kind: 'exits' } },
  { tool: 'take',      label: 'Take',      cmd: 'take',  ap: 1, fp: 0, lane: 'world', target: { key: 'item_id', kind: 'roomItems' } },
  { tool: 'drop',      label: 'Drop',      cmd: 'put',   ap: 1, fp: 0, lane: 'world', target: { key: 'item_id', kind: 'inventory' } },
  { tool: 'use',       label: 'Use',       cmd: 'use',   ap: 1, fp: 0, lane: 'world', target: { key: 'target_id', kind: 'reachableItems' } },
  { tool: 'eat',       label: 'Eat',       cmd: 'eat',   ap: 1, fp: 0, lane: 'world', target: { key: 'item_id', kind: 'reachableItems' } },
  { tool: 'drink',     label: 'Drink',     cmd: 'drink', ap: 1, fp: 0, lane: 'world', target: { key: 'source_id', kind: 'reachableItems' } },
  { tool: 'tell',      label: 'Tell',      cmd: 'tell',  ap: 1, fp: 1, lane: 'world', target: { key: 'target_id', kind: 'characters' }, prompt: 'text' },
  { tool: 'say',       label: 'Say',       cmd: 'say',   ap: 1, fp: 1, lane: 'world', prompt: 'text' },
  { tool: 'wait',      label: 'Wait',      cmd: 'wait',  ap: 0, fp: 0, lane: 'world' },
  { tool: 'take_note', label: 'Take note', cmd: 'take-note', ap: 0, fp: 1, lane: 'focus', prompt: 'text' },
  { tool: 'remember',  label: 'Remember',  cmd: 'remember',  ap: 0, fp: 1, lane: 'focus', prompt: 'query' },
  { tool: 'reflect',   label: 'Reflect',   cmd: 'reflect',   ap: 0, fp: 1, lane: 'focus', prompt: 'text' },
];

const ACTIVITY_LIMIT = 8;
const fmtPoints = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));

function legacyActionView(verb) {
  const args = [];
  if (verb.target) {
    args.push({
      key: verb.target.key,
      title: verb.target.key.replace(/_id$/, '').replaceAll('_', ' '),
      kind: 'entity',
      required: true,
      target_group: verb.target.kind,
    });
  }
  if (verb.prompt) {
    args.push({
      key: verb.prompt,
      title: verb.prompt.replaceAll('_', ' '),
      kind: 'string',
      required: true,
      target_group: null,
    });
  }
  return {
    command_type: verb.cmd,
    tool_name: verb.tool,
    title: verb.label,
    lane: verb.lane,
    cost: { action: verb.ap, focus: verb.fp },
    arguments: args,
  };
}

async function persistentClientId() {
  if (!window.indexedDB) return persistentClientIdFallback();

  return new Promise((resolve) => {
    const open = indexedDB.open(CLIENT_DB_NAME, 1);
    open.onupgradeneeded = () => {
      open.result.createObjectStore(CLIENT_DB_STORE);
    };
    open.onerror = () => {
      console.warn('Could not open IndexedDB for Bunnyland client id', open.error);
      resolve(persistentClientIdFallback());
    };
    open.onsuccess = () => {
      const db = open.result;
      const tx = db.transaction(CLIENT_DB_STORE, 'readwrite');
      const store = tx.objectStore(CLIENT_DB_STORE);
      const get = store.get(CLIENT_ID_KEY);
      get.onerror = () => {
        console.warn('Could not read Bunnyland client id from IndexedDB', get.error);
        resolve(persistentClientIdFallback());
      };
      get.onsuccess = () => {
        const existing = typeof get.result === 'string' ? get.result : '';
        const clientId = existing || randomClientId();
        if (!existing) store.put(clientId, CLIENT_ID_KEY);
        resolve(clientId);
      };
    };
  });
}

function persistentClientIdFallback() {
  const key = 'bunnyland.toon.clientId';
  try {
    let clientId = localStorage.getItem(key);
    if (!clientId) {
      clientId = randomClientId();
      localStorage.setItem(key, clientId);
    }
    return clientId;
  } catch (err) {
    console.warn('Could not persist Bunnyland client id in localStorage', err);
    return randomClientId();
  }
}

// ── The room client ────────────────────────────────────────────────────────────

class RoomClient {
  constructor() {
    this.apiBase = null;
    this.connected = false;
    this.characterList = [];
    this.epoch = 0;
    this.playerId = '';
    this.characterProjection = null;
    this.roomProjection = null;
    this.queuedCommands = null;
    this.queueProjection = null;
    this.selectedId = '';
    this.activityLines = [];
    this.seenEventIds = new Set();
    this.eventsPrimed = false;
    this.control = null;
    this.viewRoomId = null;
    this.followPlayer = true;
    this.debugBounds = false;
    this.actionFilter = '';
    this.localPos = null;        // optimistic {x, y} for the player, normalized room units
    this.localDirty = false;
    this._refreshTimer = null;
    this._pollTimer = null;
    this._clientId = null;
    this._clientIdPromise = persistentClientId();
    this._loadingOverlay = null;
    this._loadingTimers = [];

    this._bindUi();
    this.render();                 // show the initial (disconnected) action panel
    this._restoreServerParam();
    this._loadConfig();
    this._showLoadingOverlay();
    setInterval(() => this._syncTick(), SYNC_INTERVAL_MS);
  }

  _bindUi() {
    document.getElementById('btn-connect').addEventListener('click', () => {
      if (this.connected) this.disconnect();
      else this.connect(document.getElementById('api-url').value.trim());
    });
    document.getElementById('player-select').addEventListener('change', (e) => {
      this._selectPlayer(e.target.value);
    });
    document.getElementById('btn-release-character').addEventListener('click', () => {
      this._selectPlayer('');
    });
    document.getElementById('claim-fallback').addEventListener('change', () => {
      this._updateClaimFallback();
    });
    document.getElementById('claim-timeout').addEventListener('change', () => {
      this._updateClaimFallback();
    });
    document.getElementById('btn-follow').addEventListener('click', () => {
      this.followPlayer = true;
      this._recenterOnPlayer();
      this.render();
    });
    document.getElementById('debug-bounds').addEventListener('change', (e) => {
      this.debugBounds = e.target.checked;
      this.render();
    });
    document.getElementById('actions-body').addEventListener('input', (e) => {
      if (e.target.id !== 'action-filter') return;
      this.actionFilter = e.target.value.trim();
      this._renderActions();
    });
    document.getElementById('actions-body').addEventListener('click', (e) => {
      if (e.target.id !== 'action-filter-clear') return;
      this.actionFilter = '';
      this._renderActions();
    });

    const stage = document.getElementById('stage');
    stage.addEventListener('click', (e) => this._onStageClick(e));
    stage.addEventListener('keydown', (e) => this._onKey(e));
  }

  _restoreServerParam() {
    BunnylandApi.applyServerParam({ connect: (server) => this.connect(server) });
  }

  async _loadConfig() {
    // Match the other web clients: pick up the deploy-specific server URL and auto-connect
    // from config.json. A ?server= param (handled by _restoreServerParam) still wins.
    await BunnylandApi.applyConfigToInput({
      isConnected: () => this.connected,
      connect: (server) => this.connect(server),
    });
  }

  // ── Connection ───────────────────────────────────────────────────────────────

  _showLoadingOverlay() {
    if (this._loadingOverlay && this._loadingOverlay.classList.contains('hidden')) return;
    const overlay = document.getElementById('loading-overlay');
    if (!overlay) return;
    this._loadingOverlay = overlay;
    this._loadingTimers.forEach(clearTimeout);
    this._loadingTimers = [];
    this._loadingTimers.push(
      window.setTimeout(() => overlay.classList.add('fading'), 1000),
      window.setTimeout(() => overlay.classList.add('hidden'), 1850),
    );
  }

  _hideLoadingOverlayImmediately() {
    if (!this._loadingOverlay) return;
    this._loadingTimers.forEach(clearTimeout);
    this._loadingTimers = [];
    this._loadingOverlay.classList.add('fading');
    this._loadingOverlay.classList.add('hidden');
  }

  connect(url) {
    if (!url) return;
    this._hideLoadingOverlayImmediately();
    this.disconnect();
    this.apiBase = BunnylandApi.normalizeBase(url);
    this.connected = true;
    // The player surface polls the ungated per-room projections; it never opens the
    // admin-only /world/updates stream or reads the full snapshot.
    this._setStatus('live', '● Connected');
    document.getElementById('btn-connect').textContent = 'Disconnect';
    this._syncUrl();
    this._refresh();
    this._pollTimer = setInterval(() => this._refresh(), POLL_INTERVAL_MS);
  }

  disconnect() {
    clearInterval(this._pollTimer);
    this._pollTimer = null;
    clearTimeout(this._refreshTimer);
    this.connected = false;
    this._setStatus('', '○ Offline');
    document.getElementById('btn-connect').textContent = 'Connect Live';
    this.characterProjection = null;
    this.roomProjection = null;
    this.queuedCommands = null;
    this.activityLines = [];
    this.seenEventIds = new Set();
    this.eventsPrimed = false;
    this._syncUrl();
  }

  async _refresh() {
    try {
      await this._refreshCharacterList();
      if (this.playerId) {
        await this._refreshCharacterProjection();
        await this._refreshQueuedCommands();
      }
      if (this.followPlayer) this._recenterOnPlayer();
      if (this.viewRoomId) await this._refreshRoomProjection(this.viewRoomId);
      await this._refreshRecentEvents();
      this.render();
      this._setStatus('live', `● Live · epoch ${this.epoch}s`);
    } catch (err) {
      this._setStatus('error', `⚠ ${err.message}`);
    }
  }

  async _refreshCharacterList() {
    // The claim lobby: ids and names of every character, with no per-character state. This
    // is the player-facing replacement for the admin-gated snapshot's character roster.
    const parsed = await fetchCharacterList(this.apiBase);
    this.characterList = parsed.characters;
    this.epoch = parsed.epoch;
    this._refreshPlayerOptions();
  }

  async _refreshCharacterProjection({ render = false } = {}) {
    if (!this.apiBase || !this.playerId) {
      this.characterProjection = null;
      if (render) this.render();
      return null;
    }
    try {
      const projection = await fetchCharacterProjection(this.apiBase, this.playerId);
      this.characterProjection = projection?.characterId === this.playerId ? projection : null;
      if (this.followPlayer && this.characterProjection?.room?.id) {
        this.viewRoomId = this.characterProjection.room.id;
      }
      if (render) this.render();
      return this.characterProjection;
    } catch (err) {
      console.warn('Could not refresh Bunnyland character projection', err);
      this.characterProjection = null;
      if (render) this.render();
      return null;
    }
  }

  async _refreshRoomProjection(roomId = this.viewRoomId, { render = false } = {}) {
    if (!this.apiBase || !roomId) {
      this.roomProjection = null;
      if (render) this.render();
      return null;
    }
    try {
      const projection = await fetchRoomProjection(this.apiBase, roomId);
      this.roomProjection = projection?.room?.id === roomId ? projection : null;
      if (render) this.render();
      return this.roomProjection;
    } catch (err) {
      console.warn('Could not refresh Bunnyland room projection', err);
      this.roomProjection = null;
      if (render) this.render();
      return null;
    }
  }

  async _refreshQueuedCommands({ render = false } = {}) {
    if (!this.apiBase || !this.playerId) {
      this.queuedCommands = null;
      this.queueProjection = null;
      if (render) this.render();
      return null;
    }
    try {
      const projection = await fetchQueuedCommands(this.apiBase, this.playerId);
      this.queuedCommands = projection?.characterId === this.playerId ? projection.commands : null;
      this.queueProjection = projection?.characterId === this.playerId ? projection : null;
      if (render) this.render();
      return this.queuedCommands;
    } catch (err) {
      console.warn('Could not refresh Bunnyland queued commands', err);
      this.queuedCommands = null;
      this.queueProjection = null;
      if (render) this.render();
      return null;
    }
  }

  async _refreshRecentEvents() {
    if (!this.apiBase) return;
    try {
      const data = await fetchRecentEvents(this.apiBase);
      this._drainEvents(data.events || [], { prime: !this.eventsPrimed });
      this.eventsPrimed = true;
    } catch (err) {
      console.warn('Could not refresh Bunnyland recent events', err);
    }
  }

  _setStatus(cls, text) {
    const el = document.getElementById('api-status');
    el.className = cls;
    el.textContent = text;
  }

  _syncUrl() {
    BunnylandApi.setServerInUrl(this.apiBase);
  }

  // ── World queries (player-facing projections only) ──────────────────────────

  _playerRoomId() {
    if (this.characterProjection?.characterId === this.playerId && this.characterProjection.room?.id) {
      return this.characterProjection.room.id;
    }
    return null;
  }

  _currentRoom() {
    if (this.roomProjection?.room?.id === this.viewRoomId) return this.roomProjection.room;
    return null;
  }

  _entityById(id) {
    if (this.roomProjection?.room?.id === this.viewRoomId) {
      const projected = this.roomProjection.entities.find(entity => entity.id === id);
      if (projected) return projected;
    }
    return null;
  }

  // Members (characters + objects) sitting directly in a room, from the room projection.
  _roomMembers(roomId) {
    if (this.roomProjection?.room?.id === roomId) return this.roomProjection.entities;
    return [];
  }

  _spritePos(entity) {
    const p = entity?.sprite?.position || entity?.components?.SpritePosition;
    return p
      ? {
          x: Number.isFinite(Number(p.x)) ? Number(p.x) : ROOM_WIDTH / 2,
          y: Number.isFinite(Number(p.y)) ? Number(p.y) : ROOM_HEIGHT / 2,
        }
      : { x: ROOM_WIDTH / 2, y: ROOM_HEIGHT / 2 };
  }

  _spriteLayer(entity) {
    return entity?.sprite?.layer ?? entity?.components?.SpriteLayer?.layer ?? 20;
  }

  _spriteScale(entity) {
    return entity?.sprite?.scale ?? entity?.components?.SpriteScale?.scale ?? 1;
  }

  _spriteBounds(entity) {
    const b = entity?.sprite?.bounds || entity?.components?.SpriteBounds;
    if (b) {
      return {
        width: Number.isFinite(Number(b.width)) ? Number(b.width) : 4,
        height: Number.isFinite(Number(b.height)) ? Number(b.height) : 4,
        solid: Boolean(b.solid),
      };
    }
    if (entity?.kind === 'room' || entity?.components?.RoomComponent) {
      return { width: ROOM_WIDTH, height: ROOM_HEIGHT, solid: false };
    }
    if (entity?.isCharacter || entity?.components?.CharacterComponent) {
      return { width: 5, height: 8, solid: true };
    }
    const kind = entity?.kind || entity?.components?.IdentityComponent?.kind || '';
    if (SURFACE_KINDS.has(kind)) return { width: 22, height: 12, solid: true };
    if (FURNITURE_KINDS.has(kind) || entity?.components?.ContainerComponent) {
      return { width: 14, height: 10, solid: true };
    }
    if (entity?.components?.DoorComponent) return { width: 10, height: 8, solid: false };
    if (entity?.components?.PortableComponent || entity?.kind === 'item') {
      return { width: 4, height: 4, solid: false };
    }
    return { width: 4, height: 4, solid: false };
  }

  _roomBounds(room) {
    const b = room?.sprite?.bounds || room?.components?.SpriteBounds;
    return {
      width: Number.isFinite(Number(b?.width)) ? Number(b.width) : ROOM_WIDTH,
      height: Number.isFinite(Number(b?.height)) ? Number(b.height) : ROOM_HEIGHT,
      solid: false,
    };
  }

  _roomToStagePoint(pos, rect, room) {
    const bounds = this._roomBounds(room);
    return {
      x: (pos.x / bounds.width) * rect.width,
      y: (pos.y / bounds.height) * rect.height,
    };
  }

  _stageToRoomPoint(clientX, clientY, rect, room) {
    const bounds = this._roomBounds(room);
    return {
      x: ((clientX - rect.left) / rect.width) * bounds.width,
      y: ((clientY - rect.top) / rect.height) * bounds.height,
    };
  }

  _aabb(pos, bounds) {
    const halfW = bounds.width / 2;
    const halfH = bounds.height / 2;
    return {
      left: pos.x - halfW,
      top: pos.y - halfH,
      right: pos.x + halfW,
      bottom: pos.y + halfH,
    };
  }

  _aabbOverlaps(a, b) {
    return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  }

  _aabbInsideRoom(aabb, roomBounds) {
    return (
      aabb.left >= 0 &&
      aabb.top >= 0 &&
      aabb.right <= roomBounds.width &&
      aabb.bottom <= roomBounds.height
    );
  }

  _roomAabbToStageRect(aabb, rect, room) {
    const bounds = this._roomBounds(room);
    return {
      left: (aabb.left / bounds.width) * rect.width,
      top: (aabb.top / bounds.height) * rect.height,
      width: ((aabb.right - aabb.left) / bounds.width) * rect.width,
      height: ((aabb.bottom - aabb.top) / bounds.height) * rect.height,
    };
  }

  _moveBlocked(pos) {
    if (!this._playerInView()) return true;
    const player = this._entityById(this.playerId);
    const room = this._currentRoom();
    if (!player || !room) return true;
    const playerAabb = this._aabb(pos, this._spriteBounds(player));
    if (!this._aabbInsideRoom(playerAabb, this._roomBounds(room))) return true;
    for (const member of this._roomMembers(this.viewRoomId)) {
      if (member.id === this.playerId || member.components?.DoorComponent) continue;
      const bounds = this._spriteBounds(member);
      if (!bounds.solid) continue;
      if (this._aabbOverlaps(playerAabb, this._aabb(this._spritePos(member), bounds))) {
        return true;
      }
    }
    return false;
  }

  // ── Player control ───────────────────────────────────────────────────────────

  _refreshPlayerOptions() {
    const select = document.getElementById('player-select');
    const chars = this.characterList.slice()
      .sort((a, b) => a.name.localeCompare(b.name));
    const current = this.playerId;
    select.innerHTML = '<option value="">— select to play —</option>' +
      chars.map(c => `<option value="${c.id}">${BunnylandUI.escapeHtml(c.name)}</option>`).join('');
    if (current && chars.some(c => c.id === current)) select.value = current;
    else if (current) {
      this.playerId = '';
      this.control = null;
      this.characterProjection = null;
      this.queuedCommands = null;
      this.queueProjection = null;
      this.selectedId = '';
    }
    document.getElementById('btn-release-character').disabled = !this.playerId;
  }

  _selectPlayer(id) {
    this.playerId = id;
    this.control = null;
    this.characterProjection = null;
    this.queuedCommands = null;
    this.queueProjection = null;
    this.selectedId = '';
    this.roomProjection = null;
    this.activityLines = [];
    this.seenEventIds = new Set();
    this.eventsPrimed = false;
    document.getElementById('player-select').value = id;
    this.followPlayer = true;
    this.localPos = null;          // adopt the server position for the new player
    this._recenterOnPlayer();
    document.getElementById('btn-release-character').disabled = !id;
    this.render();
    if (id) this._claimPlayer(id);
    if (id) {
      this._refreshCharacterProjection().then(() => {
        const roomId = this._playerRoomId();
        return Promise.all([
          this._refreshQueuedCommands(),
          roomId ? this._refreshRoomProjection(roomId) : null,
          this._refreshRecentEvents(),
        ]);
      }).finally(() => this.render());
    }
  }

  _recenterOnPlayer() {
    const roomId = this._playerRoomId();
    if (roomId) {
      this.viewRoomId = roomId;
      if (this.roomProjection?.room?.id !== roomId) this._refreshRoomProjection(roomId, { render: true });
    }
  }

  // Controller (id + generation) claimed by this browser client.
  _playerControl() {
    return playerControl(this.control, this.characterProjection, this.playerId);
  }

  async _clientIdValue() {
    if (!this._clientId) this._clientId = await this._clientIdPromise;
    return this._clientId;
  }

  async _claimPlayer(playerId = this.playerId) {
    if (!this.apiBase || !playerId) return null;
    try {
      const clientId = await this._clientIdValue();
      const data = await claimWebController(this.apiBase, {
        ...this._claimSettings(),
        character_id: playerId,
        client_id: clientId,
        label: 'toon',
      });
      const control = controlFromResponse(data, playerId);
      if (this.playerId === playerId) this.control = control;
      return control;
    } catch (err) {
      console.warn('Could not claim Bunnyland web controller', err);
      return null;
    }
  }

  _claimSettings() {
    return claimSettings();
  }

  async _updateClaimFallback() {
    if (!this.apiBase || !this.playerId || !this.control) return;
    try {
      const clientId = await this._clientIdValue();
      const data = await updateWebControllerFallback(this.apiBase, {
        ...this._claimSettings(),
        character_id: this.playerId,
        client_id: clientId,
      });
      this.control = controlFromResponse(data, this.playerId);
    } catch (err) {
      console.warn('Could not update Bunnyland claim fallback', err);
    }
  }

  _playerInView() {
    return this.playerId && this.viewRoomId && this._playerRoomId() === this.viewRoomId;
  }

  // The player's live action/focus points, read from the character projection when available.
  _playerPoints() {
    if (this.characterProjection?.characterId === this.playerId) {
      const points = this.characterProjection.points || {};
      return {
        has: true,
        ap: points.action ?? 0,
        apMax: points.action_max ?? 0,
        fp: points.focus ?? 0,
        fpMax: points.focus_max ?? 0,
      };
    }
    return { has: false, ap: 0, apMax: 0, fp: 0, fpMax: 0 };
  }

  _playerQueuedCommands() {
    return this.queuedCommands || [];
  }

  _nameFor(entityId) {
    const entity = this._entityById(entityId);
    return entity ? entityName(entity) : null;
  }

  _drainEvents(messages, { prime = false } = {}) {
    const drained = drainNarratedEvents(messages, {
      seenIds: this.seenEventIds,
      playerId: this.playerId,
      roomOf: (id) => (id === this.playerId ? this._playerRoomId() : null),
      nameFor: (id) => this._nameFor(id),
    });
    this.seenEventIds = drained.seenIds;
    if (prime) return;
    for (const line of drained.lines) this._appendActivity(line);
  }

  _appendActivity(line) {
    this.activityLines.push(line);
    this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
    this.render();
  }

  // Submit a command as this browser client's claimed controller.
  // Returns true on a 2xx response.
  async _postCommand(commandType, payload, ap, fp, lane = 'world') {
    const control = this._playerControl() || await this._claimPlayer();
    if (!this.apiBase || !control) return false;
    try {
      const result = await submitCommand(this.apiBase, {
        character_id: this.playerId,
        controller_id: control.controllerId,
        controller_generation: control.generation,
        command_type: commandType,
        payload,
        cost: { action: ap, focus: fp },
        lane,
        on_insufficient_points: 'queue',
      });
      if (result?.queued === false) {
        this._appendActivity({ text: result.reason || 'Command rejected.', kind: 'rejection' });
        return false;
      }
      return true;
    } catch (err) {
      console.warn('Could not submit Bunnyland command', err);
      return false;
    }
  }

  async _cancelQueuedCommand(commandId) {
    const control = this._playerControl() || await this._claimPlayer();
    if (!this.apiBase || !this.playerId || !control || !commandId) return;
    try {
      const result = await cancelQueuedCommand(this.apiBase, this.playerId, commandId, control);
      if (!result?.cancelled) {
        this._appendActivity({ text: result?.reason || 'Could not cancel queued command.', kind: 'rejection' });
      }
      await this._refresh();
    } catch (err) {
      console.warn('Could not cancel Bunnyland queued command', err);
    }
  }

  // ── Optimistic movement + periodic sync ──────────────────────────────────────

  _moveTo(x, y) {
    if (!this._playerInView()) return;
    const pos = { x, y };
    if (this._moveBlocked(pos)) return;
    this.localPos = pos;
    this.localDirty = true;
    this.render();
  }

  _onStageClick(e) {
    if (e.target.closest('.door')) return;       // door clicks navigate, not move
    if (e.target.closest('.sprite')) return;     // sprite clicks select targets
    if (!this._playerInView()) return;
    const stage = document.getElementById('stage');
    const rect = stage.getBoundingClientRect();
    const room = this._currentRoom();
    if (!room) return;
    const pos = this._stageToRoomPoint(e.clientX, e.clientY, rect, room);
    this._moveTo(pos.x, pos.y);
  }

  _onKey(e) {
    if (!this._playerInView()) return;
    const deltas = {
      ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0],
    };
    const delta = deltas[e.key];
    if (!delta) return;
    e.preventDefault();
    const player = this._entityById(this.playerId);
    if (!player) return;
    const base = this.localPos || this._spritePos(player);
    this._moveTo(base.x + delta[0] * MOVE_STEP, base.y + delta[1] * MOVE_STEP);
  }

  async _syncTick() {
    if (!this.localDirty || !this.connected || !this.localPos) return;
    const pos = this.localPos;
    this.localDirty = false;
    // move-sprite is free (0 AP / 0 FP); retry on the next tick if it fails.
    const ok = await this._postCommand('move-sprite', { x: pos.x, y: pos.y }, 0, 0);
    if (!ok) this.localDirty = true;
  }

  // Queue a real move through a clicked door. The exit's id is the destination room id,
  // which is exactly what the move command's exit_id argument expects. The server validates
  // reachability and queues the action when the player is short on points.
  async _moveThroughExit(exit) {
    if (!exit || !this._playerInView()) return;
    const action = this._availableActions().find(item =>
      actionArguments(item).some(arg => arg.target_group === 'exits'));
    if (!action) return;
    const exitArg = actionArguments(action).find(arg => arg.target_group === 'exits');
    const cost = actionCost(action);
    if (await this._postCommand(
      action.command_type || actionTool(action),
      { [exitArg.key]: exit.id },
      cost.action,
      cost.focus,
      actionLane(action),
    )) {
      await this._refresh();
    }
  }

  // ── Room action verbs ────────────────────────────────────────────────────────

  async _doVerb(verb) {
    await this._doAction(legacyActionView(verb));
  }

  async _doAction(action) {
    if (!action) return;
    const fields = this._actionFields(action);
    let payload = {};
    if (fields.length) {
      const result = await this._actionForm(action, fields);
      if (result == null) return;            // cancelled
      payload = result;
    }
    const cost = actionCost(action);
    if (await this._postCommand(
      action.command_type || actionTool(action),
      payload,
      cost.action,
      cost.focus,
      actionLane(action),
    )) {
      await this._refresh();
    }
  }

  // Candidate targets for a verb, taken from the character projection's target groups
  // (exits, roomItems, inventory, characters, reachableItems). The server still validates
  // reachability/edibility/etc., so this only needs to offer plausible choices.
  _targetCandidates(kind) {
    if (this.characterProjection?.characterId === this.playerId) {
      return this.characterProjection.targetGroups?.[kind] || [];
    }
    return [];
  }

  _availableActions() {
    if (this.characterProjection?.characterId === this.playerId &&
        this.characterProjection.actions?.length) {
      return this.characterProjection.actions;
    }
    return ACTION_VERBS.map(legacyActionView);
  }

  _filteredActions() {
    return filterActions(this._availableActions(), this.actionFilter);
  }

  // Arguments worth prompting: every required argument plus any entity argument that has
  // a target group (rendered as a dropdown of nearby candidates). Mirrors the terminal
  // TUI's action form so both player clients prompt for the same fields.
  _actionFields(action) {
    return actionFields(action, group => this._targetCandidates(group));
  }

  // One modal collecting all of an action's fields: a dropdown for target and boolean
  // fields, a numeric input for numbers, a text input otherwise. Resolves to a payload
  // object, or null if cancelled.
  _actionForm(action, fields) {
    return new Promise((resolve) => {
      // Only one action form may be open at a time; ignore a second request while one is
      // still on screen.
      if (document.getElementById('action-form-overlay')) { resolve(null); return; }
      const esc = BunnylandUI.escapeHtml;
      const fieldHtml = fields.map((field, i) => {
        const label = `${esc(field.label)}${field.required ? ' *' : ''}`;
        let control;
        if (field.candidates) {
          const options = ['<option value="">— choose —</option>'].concat(
            field.candidates.map(c => {
              const selected = c.value === this.selectedId ? ' selected' : '';
              return `<option value="${esc(c.value)}"${selected}>${esc(c.icon)} ${esc(c.label)}</option>`;
            }));
          control = `<select class="af-input" data-i="${i}">${options.join('')}</select>`;
        } else if (field.kind === 'boolean') {
          control = `<select class="af-input" data-i="${i}">` +
            `<option value="">— choose —</option>` +
            `<option value="true">yes</option><option value="false">no</option></select>`;
        } else {
          const type = field.kind === 'number' ? 'number' : 'text';
          control = `<input class="af-input" data-i="${i}" type="${type}">`;
        }
        return `<label class="af-field"><span class="af-label">${label}</span>${control}</label>`;
      }).join('');

      const overlay = document.createElement('div');
      overlay.id = 'action-form-overlay';
      overlay.innerHTML =
        `<div class="target-card">` +
        `<div class="target-card-header">${esc(actionTitle(action))}</div>` +
        `<div class="af-body">${fieldHtml}<div class="af-error"></div></div>` +
        `<div class="target-card-footer">` +
        `<button class="af-cancel">Cancel</button>` +
        `<button class="af-submit">Submit</button></div></div>`;

      const close = (value) => {
        document.removeEventListener('keydown', onKey);
        overlay.remove();
        resolve(value);
      };
      const valueFor = (i) => {
        const el = overlay.querySelector(`.af-input[data-i="${i}"]`);
        const raw = (el?.value ?? '').trim();
        return raw === '' ? null : raw;
      };
      const submit = () => {
        const payload = {};
        for (let i = 0; i < fields.length; i++) {
          const value = valueFor(i);
          if (fields[i].required && value == null) {
            overlay.querySelector('.af-error').textContent = `${fields[i].label} is required.`;
            return;
          }
          if (value != null) payload[fields[i].key] = value;
        }
        close(payload);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') close(null);
        else if (e.key === 'Enter' && e.target.tagName === 'INPUT') submit();
      };
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(null); });
      overlay.querySelector('.af-cancel').addEventListener('click', () => close(null));
      overlay.querySelector('.af-submit').addEventListener('click', submit);
      document.addEventListener('keydown', onKey);
      document.getElementById('stage-wrapper').appendChild(overlay);
      const first = overlay.querySelector('.af-input');
      if (first) first.focus();
    });
  }

  // The action menu: each action shows its cost and is disabled when the player cannot
  // afford it (or when no player is selected). Server-provided projection actions are used
  // when available; ACTION_VERBS remains the snapshot/offline fallback.
  _renderActions() {
    const body = document.getElementById('actions-body');
    const pts = this._playerPoints();
    const hasPlayer = !!this.playerId && pts.has;
    const esc = BunnylandUI.escapeHtml;
    const filterWasFocused = document.activeElement?.id === 'action-filter';

    const summary = hasPlayer
      ? `<span class="pt ap">⚡ ${fmtPoints(pts.ap)} / ${fmtPoints(pts.apMax)} AP</span>` +
        `<span class="pt fp">🔹 ${fmtPoints(pts.fp)} / ${fmtPoints(pts.fpMax)} FP</span>`
      : '<span class="pt-empty">Select a player to see their actions.</span>';

    let html = `<div id="pt-summary">${summary}</div>` +
      `<div id="action-filter-row">` +
      `<input id="action-filter" type="text" value="${esc(this.actionFilter)}" placeholder="Search actions" spellcheck="false">` +
      `<button id="action-filter-clear" type="button">Clear</button>` +
      `</div>`;
    const filteredActions = this._filteredActions();
    for (const [title, lane] of [['Room actions', 'world'], ['Focus actions', 'focus']]) {
      html += `<div class="action-section-title">${title}</div><div class="verb-list">`;
      const rows = filteredActions.filter(action => actionLane(action) === lane)
        .map((action) => this._verbRowHtml(action, pts, hasPlayer, esc)).join('');
      html += rows || '<div class="queued-empty">No matching actions.</div>';
      html += '</div>';
    }
    html += this._queuedActionsHtml(this._playerQueuedCommands(), esc);
    html += this._activityHtml(esc);
    body.innerHTML = html;

    for (const el of body.querySelectorAll('.verb.ready[data-tool]')) {
      const action = this._availableActions().find(item => actionTool(item) === el.dataset.tool);
      el.addEventListener('click', () => this._doAction(action));
    }
    for (const el of body.querySelectorAll('[data-cancel-command]')) {
      el.addEventListener('click', () => this._cancelQueuedCommand(el.dataset.cancelCommand));
    }
    const filter = document.getElementById('action-filter');
    if (filter && filterWasFocused) {
      filter.focus();
      filter.setSelectionRange(filter.value.length, filter.value.length);
    }
  }

  _queuedActionsHtml(commands, esc) {
    const countdown = queuedCountdownSeconds(this.queueProjection);
    const title = `Queued actions${countdown == null ? '' : ` · next tick in ${countdown}s`}`;
    if (!commands.length) {
      return `<div class="action-section-title">${esc(title)}</div>` +
        '<div class="queued-empty">No queued actions.</div>';
    }
    const actions = this._availableActions();
    const rows = commands.map(command => {
      const name = queuedCommandName(command, actions);
      const cost = queuedCommandCost(command);
      const detail = queuedCommandDetail(command);
      return `<button class="queued-action" type="button" data-cancel-command="${esc(command.command_id || '')}" title="Cancel queued action">` +
        `<div class="queued-action-head">` +
        `<span class="queued-action-name">${esc(name)}</span>` +
        `<span class="queued-action-lane">${esc(command.lane || '')}</span>` +
        `</div>` +
        `<div class="queued-action-detail">${esc([cost, detail].filter(Boolean).join(' · '))}</div>` +
        `</button>`;
    }).join('');
    return `<div class="action-section-title">${esc(title)}</div><div class="queued-list">${rows}</div>`;
  }

  _verbRowHtml(verb, pts, hasPlayer, esc) {
    const costView = actionCost(verb);
    const available = actionAvailable(verb);
    const ready = hasPlayer;
    const reason = actionUnavailableReason(verb);
    const title = !hasPlayer ? 'Select a character'
      : reason ? reason
      : actionArguments(verb).some(arg => arg.target_group) ? `${actionTitle(verb)}: choose a target`
      : `Perform: ${actionTitle(verb)}`;

    const cost = costView.action || costView.focus
      ? (costView.action ? `<span class="cost ap">${costView.action} AP</span>` : '') +
        (costView.focus ? `<span class="cost fp">${costView.focus} FP</span>` : '')
      : '<span class="cost free">free</span>';
    const note = actionArguments(verb).some(arg => arg.target_group)
      ? '<span class="verb-note">⌖ target</span>'
      : '';
    const reasonHtml = reason ? `<span class="verb-reason">${esc(reason)}</span>` : '';
    const classes = ['verb'];
    if (ready) classes.push('ready');
    if (!available) classes.push('unavailable');

    return `<div class="${classes.join(' ')}"${ready ? ` data-tool="${esc(actionTool(verb))}"` : ''} title="${esc(title)}">` +
      `<span class="verb-name">${esc(actionTitle(verb))}</span>` +
      `<span class="verb-cost">${note}${cost}${reasonHtml}</span></div>`;
  }

  _activityHtml(esc) {
    if (!this.activityLines.length) {
      return '<div class="action-section-title">Activity</div>' +
        '<div class="activity-empty">No recent activity.</div>';
    }
    const rows = this.activityLines.map(line =>
      `<div class="activity-row ${line.kind ? `kind-${esc(line.kind)}` : ''}">` +
      `${esc(line.text)}</div>`).join('');
    return `<div class="action-section-title">Activity</div><div class="activity-list">${rows}</div>`;
  }

  // ── Rendering ────────────────────────────────────────────────────────────────

  render() {
    this._renderActions();

    const stage = document.getElementById('stage');
    const empty = document.getElementById('stage-empty');
    const room = this._currentRoom();

    for (const el of stage.querySelectorAll('.sprite, .door, .debug-box')) el.remove();

    if (!room) {
      empty.classList.remove('hidden');
      document.getElementById('room-bg').style.backgroundImage = '';
      document.getElementById('room-bg').textContent = '';
      document.getElementById('room-title').textContent = this.connected ? 'No room' : 'Not connected';
      return;
    }
    empty.classList.add('hidden');

    const rect = stage.getBoundingClientRect();

    // Background = the room's own sprite (layer 0), or a labelled placeholder.
    const bg = document.getElementById('room-bg');
    const roomImg = room.sprite?.image_url || room.sprite?.image_data || room.components?.SpriteImage?.url;
    bg.style.backgroundImage = roomImg ? `url("${roomImg}")` : '';
    bg.textContent = roomImg ? '' : `“${entityName(room)}”`;

    document.getElementById('room-title').textContent =
      `${entityName(room)}${this._playerInView() ? '' : '  ·  spectating'}`;
    stage.classList.toggle('spectating', !this._playerInView());

    // Sprites: every member, ordered by layer, placed by SpritePosition (player uses
    // its optimistic local position so movement feels instant).
    const members = this._roomMembers(this.viewRoomId)
      .filter(e => !e.components?.DoorComponent)
      .sort((a, b) => this._spriteLayer(a) - this._spriteLayer(b));
    for (const member of members) {
      const isPlayer = member.id === this.playerId;
      const pos = (isPlayer && this.localPos) ? this.localPos : this._spritePos(member);
      const point = this._roomToStagePoint(pos, rect, room);
      stage.appendChild(this._spriteEl(member, point.x, point.y, isPlayer));
    }

    this._renderDoors(stage, room);
    this._renderDebugBounds(stage, room, rect);

    const hint = document.getElementById('stage-hint');
    hint.textContent = this._playerInView()
      ? 'Click or use arrow keys / WASD to move · click a door to walk to the next room'
      : (this.playerId ? 'Spectating another room — “Follow character” to return' : 'Select a character to move');
  }

  _spriteEl(entity, left, top, isPlayer) {
    const el = document.createElement('div');
    el.className = 'sprite' + (isPlayer ? ' player' : '') + (entity.id === this.selectedId ? ' selected' : '');
    el.style.left = `${left}px`;
    el.style.top = `${top}px`;
    el.style.zIndex = String(1000 + this._spriteLayer(entity));
    // Sprites arrive at different sizes, so normalize each by its SpriteScale before
    // compositing. Only the glyph scales; the name label stays legible.
    const scale = this._spriteScale(entity);
    const scaleStyle = scale !== 1 ? ` style="transform: scale(${scale})"` : '';
    const img = entity.sprite?.image_url || entity.sprite?.image_data || entity.components?.SpriteImage?.url;
    const glyph = img
      ? `<img class="glyph" src="${img}" alt=""${scaleStyle}>`
      : `<div class="glyph"${scaleStyle}>${entityIcon(entity)}</div>`;
    el.innerHTML = `${glyph}<div class="label">${BunnylandUI.escapeHtml(entityName(entity))}</div>`;
    el.addEventListener('click', (event) => {
      event.stopPropagation();
      this.selectedId = entity.id;
      this.render();
    });
    return el;
  }

  _renderDoors(stage, room) {
    const margin = 14;
    if (this.roomProjection?.room?.id === room.id) {
      for (const exit of room.exits || []) {
        const dir = (exit.direction || '').toLowerCase();
        const [ox, oy] = DIR_EDGE[dir] || [1, 0];
        const door = document.createElement('div');
        door.className = 'door';
        door.innerHTML =
          `🚪 ${BunnylandUI.escapeHtml(exit.label)}` +
          (dir ? `<span class="door-dir">${BunnylandUI.escapeHtml(dir)}</span>` : '');
        door.style.left = ox === 0 ? '50%' : (ox < 0 ? `${margin}px` : 'auto');
        door.style.right = ox > 0 ? `${margin}px` : 'auto';
        door.style.top = oy === 0 ? '50%' : (oy < 0 ? `${margin}px` : 'auto');
        door.style.bottom = oy > 0 ? `${margin}px` : 'auto';
        if (ox === 0) door.style.transform = 'translateX(-50%)';
        if (oy === 0) door.style.transform = 'translateY(-50%)';
        door.title = this._playerInView()
          ? `Walk through ${exit.label}`
          : `Look into ${exit.label}`;
        door.addEventListener('click', () => {
          // From your own room a door is a real exit: queue a move through it. While
          // spectating another room you cannot move there, so the door just peeks further.
          if (this._playerInView()) {
            this._moveThroughExit(exit);
          } else {
            this.viewRoomId = exit.id;
            this.followPlayer = false;
            this.roomProjection = null;
            this._refreshRoomProjection(exit.id, { render: true });
            this.render();
          }
        });
        stage.appendChild(door);
      }
    }
  }

  _renderDebugBounds(stage, room, rect) {
    if (!this.debugBounds) return;
    const roomBounds = this._roomBounds(room);
    this._appendDebugBox(
      stage,
      { left: 0, top: 0, right: roomBounds.width, bottom: roomBounds.height },
      rect,
      room,
      'room',
      entityName(room),
    );

    for (const member of this._roomMembers(this.viewRoomId)) {
      if (member.components?.DoorComponent) continue;
      const bounds = this._spriteBounds(member);
      const pos = (member.id === this.playerId && this.localPos)
        ? this.localPos
        : this._spritePos(member);
      this._appendDebugBox(
        stage,
        this._aabb(pos, bounds),
        rect,
        room,
        bounds.solid ? 'collision' : 'nocollision',
        entityName(member),
      );
    }
  }

  _appendDebugBox(stage, aabb, rect, room, type, label) {
    const box = document.createElement('div');
    const stageRect = this._roomAabbToStageRect(aabb, rect, room);
    box.className = `debug-box ${type}`;
    box.style.left = `${stageRect.left}px`;
    box.style.top = `${stageRect.top}px`;
    box.style.width = `${stageRect.width}px`;
    box.style.height = `${stageRect.height}px`;
    box.title = label;
    stage.appendChild(box);
  }
}

window.addEventListener('resize', () => window.app?.render());
window.app = new RoomClient();
</script>
</body>
</html>
