<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland World Generator</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    #api-url { width: 240px; }
    #generator-select { width: 220px; }
    #seed-input { width: 100%; min-height: 92px; resize: vertical; }
    #max-rooms { width: 76px; }

    #main {
      grid-template-columns: minmax(300px, 380px) minmax(420px, 1fr) minmax(320px, 430px);
    }

    #activity-list,
    #entity-list {
      padding: 6px 0;
    }

    .entity-row.generated {
      background: var(--bl-accent-wash);
    }

    .entity-row.generated .entity-name::after {
      content: " new";
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
    }

    #empty-activity,
    #empty-entities {
      padding: 18px 14px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    @media (max-width: 1050px) {
      #main {
        grid-template-columns: minmax(300px, 380px) minmax(420px, 1fr);
      }
      #entity-pane {
        display: none;
      }
    }
  </style>
</head>
<body class="bl-tool-page bl-page-world-generator">
  <div id="app"></div>
  <script src="assets/bunnyland-ui.js?v=20260718-formal-v1"></script>
  <script src="assets/bunnyland-api.js?v=20260718-formal-v1"></script>
  <script src="assets/bunnyland-world.js"></script>
  <script type="module" src="/src/world-generator/app.tsx"></script>
</body>
</html>
