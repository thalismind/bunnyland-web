<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland Behavior Editor</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    #behavior-name { width: 200px; }
    #behavior-desc { width: 260px; }
    #api-url { width: 200px; }

    #main {
      grid-template-columns: minmax(240px, 320px) minmax(460px, 1fr) minmax(320px, 430px);
    }

    .lib-section { padding: 10px; border-bottom: 1px solid var(--bl-border); }

    .lib-title {
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-sm);
      font-weight: bold;
      margin-bottom: 6px;
    }

    .lib-hint {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .behavior-name-row {
      padding: 4px 6px;
      border-bottom: 1px solid var(--bl-bg-row);
      font-size: var(--bl-text-sm);
      color: var(--bl-text-soft);
    }

    #tree-scroll { padding: 12px; }

    .bt-node {
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      background: var(--bl-bg);
      margin-bottom: 8px;
    }

    .bt-node.kind-sequence { border-left: 3px solid var(--bl-info); }
    .bt-node.kind-selector { border-left: 3px solid var(--bl-warn); }
    .bt-node.kind-condition { border-left: 3px solid var(--bl-accent); }
    .bt-node.kind-action { border-left: 3px solid var(--bl-ok); }

    .bt-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--bl-border);
    }

    .bt-kind-badge {
      color: var(--bl-bg-deep);
      background: var(--bl-text-soft);
      border-radius: var(--bl-radius-sm);
      padding: 1px 6px;
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .kind-sequence .bt-kind-badge { background: var(--bl-info); }
    .kind-selector .bt-kind-badge { background: var(--bl-warn); }
    .kind-condition .bt-kind-badge { background: var(--bl-accent); }
    .kind-action .bt-kind-badge { background: var(--bl-ok); }
    .bt-head .node-kind { width: 110px; }
    .bt-head .bt-spacer { flex: 1; }
    .bt-head button { padding: 1px 7px; }
    .bt-add-btn { color: var(--bl-accent); }

    .bt-body { padding: 8px; display: flex; flex-direction: column; gap: 8px; }

    .bt-body label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: var(--bl-text-xs);
      color: var(--bl-text-soft);
    }

    .bt-body .node-params { min-height: 56px; }
    .param-hint { color: var(--bl-text-muted); font-size: var(--bl-text-xs); }

    .bt-children {
      margin: 0 8px 8px;
      padding-left: 10px;
      border-left: 1px dashed var(--bl-border-strong);
    }

    .bt-children .empty { padding: 10px; font-size: var(--bl-text-sm); }

    @media (max-width: 1050px) {
      #main { grid-template-columns: 260px minmax(420px, 1fr); }
      #preview-pane { display: none; }
    }

  </style>
</head>
<body class="bl-tool-page bl-page-behavior-editor">
<div id="app"></div>
<script src="assets/bunnyland-ui.js?v=20260719-world-graph"></script>
<script src="assets/bunnyland-api.js?v=20260718-formal-v1"></script>
<script type="module" src="/src/behavior-editor/page.tsx"></script>
</body>
</html>
