<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland Character Memory</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    #api-url { width: 240px; }
    #memory-search { width: 100%; }
    #main {
      grid-template-columns: minmax(280px, 360px) minmax(360px, 1fr) minmax(360px, 460px);
    }
    .character-row,
    .document-row {
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--bl-bg-row);
      border-radius: 0;
      padding: 8px 10px;
      background: transparent;
      color: var(--bl-text);
      cursor: pointer;
    }
    .character-row:hover,
    .document-row:hover {
      background: var(--bl-bg-row);
    }
    .collection-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 5px 10px 5px 22px;
      background: transparent;
      color: var(--bl-text-soft);
      text-align: left;
      cursor: pointer;
    }
    .collection-row:hover,
    .collection-row.active,
    .document-row.active {
      background: var(--bl-accent-wash);
      color: var(--bl-text);
    }
    .row-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--bl-text-sm);
      font-weight: bold;
    }
    .row-subtitle {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      margin-top: 2px;
    }
    .collection-scope {
      min-width: 48px;
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
    }
    #document-editor {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      gap: 8px;
      padding: 10px;
    }
    #document-editor label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-xs);
      font-weight: bold;
    }
    .memory-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-xs);
      font-weight: bold;
    }
    #document-text {
      min-height: 160px;
      flex: 1;
      resize: vertical;
    }
    #metadata-json {
      min-height: 160px;
      flex: 1;
      resize: vertical;
      font-family: var(--bl-font-mono);
      font-size: var(--bl-text-sm);
    }
    #editor-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #btn-delete-document {
      color: var(--bl-danger);
      border-color: var(--bl-danger);
    }
    #metadata-error {
      min-height: 18px;
      color: var(--bl-danger);
      font-size: var(--bl-text-xs);
    }
    .empty {
      padding: 18px 14px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }
    @media (max-width: 1050px) {
      #main { grid-template-columns: minmax(260px, 340px) minmax(420px, 1fr); }
      #editor-pane { grid-column: 1 / -1; }
    }

  </style>
</head>
<body class="bl-tool-page bl-page-character-memory">
  <div id="app"></div>
  <script src="assets/bunnyland-ui.js?v=20260719-world-graph"></script>
  <script src="assets/bunnyland-api.js?v=20260718-formal-v1"></script>
  <script type="module" src="/src/character-memory/app.tsx"></script>
</body>
</html>
