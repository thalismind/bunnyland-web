<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Character Chat</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #api-url { width: 190px; }
    .toolbar-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      white-space: nowrap;
    }
    .toolbar-toggle input {
      margin: 0;
    }
    #main {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 0;
      background: var(--bl-bg-deep);
    }
    #character-pane {
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      border-right: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
    }
    #chat-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .pane-title {
      margin: 0 0 8px;
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #character-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .character-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text);
      text-align: left;
    }
    .character-row.active {
      border-color: var(--bl-accent);
      background: var(--bl-accent-wash);
    }
    .character-row strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .character-row span {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
    }
    #transcript {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
    }
    .message {
      max-width: 760px;
      margin: 0 0 10px;
      padding: 8px 10px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text-soft);
      line-height: 1.45;
      white-space: normal;
    }
    .message.plain {
      white-space: pre-wrap;
    }
    .message.user {
      margin-left: auto;
      border-color: var(--bl-accent);
      background: var(--bl-accent-wash);
      color: var(--bl-text);
    }
    .message.character {
      margin-right: auto;
    }
    .message p,
    .message ul,
    .message ol,
    .message blockquote,
    .message pre {
      margin: 0 0 8px;
    }
    .message p:last-child,
    .message ul:last-child,
    .message ol:last-child,
    .message blockquote:last-child,
    .message pre:last-child {
      margin-bottom: 0;
    }
    .message ul,
    .message ol {
      padding-left: 22px;
    }
    .message blockquote {
      padding-left: 10px;
      border-left: 3px solid var(--bl-border);
      color: var(--bl-text-muted);
    }
    .message pre {
      overflow-x: auto;
      padding: 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg);
      white-space: pre-wrap;
    }
    .message code {
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--bl-bg);
      color: var(--bl-text);
      font-family: var(--bl-font-mono);
      font-size: 0.92em;
    }
    .message pre code {
      padding: 0;
      background: transparent;
    }
    .message a {
      color: var(--bl-accent);
    }
    .action-message {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      max-width: 760px;
      margin: 0 0 10px;
      padding: 7px 10px;
      border: 1px solid var(--bl-border);
      border-left: 3px solid var(--bl-accent);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-strong);
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
      line-height: 1.35;
    }
    .action-message .action-icon {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text);
    }
    .action-message strong {
      color: var(--bl-text-soft);
      font-weight: 600;
    }
    .action-message.rejected {
      border-left-color: var(--bl-error);
    }
    .action-message.executed {
      border-left-color: var(--bl-ok);
    }
    #status-line {
      padding: 7px 12px;
      border-top: 1px solid var(--bl-border);
      color: var(--bl-text-muted);
      background: var(--bl-bg-strong);
      font-size: var(--bl-text-sm);
      min-height: 30px;
    }
    #composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
    }
    #chat-input {
      width: 100%;
      min-height: 42px;
      resize: vertical;
      background: var(--bl-bg);
    }
    @media (max-width: 760px) {
      #main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      #character-pane { max-height: 28vh; border-right: 0; border-bottom: 1px solid var(--bl-border); }
      .toolbar-row { flex-wrap: wrap; }
      .client-menu-button { margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-row">
    <span class="toolbar-brand"><img src="favicon.png" alt=""> Bunnyland Character Chat</span>
    <span class="toolbar-sep">|</span>
    <label for="api-url">Server:</label>
    <input type="text" id="api-url" value="/api/" spellcheck="false">
    <button id="btn-connect" type="button">Connect Live</button>
    <span id="api-status">○ Offline</span>
    <label class="toolbar-toggle" for="markdown-toggle">
      <input type="checkbox" id="markdown-toggle" checked>
      Markdown
    </label>
    <button id="btn-client-menu" class="client-menu-button" type="button">Menu</button>
  </div>
</div>

<div id="main" class="app-grid">
  <aside id="character-pane" aria-label="Characters">
    <h2 class="pane-title">Characters</h2>
    <div id="character-list"></div>
  </aside>
  <section id="chat-pane" aria-label="Character chat">
    <div id="transcript"></div>
    <div id="status-line">Connect to a server with character chat enabled.</div>
    <form id="composer" autocomplete="off">
      <textarea id="chat-input" spellcheck="true" aria-label="Message"></textarea>
      <button id="btn-send" type="submit">Send</button>
    </form>
  </section>
</div>

<script src="assets/bunnyland-ui.js"></script>
<script src="assets/bunnyland-api.js"></script>
<script src="assets/bunnyland-play.js"></script>
<script>
(() => {
  'use strict';

  const CLIENT_ID_KEY = 'bunnyland.characterChat.clientId';
  const HISTORY_PREFIX = 'bunnyland.characterChat.history.';
  const MARKDOWN_KEY = 'bunnyland.characterChat.markdown';
  const HISTORY_LIMIT = 24;
  const PENDING_POLL_MS = 2000;
  let base = '';
  let clientId = '';
  let characters = [];
  let selectedId = '';
  let markdownEnabled = localStorage.getItem(MARKDOWN_KEY) !== '0';
  const pendingPolls = new Map();

  const els = {
    apiUrl: document.getElementById('api-url'),
    connect: document.getElementById('btn-connect'),
    markdown: document.getElementById('markdown-toggle'),
    status: document.getElementById('api-status'),
    list: document.getElementById('character-list'),
    transcript: document.getElementById('transcript'),
    line: document.getElementById('status-line'),
    form: document.getElementById('composer'),
    input: document.getElementById('chat-input'),
  };

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[ch]));
  }

  function safeMarkdownUrl(value) {
    const raw = String(value || '').trim();
    if (!raw) return '';
    try {
      const parsed = new URL(raw, location.href);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:' || parsed.protocol === 'mailto:') {
        return parsed.href;
      }
    } catch (_err) {
      return '';
    }
    return '';
  }

  function renderInlineMarkdown(value) {
    const code = [];
    let html = escapeHtml(value).replace(/`([^`\n]+)`/g, (_match, text) => {
      const token = `\u0000CODE${code.length}\u0000`;
      code.push(`<code>${text}</code>`);
      return token;
    });
    html = html.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (_match, label, url) => {
      const href = safeMarkdownUrl(url);
      if (!href) return label;
      return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    });
    html = html
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
      .replace(/\b_([^_\n]+)_\b/g, '<em>$1</em>');
    return code.reduce((next, item, index) => next.replace(`\u0000CODE${index}\u0000`, item), html);
  }

  function isListLine(line) {
    return /^\s*(?:[-*+]\s+|\d+\.\s+)/.test(line);
  }

  function isBlockStart(line) {
    return /^```/.test(line) || /^(?:#{1,3}\s+|>\s?)/.test(line) || isListLine(line);
  }

  function renderMarkdown(value) {
    const lines = String(value || '').replace(/\r\n?/g, '\n').split('\n');
    const blocks = [];
    for (let i = 0; i < lines.length;) {
      const line = lines[i];
      if (!line.trim()) {
        i += 1;
        continue;
      }
      if (/^```/.test(line)) {
        const code = [];
        i += 1;
        while (i < lines.length && !/^```/.test(lines[i])) {
          code.push(lines[i]);
          i += 1;
        }
        if (i < lines.length) i += 1;
        blocks.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
        continue;
      }
      const heading = /^(#{1,3})\s+(.+)$/.exec(line);
      if (heading) {
        const level = heading[1].length + 2;
        blocks.push(`<h${level}>${renderInlineMarkdown(heading[2].trim())}</h${level}>`);
        i += 1;
        continue;
      }
      if (/^>\s?/.test(line)) {
        const quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          quote.push(lines[i].replace(/^>\s?/, ''));
          i += 1;
        }
        blocks.push(`<blockquote>${renderInlineMarkdown(quote.join('\n'))}</blockquote>`);
        continue;
      }
      if (isListLine(line)) {
        const ordered = /^\s*\d+\.\s+/.test(line);
        const tag = ordered ? 'ol' : 'ul';
        const items = [];
        while (i < lines.length && isListLine(lines[i]) && /^\s*\d+\.\s+/.test(lines[i]) === ordered) {
          items.push(`<li>${renderInlineMarkdown(lines[i].replace(/^\s*(?:[-*+]\s+|\d+\.\s+)/, ''))}</li>`);
          i += 1;
        }
        blocks.push(`<${tag}>${items.join('')}</${tag}>`);
        continue;
      }
      const paragraph = [line.trim()];
      i += 1;
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) {
        paragraph.push(lines[i].trim());
        i += 1;
      }
      blocks.push(`<p>${renderInlineMarkdown(paragraph.join(' '))}</p>`);
    }
    return blocks.join('');
  }

  function renderMessageText(value) {
    return markdownEnabled ? renderMarkdown(value) : escapeHtml(value);
  }

  function storageKey(characterId) {
    return `${HISTORY_PREFIX}${clientId}.${characterId}`;
  }

  function loadState(characterId) {
    try {
      const parsed = JSON.parse(localStorage.getItem(storageKey(characterId)) || '{}');
      return {
        summary: String(parsed.summary || ''),
        messages: (parsed.messages || []).slice(-HISTORY_LIMIT),
      };
    } catch (_err) {
      return { summary: '', messages: [] };
    }
  }

  function saveState(characterId, state) {
    try {
      localStorage.setItem(storageKey(characterId), JSON.stringify({
        summary: String(state.summary || ''),
        messages: (state.messages || []).slice(-HISTORY_LIMIT),
      }));
    } catch (_err) {
      // Local persistence is optional.
    }
  }

  function historyForPayload(messages) {
    return (messages || [])
      .filter(message => (message.role === 'user' || message.role === 'character') && message.text)
      .map(message => ({ role: message.role, text: message.text }))
      .slice(-HISTORY_LIMIT);
  }

  function appendMessage(characterId, message) {
    const state = loadState(characterId);
    state.messages = [...state.messages, message].slice(-HISTORY_LIMIT);
    saveState(characterId, state);
  }

  function actionSummary(action) {
    const tool = action.tool || 'action';
    if (action.status === 'queued') {
      return `${tool} queued as a game action. Results will appear here when it finishes.`;
    }
    if (action.status === 'executed') {
      return `${tool} finished.`;
    }
    if (action.status === 'rejected') {
      return `${tool} failed${action.reason ? `: ${action.reason}` : '.'}`;
    }
    return `${tool}: ${action.status || 'pending'}`;
  }

  function actionCommandType(tool) {
    return String(tool || 'action').trim().toLowerCase().replaceAll('_', '-');
  }

  function actionIcon(action) {
    return BunnylandPlay.actionIcon({
      command_type: actionCommandType(action.tool),
      tool_name: action.tool || 'action',
    });
  }

  function upsertActionMessage(characterId, action) {
    if (!action.tool) return;
    const state = loadState(characterId);
    const commandId = action.command_id || '';
    const next = {
      role: 'action',
      text: actionSummary(action),
      command_id: commandId,
      action,
    };
    const index = commandId
      ? state.messages.findIndex(message => message.role === 'action' && message.command_id === commandId)
      : -1;
    if (index >= 0) state.messages[index] = next;
    else state.messages = [...state.messages, next].slice(-HISTORY_LIMIT);
    saveState(characterId, state);
  }

  function appendPendingReply(characterId, commandId, reply) {
    if (!reply) return;
    const state = loadState(characterId);
    if (state.messages.some(message => message.role === 'character' && message.command_id === commandId)) {
      return;
    }
    state.messages = [
      ...state.messages,
      { role: 'character', text: reply, command_id: commandId },
    ].slice(-HISTORY_LIMIT);
    saveState(characterId, state);
  }

  function pendingKey(characterId, commandId) {
    return `${characterId}:${commandId}`;
  }

  function currentName() {
    return characters.find(character => character.character_id === selectedId)?.name || 'Character';
  }

  function renderCharacters() {
    if (!characters.length) {
      els.list.innerHTML = '<div class="side-empty">No characters found.</div>';
      return;
    }
    els.list.innerHTML = characters.map(character => `
      <button class="character-row ${character.character_id === selectedId ? 'active' : ''}" type="button" data-id="${escapeHtml(character.character_id)}">
        <strong>${escapeHtml(character.name || character.character_id)}</strong>
        <span>${escapeHtml(character.suspended ? 'suspended' : character.kind || 'character')}</span>
      </button>
    `).join('');
  }

  function renderTranscript() {
    if (!selectedId) {
      els.transcript.innerHTML = '<div class="side-empty">Pick a character to start chatting.</div>';
      return;
    }
    const state = loadState(selectedId);
    if (!state.messages.length) {
      els.transcript.innerHTML = '<div class="side-empty">No local chat history for this character.</div>';
      return;
    }
    els.transcript.innerHTML = state.messages.map(message => {
      if (message.role === 'action') {
        const action = message.action || {};
        return `<div class="action-message ${escapeHtml(action.status || '')}" data-command-id="${escapeHtml(message.command_id || '')}">` +
          `<span class="action-icon" aria-hidden="true">${escapeHtml(actionIcon(action))}</span>` +
          `<span><strong>${escapeHtml(action.tool || 'action')}</strong> · ${escapeHtml(message.text || actionSummary(action))}</span>` +
          `</div>`;
      }
      return `<div class="message ${message.role === 'user' ? 'user' : 'character'} ${markdownEnabled ? '' : 'plain'}">${renderMessageText(message.text)}</div>`;
    }).join('');
    els.transcript.scrollTop = els.transcript.scrollHeight;
  }

  function setStatus(text, ok = true) {
    els.status.textContent = `${ok ? '●' : '○'} ${text}`;
    els.status.style.color = ok ? 'var(--bl-ok)' : 'var(--bl-error)';
  }

  async function connect(server) {
    base = BunnylandApi.normalizeBase(server);
    BunnylandApi.setServerInUrl(base);
    clientId = BunnylandPlay.persistentClientId(CLIENT_ID_KEY, 'character-chat');
    const status = await BunnylandApi.sendJson(base, '/world/chat/status');
    if (!status.enabled) throw new Error('character chat is disabled');
    const list = await BunnylandApi.sendJson(base, '/world/characters');
    characters = list.characters || [];
    selectedId = selectedId || characters[0]?.character_id || '';
    renderCharacters();
    renderTranscript();
    resumePendingPolls();
    setStatus(`Connected · tools: ${(status.allowed_tools || []).join(', ') || 'none'}`);
    els.line.textContent = selectedId ? `Chatting with ${currentName()}.` : 'No characters available.';
  }

  function resumePendingPolls() {
    for (const character of characters) {
      const state = loadState(character.character_id);
      for (const message of state.messages) {
        if (message.role === 'action' && message.action?.status === 'queued' && message.command_id) {
          startPendingPoll(character.character_id, message.command_id);
        }
      }
    }
  }

  function startPendingPoll(characterId, commandId) {
    if (!base || !clientId || !characterId || !commandId) return;
    const key = pendingKey(characterId, commandId);
    if (pendingPolls.has(key)) return;
    const poll = async () => {
      try {
        const response = await BunnylandApi.sendJson(
          base,
          `/world/character/${encodeURIComponent(characterId)}/chat/pending/${encodeURIComponent(commandId)}?client_id=${encodeURIComponent(clientId)}`,
        );
        if (response.action?.tool) {
          upsertActionMessage(characterId, response.action);
        }
        if (response.complete) {
          pendingPolls.delete(key);
          appendPendingReply(characterId, commandId, response.reply || '');
          if (selectedId === characterId) {
            renderTranscript();
            els.line.textContent = response.action?.tool ? `${response.action.tool}: ${response.action.status}` : 'Action finished.';
          }
          return;
        }
        if (selectedId === characterId) {
          renderTranscript();
          els.line.textContent = response.action?.tool ? `${response.action.tool}: ${response.action.status}` : 'Waiting for action result...';
        }
        pendingPolls.set(key, window.setTimeout(poll, PENDING_POLL_MS));
      } catch (err) {
        pendingPolls.delete(key);
        if (selectedId === characterId) els.line.textContent = err.message;
      }
    };
    pendingPolls.set(key, window.setTimeout(poll, PENDING_POLL_MS));
  }

  async function send(message) {
    if (!base || !selectedId) return;
    const characterId = selectedId;
    const state = loadState(selectedId);
    const payload = {
      client_id: clientId,
      message,
      history_summary: state.summary || '',
      history: historyForPayload(state.messages),
    };
    appendMessage(characterId, { role: 'user', text: message });
    renderTranscript();
    els.line.textContent = 'Waiting for reply...';
    const response = await BunnylandApi.sendJson(
      base,
      `/world/character/${encodeURIComponent(characterId)}/chat`,
      { method: 'POST', body: JSON.stringify(payload) },
    );
    const action = response.action || {};
    if (response.reply) appendMessage(characterId, { role: 'character', text: response.reply || '' });
    if (action.tool) {
      upsertActionMessage(characterId, action);
      if (action.status === 'queued' && action.command_id) {
        startPendingPoll(characterId, action.command_id);
      }
    }
    renderTranscript();
    els.line.textContent = action.tool ? `${action.tool}: ${action.status}${action.reason ? ` · ${action.reason}` : ''}` : 'Reply received.';
  }

  els.connect.addEventListener('click', () => {
    connect(els.apiUrl.value.trim()).catch(err => {
      setStatus(err.message, false);
      els.line.textContent = err.message;
    });
  });
  els.list.addEventListener('click', event => {
    const row = event.target.closest('.character-row');
    if (!row) return;
    selectedId = row.dataset.id || '';
    renderCharacters();
    renderTranscript();
    resumePendingPolls();
    els.line.textContent = selectedId ? `Chatting with ${currentName()}.` : 'Pick a character.';
  });
  els.form.addEventListener('submit', event => {
    event.preventDefault();
    const message = els.input.value.trim();
    if (!message) return;
    els.input.value = '';
    send(message).catch(err => {
      els.line.textContent = err.message;
      setStatus(err.message, false);
    });
  });
  els.input.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
    event.preventDefault();
    els.form.requestSubmit();
  });
  els.markdown.checked = markdownEnabled;
  els.markdown.addEventListener('change', () => {
    markdownEnabled = els.markdown.checked;
    localStorage.setItem(MARKDOWN_KEY, markdownEnabled ? '1' : '0');
    renderTranscript();
  });

  BunnylandUI.initTheme();
  BunnylandUI.initClientMenu();
  BunnylandApi.applyConfigToInput({ connect });
  BunnylandApi.applyServerParam({ connect });
})();
</script>
</body>
</html>
