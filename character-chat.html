<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Character Chat</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #api-url { width: 190px; }
    #main {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 0;
      background: var(--bl-bg-deep);
    }
    #character-pane {
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      border-right: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
    }
    #chat-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .pane-title {
      margin: 0 0 8px;
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #character-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .character-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text);
      text-align: left;
    }
    .character-row.active {
      border-color: var(--bl-accent);
      background: var(--bl-accent-wash);
    }
    .character-row strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .character-row span {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
    }
    #transcript {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
    }
    .message {
      max-width: 760px;
      margin: 0 0 10px;
      padding: 8px 10px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text-soft);
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .message.user {
      margin-left: auto;
      border-color: var(--bl-accent);
      background: var(--bl-accent-wash);
      color: var(--bl-text);
    }
    .message.character {
      margin-right: auto;
    }
    #status-line {
      padding: 7px 12px;
      border-top: 1px solid var(--bl-border);
      color: var(--bl-text-muted);
      background: var(--bl-bg-strong);
      font-size: var(--bl-text-sm);
      min-height: 30px;
    }
    #composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
    }
    #chat-input {
      width: 100%;
      min-height: 42px;
      resize: vertical;
      background: var(--bl-bg);
    }
    @media (max-width: 760px) {
      #main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      #character-pane { max-height: 28vh; border-right: 0; border-bottom: 1px solid var(--bl-border); }
      .toolbar-row { flex-wrap: wrap; }
      .client-menu-button { margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-row">
    <span class="toolbar-brand"><img src="favicon.png" alt=""> Bunnyland Character Chat</span>
    <span class="toolbar-sep">|</span>
    <label for="api-url">Server:</label>
    <input type="text" id="api-url" value="/api/" spellcheck="false">
    <button id="btn-connect" type="button">Connect Live</button>
    <span id="api-status">○ Offline</span>
    <button id="btn-client-menu" class="client-menu-button" type="button">Menu</button>
  </div>
</div>

<div id="main" class="app-grid">
  <aside id="character-pane" aria-label="Characters">
    <h2 class="pane-title">Characters</h2>
    <div id="character-list"></div>
  </aside>
  <section id="chat-pane" aria-label="Character chat">
    <div id="transcript"></div>
    <div id="status-line">Connect to a server with character chat enabled.</div>
    <form id="composer" autocomplete="off">
      <textarea id="chat-input" spellcheck="true" aria-label="Message"></textarea>
      <button id="btn-send" type="submit">Send</button>
    </form>
  </section>
</div>

<script src="assets/bunnyland-ui.js"></script>
<script src="assets/bunnyland-api.js"></script>
<script src="assets/bunnyland-play.js"></script>
<script>
(() => {
  'use strict';

  const CLIENT_ID_KEY = 'bunnyland.characterChat.clientId';
  const HISTORY_PREFIX = 'bunnyland.characterChat.history.';
  const HISTORY_LIMIT = 24;
  let base = '';
  let clientId = '';
  let characters = [];
  let selectedId = '';

  const els = {
    apiUrl: document.getElementById('api-url'),
    connect: document.getElementById('btn-connect'),
    status: document.getElementById('api-status'),
    list: document.getElementById('character-list'),
    transcript: document.getElementById('transcript'),
    line: document.getElementById('status-line'),
    form: document.getElementById('composer'),
    input: document.getElementById('chat-input'),
  };

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[ch]));
  }

  function storageKey(characterId) {
    return `${HISTORY_PREFIX}${clientId}.${characterId}`;
  }

  function loadState(characterId) {
    try {
      const parsed = JSON.parse(localStorage.getItem(storageKey(characterId)) || '{}');
      return {
        summary: String(parsed.summary || ''),
        messages: (parsed.messages || []).slice(-HISTORY_LIMIT),
      };
    } catch (_err) {
      return { summary: '', messages: [] };
    }
  }

  function saveState(characterId, state) {
    try {
      localStorage.setItem(storageKey(characterId), JSON.stringify({
        summary: String(state.summary || ''),
        messages: (state.messages || []).slice(-HISTORY_LIMIT),
      }));
    } catch (_err) {
      // Local persistence is optional.
    }
  }

  function currentName() {
    return characters.find(character => character.character_id === selectedId)?.name || 'Character';
  }

  function renderCharacters() {
    if (!characters.length) {
      els.list.innerHTML = '<div class="side-empty">No characters found.</div>';
      return;
    }
    els.list.innerHTML = characters.map(character => `
      <button class="character-row ${character.character_id === selectedId ? 'active' : ''}" type="button" data-id="${escapeHtml(character.character_id)}">
        <strong>${escapeHtml(character.name || character.character_id)}</strong>
        <span>${escapeHtml(character.suspended ? 'suspended' : character.kind || 'character')}</span>
      </button>
    `).join('');
  }

  function renderTranscript() {
    if (!selectedId) {
      els.transcript.innerHTML = '<div class="side-empty">Pick a character to start chatting.</div>';
      return;
    }
    const state = loadState(selectedId);
    if (!state.messages.length) {
      els.transcript.innerHTML = '<div class="side-empty">No local chat history for this character.</div>';
      return;
    }
    els.transcript.innerHTML = state.messages.map(message => `
      <div class="message ${message.role === 'user' ? 'user' : 'character'}">${escapeHtml(message.text)}</div>
    `).join('');
    els.transcript.scrollTop = els.transcript.scrollHeight;
  }

  function setStatus(text, ok = true) {
    els.status.textContent = `${ok ? '●' : '○'} ${text}`;
    els.status.style.color = ok ? 'var(--bl-ok)' : 'var(--bl-error)';
  }

  async function connect(server) {
    base = BunnylandApi.normalizeBase(server);
    BunnylandApi.setServerInUrl(base);
    clientId = BunnylandPlay.persistentClientId(CLIENT_ID_KEY, 'character-chat');
    const status = await BunnylandApi.sendJson(base, '/world/chat/status');
    if (!status.enabled) throw new Error('character chat is disabled');
    const list = await BunnylandApi.sendJson(base, '/world/characters');
    characters = list.characters || [];
    selectedId = selectedId || characters[0]?.character_id || '';
    renderCharacters();
    renderTranscript();
    setStatus(`Connected · tools: ${(status.allowed_tools || []).join(', ') || 'none'}`);
    els.line.textContent = selectedId ? `Chatting with ${currentName()}.` : 'No characters available.';
  }

  async function send(message) {
    if (!base || !selectedId) return;
    const state = loadState(selectedId);
    const payload = {
      client_id: clientId,
      message,
      history_summary: state.summary || '',
      history: state.messages.slice(-HISTORY_LIMIT),
    };
    state.messages = [...state.messages, { role: 'user', text: message }].slice(-HISTORY_LIMIT);
    saveState(selectedId, state);
    renderTranscript();
    els.line.textContent = 'Waiting for reply...';
    const response = await BunnylandApi.sendJson(
      base,
      `/world/character/${encodeURIComponent(selectedId)}/chat`,
      { method: 'POST', body: JSON.stringify(payload) },
    );
    const next = loadState(selectedId);
    next.messages = [...next.messages, { role: 'character', text: response.reply || '' }].slice(-HISTORY_LIMIT);
    saveState(selectedId, next);
    renderTranscript();
    const action = response.action || {};
    els.line.textContent = action.tool ? `${action.tool}: ${action.status}${action.reason ? ` · ${action.reason}` : ''}` : 'Reply received.';
  }

  els.connect.addEventListener('click', () => {
    connect(els.apiUrl.value.trim()).catch(err => {
      setStatus(err.message, false);
      els.line.textContent = err.message;
    });
  });
  els.list.addEventListener('click', event => {
    const row = event.target.closest('.character-row');
    if (!row) return;
    selectedId = row.dataset.id || '';
    renderCharacters();
    renderTranscript();
    els.line.textContent = selectedId ? `Chatting with ${currentName()}.` : 'Pick a character.';
  });
  els.form.addEventListener('submit', event => {
    event.preventDefault();
    const message = els.input.value.trim();
    if (!message) return;
    els.input.value = '';
    send(message).catch(err => {
      els.line.textContent = err.message;
      setStatus(err.message, false);
    });
  });

  BunnylandUI.initTheme();
  BunnylandUI.initClientMenu();
  BunnylandApi.applyConfigToInput({ connect });
  BunnylandApi.applyServerParam({ connect });
})();
</script>
</body>
</html>
