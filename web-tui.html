<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Web TUI</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <style>
    #api-url { width: 190px; }
    #player-select, #claim-fallback, #claim-timeout, #btn-release-character { font-size: var(--bl-text-sm); }
    #claim-timeout { width: 56px; }

    #main {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr);
      background: var(--bl-bg-deep);
    }

    #world-pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(120px, auto) auto minmax(72px, auto) auto minmax(72px, auto) auto minmax(96px, 1fr);
      border-right: 1px solid var(--bl-border);
      overflow: hidden;
    }

    #actions-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bl-bg-strong);
    }

    .pane-title {
      padding: 7px 12px;
      border-bottom: 1px solid var(--bl-border);
      color: var(--bl-accent);
      font-size: var(--bl-text-md);
      font-weight: bold;
    }
    #doors-title, #inventory-title, #activity-title, #queued-title { border-top: 1px solid var(--bl-border); }

    .option-list {
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-surface);
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
      text-align: left;
    }
    button.option { width: 100%; cursor: pointer; }
    button.option:hover:not(:disabled) { background: var(--bl-surface-hover); border-color: var(--bl-accent); }
    .option:disabled, .option.disabled { opacity: 0.45; cursor: default; }
    .option.unavailable {
      opacity: 0.58;
      background: var(--bl-bg-subtle);
      border-color: var(--bl-border-muted);
    }
    .option.unavailable .option-main { color: var(--bl-text-muted); }
    .option-main {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .option-meta {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      white-space: nowrap;
    }
    .option.selected { border-color: var(--bl-accent); background: var(--bl-bg-subtle); }
    .activity-row {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 5px 8px;
      border-left: 2px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
      line-height: 1.35;
      white-space: normal;
    }
    .activity-row.kind-system { color: var(--bl-text); }
    .activity-row.kind-rejection {
      border-left-color: var(--bl-warn);
      color: var(--bl-text);
    }
    .empty {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
      line-height: 1.45;
      padding: 4px;
    }

    #action-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--bl-border);
    }
    #points-line {
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }
    #points-line .point.ap { color: var(--bl-warn); }
    #points-line .point.fp { color: var(--bl-info); }
    #points-line .point-pip.zero { color: var(--bl-text-dim); }
    #target-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }
    #target-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #action-filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      align-items: center;
    }
    #action-filter { width: 100%; min-width: 0; }
    .icon-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      white-space: nowrap;
    }
    .action-icon { margin-right: 6px; }

    #verbs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .action-section-title {
      margin: 10px 0 6px;
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .action-section-title:first-child { margin-top: 0; }
    .verb-list { display: flex; flex-direction: column; gap: 5px; }
    .verb-cost {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .cost {
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      padding: 0 4px;
      font-size: var(--bl-text-xs);
    }
    .cost.ap { color: var(--bl-warn); }
    .cost.fp { color: var(--bl-info); }
    .cost.free { color: var(--bl-text-dim); }
    .target-mark { color: var(--bl-text-dim); font-size: var(--bl-text-xs); }
    .unavailable-reason {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--bl-warn);
      font-size: var(--bl-text-xs);
    }

    #queued {
      max-height: 28vh;
      border-top: 1px solid var(--bl-border);
      overflow-y: auto;
      padding: 8px 12px;
    }

    #action-form-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--bl-overlay);
    }
    .form-card {
      width: min(520px, 100%);
      border: 2px solid var(--bl-accent);
      border-radius: var(--bl-radius-md);
      background: var(--bl-bg-strong);
      box-shadow: var(--bl-shadow-popover);
    }
    .form-title {
      padding: 10px 12px;
      border-bottom: 1px solid var(--bl-border);
      color: var(--bl-text);
      font-weight: bold;
    }
    .form-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }
    .form-error {
      min-height: 16px;
      color: var(--bl-error);
      font-size: var(--bl-text-sm);
    }
    .form-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--bl-border);
    }

    @media (max-width: 860px) {
      #main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(340px, 45vh); }
      #world-pane { border-right: 0; border-bottom: 1px solid var(--bl-border); }
      .toolbar-row { flex-wrap: wrap; }
      .client-menu-button { margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script src="assets/bunnyland-ui.js?v=20260718-formal-v1"></script>
<script src="assets/bunnyland-api.js?v=20260718-formal-v1"></script>
<script src="assets/bunnyland-play.js?v=20260718-formal-v1"></script>
<script type="module" src="/src/web-tui/app.tsx"></script>
</body>
</html>
