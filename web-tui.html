<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Web TUI</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #api-url { width: 190px; }
    #player-select, #claim-fallback, #claim-timeout, #btn-release-character { font-size: var(--bl-text-sm); }
    #claim-timeout { width: 56px; }

    #main {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr);
      background: var(--bl-bg-deep);
    }

    #world-pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(120px, auto) auto minmax(72px, auto) auto minmax(72px, auto) auto minmax(96px, 1fr);
      border-right: 1px solid var(--bl-border);
      overflow: hidden;
    }

    #actions-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bl-bg-strong);
    }

    .pane-title {
      padding: 7px 12px;
      border-bottom: 1px solid var(--bl-border);
      color: var(--bl-accent);
      font-size: var(--bl-text-md);
      font-weight: bold;
    }
    #doors-title, #inventory-title, #activity-title, #queued-title { border-top: 1px solid var(--bl-border); }

    .option-list {
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-surface);
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
      text-align: left;
    }
    button.option { width: 100%; cursor: pointer; }
    button.option:hover:not(:disabled) { background: var(--bl-surface-hover); border-color: var(--bl-accent); }
    .option:disabled, .option.disabled { opacity: 0.45; cursor: default; }
    .option.unavailable {
      opacity: 0.58;
      background: var(--bl-bg-subtle);
      border-color: var(--bl-border-muted);
    }
    .option.unavailable .option-main { color: var(--bl-text-muted); }
    .option-main {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .option-meta {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      white-space: nowrap;
    }
    .option.selected { border-color: var(--bl-accent); background: var(--bl-bg-subtle); }
    .activity-row {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 5px 8px;
      border-left: 2px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text);
      font-size: var(--bl-text-sm);
      line-height: 1.35;
      white-space: normal;
    }
    .activity-row.kind-system { color: var(--bl-text); }
    .activity-row.kind-rejection {
      border-left-color: var(--bl-warn);
      color: var(--bl-text);
    }
    .empty {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
      line-height: 1.45;
      padding: 4px;
    }

    #action-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--bl-border);
    }
    #points-line {
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }
    #points-line .point.ap { color: var(--bl-warn); }
    #points-line .point.fp { color: var(--bl-info); }
    #points-line .point-pip.zero { color: var(--bl-text-dim); }
    #target-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }
    #target-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #action-filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      align-items: center;
    }
    #action-filter { width: 100%; min-width: 0; }
    .icon-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      white-space: nowrap;
    }
    .action-icon { margin-right: 6px; }

    #verbs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .action-section-title {
      margin: 10px 0 6px;
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .action-section-title:first-child { margin-top: 0; }
    .verb-list { display: flex; flex-direction: column; gap: 5px; }
    .verb-cost {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .cost {
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      padding: 0 4px;
      font-size: var(--bl-text-xs);
    }
    .cost.ap { color: var(--bl-warn); }
    .cost.fp { color: var(--bl-info); }
    .cost.free { color: var(--bl-text-dim); }
    .target-mark { color: var(--bl-text-dim); font-size: var(--bl-text-xs); }
    .unavailable-reason {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--bl-warn);
      font-size: var(--bl-text-xs);
    }

    #queued {
      max-height: 28vh;
      border-top: 1px solid var(--bl-border);
      overflow-y: auto;
      padding: 8px 12px;
    }

    #action-form-overlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--bl-overlay);
    }
    .form-card {
      width: min(520px, 100%);
      border: 2px solid var(--bl-accent);
      border-radius: var(--bl-radius-md);
      background: var(--bl-bg-strong);
      box-shadow: var(--bl-shadow-popover);
    }
    .form-title {
      padding: 10px 12px;
      border-bottom: 1px solid var(--bl-border);
      color: var(--bl-text);
      font-weight: bold;
    }
    .form-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }
    .form-error {
      min-height: 16px;
      color: var(--bl-error);
      font-size: var(--bl-text-sm);
    }
    .form-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--bl-border);
    }

    @media (max-width: 860px) {
      #main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(340px, 45vh); }
      #world-pane { border-right: 0; border-bottom: 1px solid var(--bl-border); }
      .toolbar-row { flex-wrap: wrap; }
      .client-menu-button { margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-row" id="toolbar-row1">
    <span class="toolbar-brand"><img src="favicon.png" alt=""> Bunnyland Web TUI</span>
    <span class="toolbar-sep">|</span>
    <label for="api-url">Server:</label>
    <input type="text" id="api-url" value="/api/" spellcheck="false">
    <button id="btn-connect">Connect Live</button>
    <span id="api-status">○ Offline</span>
    <button id="btn-client-menu" class="client-menu-button" type="button">Menu</button>
    <button id="btn-help" type="button" title="Help — controls &amp; commands (press ?)" aria-label="Help">?</button>
  </div>
  <div class="toolbar-row" id="toolbar-row2">
    <label for="player-select">Character:</label>
    <select id="player-select"><option value="">— select to play —</option></select>
    <button id="btn-release-character" type="button" disabled>Release</button>
    <button id="btn-request-image" type="button" title="Request an image of your current scene">📷 Image</button>
    <button id="btn-open-sheet" type="button" title="Open the selected or current character sheet">▣ Sheet</button>
    <label for="claim-fallback">Fallback:</label>
    <select id="claim-fallback">
      <option value="suspend">Suspend</option>
      <option value="llm">LLM</option>
    </select>
    <label for="claim-timeout">Timeout:</label>
    <input type="number" id="claim-timeout" min="5" max="60" step="1" value="30">
  </div>
</div>

<div id="main" class="app-grid">
  <section id="world-pane" aria-label="World view">
    <div id="room-title" class="pane-title">Room</div>
    <div id="members" class="option-list"></div>
    <div id="doors-title" class="pane-title">Doors</div>
    <div id="doors" class="option-list"></div>
    <div id="inventory-title" class="pane-title">Inventory</div>
    <div id="inventory" class="option-list"></div>
    <div id="activity-title" class="pane-title">Activity</div>
    <div id="activity" class="option-list"></div>
  </section>
  <aside id="actions-pane" aria-label="Actions">
    <div id="action-controls">
      <div id="points-line">Select a character to play as and see their actions.</div>
      <div id="target-line">
        <span id="target-label">Target: none</span>
        <button id="btn-clear-target" type="button" title="Clear the selected action target" disabled>Clear Target</button>
      </div>
      <div id="action-filter-row">
        <input id="action-filter" type="text" placeholder="Search actions" spellcheck="false">
        <button id="action-filter-clear" type="button">Clear</button>
        <label class="icon-toggle" title="Show action and activity icons">
          <input id="show-action-icons" type="checkbox" checked> Icons
        </label>
      </div>
    </div>
    <div id="verbs"></div>
    <div id="queued"></div>
  </aside>
</div>

<script src="assets/bunnyland-ui.js?v=20260624-admin-tools"></script>
<script src="assets/bunnyland-api.js"></script>
<script src="assets/bunnyland-play.js"></script>
<script>
'use strict';

BunnylandUI.initClientMenu();

const {
  actionIcon,
  actionArguments,
  actionAvailable,
  actionCommandType,
  actionCost,
  actionFields,
  actionLane,
  actionTitle,
  actionUnavailableReason,
  allTargets,
  cancelQueuedCommand,
  claimWebController,
  claimSettings,
  controlFromResponse,
  drainNarratedEvents,
  entityIcon,
  fetchCharacterList,
  fetchCharacterProjection,
  fetchQueuedCommands,
  fetchRecentEvents,
  filterActions,
  formatPoints,
  characterSheetHref,
  iconPreference,
  imageRequestMessage,
  inventoryEntries,
  latestImageCompletion,
  latestImageFailure,
  IMAGE_AFFORDANCE,
  persistentClientId,
  playerControl,
  queuedCommandLabel,
  queuedCountdownSeconds,
  setIconPreference,
  submitCommand,
  updateWebControllerFallback,
} = BunnylandPlay;

BunnylandUI.initHelp({
  title: 'Bunnyland Web TUI — controls',
  intro: 'The Web TUI is a list-based client: rooms, exits, characters and your inventory '
    + 'are shown as lists you click to act on.',
  sections: [
    {
      title: 'Playing',
      items: [
        { label: 'Pick a character', desc: 'Choose one from the Character selector, then act as them. Release hands it back.', key: 'Character' },
      ],
    },
    {
      title: 'Acting',
      items: [
        { label: 'Actions', desc: 'Each verb shows its AP / FP cost; click one and fill in any target or text it needs.' },
        { label: 'Change rooms', desc: 'Click an exit in the Doors list to move (or queue) through it.' },
        { label: 'Inventory', desc: "Lists what you're carrying; click an item to select it as a verb's target." },
        { label: 'Clear target', desc: 'Clear Target removes the selected room or inventory target without releasing your character.', key: 'Clear Target' },
        { label: 'Queued actions', desc: 'Actions you cannot afford yet run on the next tick. Click one to cancel it.' },
      ],
    },
    {
      title: 'Scene image',
      items: [
        { label: 'Request an image', desc: "Generate an image of your character's current scene.", key: `${IMAGE_AFFORDANCE.REQUEST_EMOJI} Image` },
        { label: 'When it is ready', desc: `${IMAGE_AFFORDANCE.DELIVER_EMOJI} a link appears in the activity log. ${IMAGE_AFFORDANCE.FAIL_EMOJI} shows there if it fails.` },
      ],
    },
    {
      title: 'More',
      items: [
        { label: 'Character sheet', desc: "Open the selected (or your own) character's sheet.", key: '▣ Sheet' },
        { label: 'Switch clients / theme', desc: 'The client menu lists every client and editor and sets the theme.', key: 'Menu' },
      ],
    },
  ],
});

const POLL_INTERVAL_MS = 2000;
const ACTIVITY_LIMIT = 8;
const CLIENT_ID_KEY = 'bunnyland.webTui.clientId';
const ICON_PREF_KEY = 'bunnyland.webTui.showIcons';

class WebTui {
  constructor() {
    this.apiBase = null;
    this.connected = false;
    this.characters = [];
    this.playerId = '';
    this.projection = null;
    this.queuedCommands = [];
    this.queueProjection = null;
    this.control = null;
    this.selectedId = '';
    this.actionFilter = '';
    this.showActionIcons = iconPreference(ICON_PREF_KEY, true);
    this.activityLines = [];
    this.seenEventIds = new Set();
    this.eventsPrimed = false;
    this.clientId = persistentClientId(CLIENT_ID_KEY, 'web-tui');
    this._pollTimer = null;

    this._bindUi();
    this.render();
    this._restoreServerParam();
    this._loadConfig();
  }

  _bindUi() {
    document.getElementById('btn-connect').addEventListener('click', () => {
      if (this.connected) this.disconnect();
      else this.connect(document.getElementById('api-url').value.trim());
    });
    document.getElementById('player-select').addEventListener('change', (e) => {
      if (e.target.value) this.selectPlayer(e.target.value);
      else this._dropPlayer();
    });
    document.getElementById('btn-release-character').addEventListener('click', async () => {
      if (this.playerId && !this._playerControl()) {
        this.control = await this._claimPlayer(this.playerId);
        await this.refresh();
      } else {
        this._dropPlayer();
      }
    });
    document.getElementById('btn-request-image').addEventListener('click', () => this._requestImage());
    document.getElementById('btn-open-sheet').addEventListener('click', () => this._openSheet());
    document.getElementById('btn-clear-target').addEventListener('click', () => this._clearTarget());
    document.getElementById('claim-fallback').addEventListener('change', () => this._updateClaimFallback());
    document.getElementById('claim-timeout').addEventListener('change', () => this._updateClaimFallback());
    document.getElementById('action-filter').addEventListener('input', (e) => {
      this.actionFilter = e.target.value.trim();
      this._renderActions();
    });
    document.getElementById('action-filter-clear').addEventListener('click', () => {
      this.actionFilter = '';
      document.getElementById('action-filter').value = '';
      this._renderActions();
    });
    document.getElementById('show-action-icons').addEventListener('change', (e) => {
      this.showActionIcons = e.target.checked;
      setIconPreference(ICON_PREF_KEY, this.showActionIcons);
      this.render();
    });
  }

  _restoreServerParam() {
    BunnylandApi.applyServerParam({ connect: (server) => this.connect(server) });
  }

  async _loadConfig() {
    await BunnylandApi.applyConfigToInput({
      isConnected: () => this.connected,
      connect: (server) => this.connect(server),
    });
  }

  connect(url) {
    if (!url) return;
    this.disconnect();
    this.apiBase = BunnylandApi.normalizeBase(url);
    this.connected = true;
    this._setStatus('live', '● Connected');
    document.getElementById('btn-connect').textContent = 'Disconnect';
    BunnylandApi.setServerInUrl(this.apiBase);
    this.refresh();
    this._pollTimer = setInterval(() => this.refresh(), POLL_INTERVAL_MS);
  }

  disconnect() {
    clearInterval(this._pollTimer);
    this._pollTimer = null;
    this.connected = false;
    this.characters = [];
    this.playerId = '';
    this.projection = null;
    this.queuedCommands = [];
    this.queueProjection = null;
    this.control = null;
    this.selectedId = '';
    this.activityLines = [];
    this.seenEventIds = new Set();
    this.eventsPrimed = false;
    this._setStatus('', '○ Offline');
    document.getElementById('btn-connect').textContent = 'Connect Live';
    document.getElementById('player-select').innerHTML = '<option value="">— select to play —</option>';
    document.getElementById('btn-release-character').disabled = true;
    if (this.apiBase) BunnylandApi.setServerInUrl('');
    this.render();
  }

  async refresh() {
    if (!this.connected || !this.apiBase) return;
    try {
      const list = await fetchCharacterList(this.apiBase);
      this.characters = list.characters || [];
      if (this.playerId && !this.characters.some(c => c.id === this.playerId)) this._dropPlayer();
      if (this.playerId) {
        this.projection = await fetchCharacterProjection(this.apiBase, this.playerId);
        const queued = await fetchQueuedCommands(this.apiBase, this.playerId);
        this.queuedCommands = queued?.commands || [];
        this.queueProjection = queued?.characterId === this.playerId ? queued : null;
        if (!this._playerControl()) this.control = null;
      }
      const events = await fetchRecentEvents(this.apiBase);
      this._drainEvents(events.events || [], { prime: !this.eventsPrimed });
      this.eventsPrimed = true;
      this._setStatus('live', `● Connected · epoch ${this.projection?.worldEpoch || list.epoch || 0}s`);
      this.render();
    } catch (err) {
      this._setStatus('err', `⚠ ${err.message || err}`);
    }
  }

  async selectPlayer(id) {
    this.playerId = id;
    this.selectedId = '';
    this.projection = null;
    this.queuedCommands = [];
    this.queueProjection = null;
    this.control = await this._claimPlayer(id);
    await this.refresh();
  }

  _dropPlayer() {
    this.playerId = '';
    this.projection = null;
    this.queuedCommands = [];
    this.queueProjection = null;
    this.control = null;
    this.selectedId = '';
    document.getElementById('player-select').value = '';
    document.getElementById('btn-release-character').disabled = true;
    this.render();
  }

  async _claimPlayer(characterId) {
    if (!this.apiBase || !characterId) return null;
    const data = await claimWebController(this.apiBase, {
      ...claimSettings(),
      character_id: characterId,
      client_id: this.clientId,
      label: 'web-tui',
    });
    return controlFromResponse(data, characterId);
  }

  async _updateClaimFallback() {
    if (!this.apiBase || !this.playerId || !this.control) return;
    try {
      const data = await updateWebControllerFallback(this.apiBase, {
        ...claimSettings(),
        character_id: this.playerId,
        client_id: this.clientId,
      });
      this.control = controlFromResponse(data, this.playerId);
    } catch (err) {
      this._setStatus('err', `⚠ ${err.message || err}`);
    }
  }

  _playerControl() {
    return playerControl(this.control, this.projection, this.playerId);
  }

  _setStatus(kind, text) {
    const status = document.getElementById('api-status');
    status.className = kind;
    status.textContent = text;
  }

  _currentRoom() {
    return this.projection?.room || null;
  }

  _roomOf(entityId) {
    return entityId && entityId === this.playerId ? this.projection?.room?.id || null : null;
  }

  _nameFor(entityId) {
    if (entityId === this.playerId) return this.characters.find(c => c.id === entityId)?.name || entityId;
    const target = this._allTargets().find(item => item.value === entityId);
    return target?.label || this.characters.find(c => c.id === entityId)?.name || null;
  }

  _allTargets() {
    return allTargets(this.projection);
  }

  _drainEvents(messages, { prime = false } = {}) {
    const drained = drainNarratedEvents(messages, {
      seenIds: this.seenEventIds,
      playerId: this.playerId,
      roomOf: (id) => this._roomOf(id),
      nameFor: (id) => this._nameFor(id),
    });
    this.seenEventIds = drained.seenIds;
    const image = latestImageCompletion(messages, { base: this.apiBase, purpose: 'event' });
    if (image && image.url !== this._eventImageUrl) {
      this._eventImageUrl = image.url;
      if (!prime) {
        this.activityLines.push({
          text: `${IMAGE_AFFORDANCE.DELIVER_EMOJI} scene image ready: ${image.url}`,
          kind: 'system',
        });
      }
    }
    const failure = latestImageFailure(messages, { purpose: 'event' });
    if (failure && failure.epoch !== this._eventImageFailureEpoch) {
      this._eventImageFailureEpoch = failure.epoch;
      if (!prime) {
        this.activityLines.push({
          text: `${IMAGE_AFFORDANCE.FAIL_EMOJI} image request failed: ${failure.reason}`,
          kind: 'rejection',
        });
      }
    }
    if (prime) return;
    this.activityLines.push(...drained.lines);
    this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
  }

  _availableActions() {
    return this.projection?.actions?.length ? this.projection.actions : [];
  }

  _filteredActions() {
    const query = this.actionFilter.trim().toLowerCase();
    return filterActions(this._availableActions(), query);
  }

  _targetCandidates(group) {
    return this.projection?.targetGroups?.[group] || [];
  }

  _actionFields(action) {
    return actionFields(action, group => this._targetCandidates(group));
  }

  async _doAction(action) {
    if (!this.playerId || !this.control || !action) return;
    const fields = this._actionFields(action);
    const payload = fields.length ? await this._actionForm(action, fields) : {};
    if (payload == null) return;
    const cost = actionCost(action);
    const result = await submitCommand(this.apiBase, {
      character_id: this.playerId,
      controller_id: this.control.controllerId,
      controller_generation: this.control.generation,
      command_type: actionCommandType(action),
      payload,
      cost,
      lane: actionLane(action),
      on_insufficient_points: 'queue',
    });
    if (result?.queued === false) {
      this.activityLines.push({ text: result.reason || 'Command rejected.', kind: 'rejection' });
      this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
    }
    await this.refresh();
  }

  async _requestImage() {
    if (!this.apiBase || !this.playerId) {
      this.activityLines.push({ text: 'Select a character before requesting an image.', kind: 'system' });
    } else {
      try {
        const result = await BunnylandApi.requestSceneImage(this.apiBase, this.playerId);
        this.activityLines.push({ text: imageRequestMessage(result), kind: 'system' });
      } catch (err) {
        this.activityLines.push({ text: `${IMAGE_AFFORDANCE.REQUEST_EMOJI} ${err.message || err}`, kind: 'rejection' });
      }
    }
    this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
    await this.refresh();
  }

  _openSheet() {
    if (!this.apiBase || !this.playerId) {
      this.activityLines.push({ text: 'Select a character before opening a sheet.', kind: 'system' });
      this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
      this.render();
      return;
    }
    let characterId = this.playerId;
    if (this.selectedId && this.selectedId !== this.playerId) {
      const selected = (this.projection?.room?.entities || []).find(entity => entity.id === this.selectedId);
      if (!selected || !(selected.is_character || selected.kind === 'character')) {
        this.activityLines.push({ text: 'Select a visible character or clear the target.', kind: 'rejection' });
        this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
        this.render();
        return;
      }
      characterId = this.selectedId;
    }
    const href = characterSheetHref(this.apiBase, characterId);
    const opened = window.open(href, '_blank', 'noopener');
    this.activityLines.push({ text: opened ? `Opened sheet: ${href}` : `Sheet URL: ${href}`, kind: 'system' });
    this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
    this.render();
  }

  _clearTarget() {
    if (!this.selectedId) return;
    this.selectedId = '';
    this.render();
  }

  async _moveThroughExit(exit) {
    if (!exit || !this.playerId || !this.control) return;
    const action = this._availableActions().find(item =>
      actionArguments(item).some(arg => arg.target_group === 'exits'));
    const exitArg = action ? actionArguments(action).find(arg => arg.target_group === 'exits') : null;
    if (!action || !exitArg) return;
    const cost = actionCost(action);
    const result = await submitCommand(this.apiBase, {
      character_id: this.playerId,
      controller_id: this.control.controllerId,
      controller_generation: this.control.generation,
      command_type: actionCommandType(action),
      payload: { [exitArg.key]: exit.id },
      cost,
      lane: actionLane(action),
      on_insufficient_points: 'queue',
    });
    if (result?.queued === false) {
      this.activityLines.push({ text: result.reason || 'Command rejected.', kind: 'rejection' });
      this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
    }
    await this.refresh();
  }

  async _cancelQueuedCommand(commandId) {
    if (!this.playerId || !this.control || !commandId) return;
    try {
      const result = await cancelQueuedCommand(this.apiBase, this.playerId, commandId, this.control);
      if (!result?.cancelled) {
        this.activityLines.push({ text: result?.reason || 'Could not cancel queued command.', kind: 'rejection' });
        this.activityLines = this.activityLines.slice(-ACTIVITY_LIMIT);
      }
      await this.refresh();
    } catch (err) {
      this._setStatus('err', `⚠ ${err.message || err}`);
    }
  }

  _actionForm(action, fields) {
    return new Promise((resolve) => {
      if (document.getElementById('action-form-overlay')) { resolve(null); return; }
      const esc = BunnylandUI.escapeHtml;
      const overlay = document.createElement('div');
      overlay.id = 'action-form-overlay';
      const fieldHtml = fields.map((field, index) => {
        const label = `${esc(field.label)}${field.required ? ' *' : ''}`;
        let control;
        if (field.candidates) {
          const options = ['<option value="">— choose —</option>'].concat(
            field.candidates.map(c => {
              const selected = c.value === this.selectedId ? ' selected' : '';
              return `<option value="${esc(c.value)}"${selected}>${esc(c.icon)} ${esc(c.label)}</option>`;
            })
          );
          control = `<select class="form-input" data-index="${index}">${options.join('')}</select>`;
        } else if (field.kind === 'boolean') {
          control = `<select class="form-input" data-index="${index}"><option value="">— choose —</option><option value="true">yes</option><option value="false">no</option></select>`;
        } else {
          control = `<input class="form-input" data-index="${index}" type="${field.kind === 'number' ? 'number' : 'text'}">`;
        }
        return `<label class="form-field"><span>${label}</span>${control}</label>`;
      }).join('');
      overlay.innerHTML = `<div class="form-card">` +
        `<div class="form-title">${esc(actionTitle(action))}</div>` +
        `<div class="form-body">${fieldHtml}<div class="form-error"></div></div>` +
        `<div class="form-buttons"><button class="form-cancel" type="button">Cancel</button><button class="form-submit" type="button">Submit</button></div>` +
        `</div>`;

      const close = (value) => {
        document.removeEventListener('keydown', onKey);
        overlay.remove();
        resolve(value);
      };
      const submit = () => {
        const payload = {};
        for (let i = 0; i < fields.length; i++) {
          const raw = overlay.querySelector(`.form-input[data-index="${i}"]`)?.value.trim() || '';
          if (fields[i].required && !raw) {
            overlay.querySelector('.form-error').textContent = `${fields[i].label} is required.`;
            return;
          }
          if (raw) payload[fields[i].key] = raw;
        }
        close(payload);
      };
      const onKey = (event) => {
        if (event.key === 'Escape') close(null);
        else if (event.key === 'Enter' && event.target.classList.contains('form-input')) submit();
      };

      overlay.addEventListener('click', (event) => { if (event.target === overlay) close(null); });
      overlay.querySelector('.form-cancel').addEventListener('click', () => close(null));
      overlay.querySelector('.form-submit').addEventListener('click', submit);
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
      overlay.querySelector('.form-input')?.focus();
    });
  }

  render() {
    this._syncPlayers();
    this._renderWorld();
    this._renderActions();
  }

  _syncPlayers() {
    const select = document.getElementById('player-select');
    select.innerHTML = '<option value="">— select to play —</option>' + this.characters
      .map(c => `<option value="${BunnylandUI.escapeHtml(c.id)}">${BunnylandUI.escapeHtml(c.name)}</option>`)
      .join('');
    select.value = this.playerId || '';
    const release = document.getElementById('btn-release-character');
    release.disabled = !this.playerId;
    release.textContent = this.playerId && !this._playerControl() ? 'Claim' : 'Release';
    this._syncSelectionControls();
  }

  _syncSelectionControls() {
    const label = this.selectedId ? this._nameFor(this.selectedId) || this.selectedId : 'none';
    document.getElementById('target-label').textContent = `Target: ${label}`;
    document.getElementById('btn-clear-target').disabled = !this.selectedId;
  }

  _renderWorld() {
    const esc = BunnylandUI.escapeHtml;
    const room = this._currentRoom();
    document.getElementById('room-title').textContent = room?.title || 'Room';

    const members = room?.entities || [];
    document.getElementById('members').innerHTML = members.length ? members
      .filter(entity => entity.kind !== 'room')
      .map(entity => {
        const selected = entity.id === this.selectedId ? ' selected' : '';
        const me = entity.id === this.playerId ? ' ← you' : '';
        return `<button class="option${selected}" type="button" data-entity="${esc(entity.id)}">` +
          `<span class="option-main">${esc(entityIcon(entity))} ${esc(entity.name || entity.id)}${me}</span>` +
          `<span class="option-meta">${esc(entity.kind || '')}</span></button>`;
      }).join('') : '<div class="empty">Select a character above to play as and see their room.</div>';

    document.querySelectorAll('#members .option[data-entity]').forEach(button => {
      button.addEventListener('click', () => {
        this.selectedId = button.dataset.entity;
        this._renderWorld();
      });
    });

    const exits = room?.exits || [];
    document.getElementById('doors').innerHTML = exits.length ? exits
      .map((exit, index) => `<button class="option" type="button" data-exit-index="${index}"><span class="option-main">🚪 ${esc(exit.direction || exit.label || exit.id)}</span><span class="option-meta">${exit.locked ? 'locked' : ''}</span></button>`)
      .join('') : '<div class="empty">No visible exits.</div>';
    document.querySelectorAll('#doors .option[data-exit-index]').forEach(button => {
      button.addEventListener('click', () => this._moveThroughExit(exits[Number(button.dataset.exitIndex)]));
    });

    const carried = inventoryEntries(this.projection);
    document.getElementById('inventory').innerHTML = carried.length ? carried
      .map(item => {
        const selected = item.id === this.selectedId ? ' selected' : '';
        return `<button class="option${selected}" type="button" data-entity="${esc(item.id)}">` +
        `<span class="option-main">${esc(item.icon)} ${esc(item.label)}</span>` +
        `<span class="option-meta">${esc(item.kind)}</span></button>`;
      })
      .join('') : `<div class="empty">${this.playerId ? 'Nothing carried.' : 'Select a character above.'}</div>`;
    document.querySelectorAll('#inventory .option[data-entity]').forEach(button => {
      button.addEventListener('click', () => {
        this.selectedId = button.dataset.entity;
        this._renderWorld();
      });
    });

    document.getElementById('activity').innerHTML = this.activityLines.length ? this.activityLines
      .map(line => {
        const icon = this.showActionIcons && line.icon
          ? `<span class="action-icon">${esc(line.icon)}</span>`
          : '';
        return `<div class="activity-row ${line.kind ? `kind-${esc(line.kind)}` : ''}">${icon}${esc(line.text)}</div>`;
      })
      .join('') : '<div class="empty">No recent activity.</div>';
    this._syncSelectionControls();
  }

  _renderActions() {
    const pts = this.projection?.points || {};
    const hasPlayer = Boolean(this.playerId && this.projection);
    const ap = Number(pts.action || 0);
    const fp = Number(pts.focus || 0);
    document.getElementById('points-line').innerHTML = hasPlayer
      ? `<span class="point ap"><span class="point-pip${ap > 0 ? '' : ' zero'}">⚡</span> ${formatPoints(pts.action)} / ${formatPoints(pts.action_max)} AP</span>   ` +
        `<span class="point fp"><span class="point-pip${fp > 0 ? '' : ' zero'}">🔹</span> ${formatPoints(pts.focus)} / ${formatPoints(pts.focus_max)} FP</span>`
      : 'Select a character to play as and see their actions.';

    const esc = BunnylandUI.escapeHtml;
    const actions = this._filteredActions();
    document.getElementById('show-action-icons').checked = this.showActionIcons;
    const html = [['Room actions', 'world'], ['Focus actions', 'focus']].map(([title, lane]) => {
      const rows = actions.map((action, index) => ({ action, index }))
        .filter(item => actionLane(item.action) === lane)
        .map(item => this._verbRowHtml(item.action, item.index, hasPlayer, pts, esc))
        .join('');
      return `<div class="action-section-title">${title}</div><div class="verb-list">${rows || '<div class="empty">No matching actions.</div>'}</div>`;
    }).join('');
    document.getElementById('verbs').innerHTML = html;
    document.querySelectorAll('#verbs .option[data-action-index]').forEach(button => {
      const action = actions[Number(button.dataset.actionIndex)];
      button.addEventListener('click', () => this._doAction(action));
    });

    const countdown = queuedCountdownSeconds(this.queueProjection);
    document.getElementById('queued').innerHTML = `<div class="action-section-title">Queued actions${countdown == null ? '' : ` · next tick in ${countdown}s`}</div>` +
      (this.queuedCommands.length
        ? this.queuedCommands.map(command => `<button class="option" type="button" data-cancel-command="${esc(command.command_id || '')}" title="Cancel queued action"><span class="option-main">${esc(queuedCommandLabel(command, this._availableActions()))}</span><span class="option-meta">cancel</span></button>`).join('')
        : '<div class="empty">No queued actions.</div>');
    document.querySelectorAll('#queued .option[data-cancel-command]').forEach(button => {
      button.addEventListener('click', () => this._cancelQueuedCommand(button.dataset.cancelCommand));
    });
  }

  _verbRowHtml(action, index, hasPlayer, pts, esc) {
    const cost = actionCost(action);
    const available = actionAvailable(action);
    const ready = hasPlayer;
    const reason = actionUnavailableReason(action);
    const costHtml = cost.action || cost.focus
      ? `${cost.action ? `<span class="cost ap">${cost.action} AP</span>` : ''}${cost.focus ? `<span class="cost fp">${cost.focus} FP</span>` : ''}`
      : '<span class="cost free">free</span>';
    const target = actionArguments(action).some(arg => arg.target_group)
      ? '<span class="target-mark">⌖ target</span>'
      : '';
    const reasonHtml = reason ? `<span class="unavailable-reason">${esc(reason)}</span>` : '';
    const icon = this.showActionIcons
      ? `<span class="action-icon">${esc(actionIcon(action))}</span>`
      : '';
    return `<button class="option${available ? '' : ' unavailable'}" type="button" ${ready ? `data-action-index="${index}"` : ''} title="${esc(reason || `Perform: ${actionTitle(action)}`)}">` +
      `<span class="option-main">${icon}${esc(actionTitle(action))}</span>` +
      `<span class="verb-cost">${target}${costHtml}${reasonHtml}</span></button>`;
  }
}

window.app = new WebTui();
</script>
</body>
</html>
