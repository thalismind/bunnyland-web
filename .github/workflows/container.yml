name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Playwright regressions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS, CSS, and HTML lint
        run: npm run lint

      - name: Run shared script unit tests
        run: |
          mkdir -p artifacts/test-results
          python -m unittest scripts/test_playwright_server.py
          npm test -- --test-reporter=junit --test-reporter-destination=artifacts/test-results/node-unit.xml

      - name: Install Playwright (pip)
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Pull server container for memory regression
        run: |
          if command -v nerdctl >/dev/null 2>&1; then
            sudo nerdctl pull ghcr.io/thalismind/bunnyland-server:main
          elif command -v docker >/dev/null 2>&1; then
            docker pull ghcr.io/thalismind/bunnyland-server:main
          else
            echo "no supported container runtime found; install nerdctl or docker" >&2
            exit 1
          fi

      - name: Run Playwright regressions
        run: scripts/playwright-all

      - name: Publish test and coverage summary
        if: always()
        run: python3 scripts/ci_report.py summary

      - name: Upload Playwright coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-coverage
          path: artifacts/playwright-coverage
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: artifacts/test-results
          if-no-files-found: warn

  container:
    name: Build container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bunnyland-web
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
