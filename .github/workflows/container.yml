name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Playwright regressions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependency graph
        run: npm audit --audit-level=moderate

      - name: Scan full history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Run type, build, lint, and unit checks
        run: |
          mkdir -p artifacts/test-results
          python -m unittest discover -s scripts -p 'test_*.py'
          npm run check

      - name: Install Playwright (pip)
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium firefox webkit
          else
            python -m playwright install --with-deps chromium firefox webkit
          fi

      - name: Run Playwright regressions
        run: scripts/playwright-all --coverage

      - name: Publish test and coverage summary
        if: always()
        run: python3 scripts/ci_report.py summary

      - name: Upload Playwright coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-coverage
          path: artifacts/playwright-coverage
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: artifacts/test-results
          if-no-files-found: warn

  container:
    name: Build container
    runs-on: ubuntu-latest
    needs: test
    outputs:
      digest: ${{ steps.web-build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bunnyland-web
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and publish container
        id: web-build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Scan exact web image
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/bunnyland-web:sha-${{ github.sha }}
          output-format: table
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          by-cve: true

  dispatch-3d-promotion:
    name: Request 3D web-base promotion
    runs-on: ubuntu-latest
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Dispatch immutable web image to 3D
        env:
          GH_TOKEN: ${{ secrets.BUNNYLAND_3D_PROMOTION_TOKEN }}
          WEB_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          test -n "$GH_TOKEN"
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --arg source_repo "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --arg digest "$WEB_DIGEST" \
            '{
              event_type: "promote-web",
              client_payload: {
                source_repo: $source_repo,
                source_ref: $source_ref,
                source_sha: $source_sha,
                digest: $digest
              }
            }' |
            gh api --method POST repos/thalismind/bunnyland-3d/dispatches --input -
