name: Release Regression

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Server container image to test against
        required: true
        default: ghcr.io/thalismind/bunnyland-server:main
      generator:
        description: World generator for the real-server multiclient run
        required: true
        default: apartment-demo

permissions:
  contents: read
  packages: read

jobs:
  web-multiclient:
    name: Web multiclient real-server regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out web repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install and build web client
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run real-server web regression
        env:
          BUNNYLAND_RELEASE_SERVER_IMAGE: ${{ inputs.server_image }}
          BUNNYLAND_RELEASE_GENERATOR: ${{ inputs.generator }}
          BUNNYLAND_RELEASE_ARTIFACT_DIR: artifacts/release-multiclient
        run: scripts/playwright-release-multiclient

      - name: Run Apple Crossing browser journeys
        env:
          BUNNYLAND_RELEASE_SERVER_IMAGE: ${{ inputs.server_image }}
          BUNNYLAND_APPLE_ARTIFACT_DIR: artifacts/apple-crossing
        run: scripts/playwright-apple-crossing

      - name: Upload release regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-multiclient-artifacts
          path: |
            artifacts/release-multiclient
            artifacts/apple-crossing
          if-no-files-found: error
