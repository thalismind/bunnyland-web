name: Release Regression

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Server container image to test against
        required: true
        default: ghcr.io/thalismind/bunnyland-server:main
      generator:
        description: World generator for the real-server multiclient run
        required: true
        default: apartment-demo

permissions:
  contents: read
  packages: read

jobs:
  web-multiclient:
    name: Web multiclient real-server regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out web repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Pull server container
        run: |
          if command -v nerdctl >/dev/null 2>&1; then
            sudo nerdctl pull "${{ inputs.server_image }}"
          elif command -v docker >/dev/null 2>&1; then
            docker pull "${{ inputs.server_image }}"
          else
            echo "no supported container runtime found; install nerdctl or docker" >&2
            exit 1
          fi

      - name: Run real-server web regression
        env:
          BUNNYLAND_RELEASE_SERVER_MODE: container
          BUNNYLAND_RELEASE_SERVER_IMAGE: ${{ inputs.server_image }}
          BUNNYLAND_RELEASE_GENERATOR: ${{ inputs.generator }}
          BUNNYLAND_RELEASE_ARTIFACT_DIR: artifacts/release-multiclient
        run: scripts/playwright-release-multiclient

      - name: Upload release regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-multiclient-artifacts
          path: artifacts/release-multiclient
          if-no-files-found: error
