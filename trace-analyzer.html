<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland Trace Analyzer</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    body {
      background: var(--bl-bg-deep);
    }

    #toolbar input[type=file] { max-width: 280px; }
    #trace-select { width: min(560px, 42vw); }
    #tempo-url { width: 150px; }
    #theme-select { width: 210px; }

    #tempo-status[data-state="ok"] { color: var(--bl-accent-strong); }
    #tempo-status[data-state="error"] { color: var(--bl-error); }

    #main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      background: var(--bl-bg-deep);
    }

    #trace-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--bl-border);
      overflow: hidden;
    }

    #trace-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #detail-pane {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      background: var(--bl-bg-strong);
      padding: 12px;
    }

    #drop-zone {
      margin: 12px;
      padding: 18px;
      border: 1px dashed var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      background: var(--bl-bg-strong);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      line-height: 1.55;
    }
    #drop-zone.active {
      border-color: var(--bl-accent);
      background: var(--bl-accent-wash);
    }

    #trace-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) repeat(4, auto);
      gap: 14px;
      align-items: end;
      padding: 14px 16px;
      border-bottom: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
    }
    .trace-title {
      min-width: 0;
      color: var(--bl-text);
      font-size: 22px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trace-subtitle {
      margin-top: 5px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .summary-stat {
      min-width: 70px;
      text-align: right;
    }
    .summary-stat strong {
      display: block;
      color: var(--bl-text);
      font-size: 18px;
      line-height: 1.15;
    }
    .summary-stat span {
      display: block;
      margin-top: 4px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    #filters {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 180px 130px auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--bl-border);
      background: var(--bl-bg);
    }
    #filters input, #filters select { width: 100%; }

    #overview {
      position: relative;
      height: 88px;
      margin: 10px 14px;
      border: 1px solid var(--bl-border-control);
      background: #050609;
      overflow: hidden;
    }
    .axis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
    }
    #overview-axis {
      padding: 0 14px 2px;
    }
    .axis span:not(:first-child) {
      border-left: 1px solid var(--bl-border-control);
      padding-left: 6px;
    }
    .overview-bar {
      position: absolute;
      height: 7px;
      min-width: 2px;
      border-radius: 2px;
      background: var(--bl-accent);
      opacity: 0.76;
    }
    .overview-bar.error { background: var(--bl-error); }
    .overview-bar.root { background: var(--bl-accent-strong); opacity: 0.9; }
    .timeline-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      pointer-events: none;
    }
    .timeline-grid span {
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }

    #span-table {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--bl-border);
      overflow: hidden;
    }
    .span-header,
    .span-row {
      display: grid;
      grid-template-columns: 360px minmax(260px, 1fr);
    }
    .span-header {
      flex-shrink: 0;
      border-bottom: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      font-weight: bold;
    }
    .span-header > div {
      padding: 8px 10px;
      border-right: 1px solid var(--bl-border);
    }
    .span-rows {
      min-height: 0;
      overflow: auto;
    }
    .span-row {
      min-height: 28px;
      border-bottom: 1px solid var(--bl-border-muted);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      cursor: pointer;
    }
    .span-row:hover {
      background: var(--bl-bg-subtle);
    }
    .span-row.selected {
      background: var(--bl-accent-wash);
    }
    .span-row.error .span-name {
      color: var(--bl-error);
    }
    .span-label {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-right: 1px solid var(--bl-border);
      overflow: hidden;
    }
    .span-service {
      color: var(--bl-text);
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .span-name {
      color: var(--bl-text-soft);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .span-count {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      white-space: nowrap;
    }
    .span-timeline {
      position: relative;
      min-width: 0;
      padding: 5px 8px;
      overflow: hidden;
    }
    .span-duration {
      position: absolute;
      top: 8px;
      height: 10px;
      min-width: 2px;
      border-radius: 2px;
      background: var(--bl-accent);
    }
    .span-duration.error {
      background: var(--bl-error);
    }
    .span-duration.root {
      background: var(--bl-accent-strong);
    }
    .duration-label {
      position: relative;
      z-index: 1;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-xs);
      text-shadow: var(--bl-shadow-text);
      white-space: nowrap;
    }

    .detail-empty {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
      line-height: 1.5;
    }
    .detail-title {
      color: var(--bl-text);
      font-size: 17px;
      font-weight: bold;
      line-height: 1.35;
    }
    .detail-meta {
      margin-top: 8px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      line-height: 1.7;
    }
    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--bl-border);
    }
    .detail-actions button {
      color: var(--bl-text-inverse);
      border-color: var(--bl-accent);
      background: var(--bl-accent-wash-strong);
    }
    .detail-section {
      margin-top: 14px;
      border-top: 1px solid var(--bl-border-muted);
      padding-top: 10px;
    }
    .detail-section h2 {
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-md);
      line-height: 1.35;
    }
    .kv-table {
      width: 100%;
      margin-top: 8px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: var(--bl-text-sm);
    }
    .kv-table th,
    .kv-table td {
      padding: 5px 6px;
      border-bottom: 1px solid var(--bl-border-muted);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    .kv-table th {
      width: 42%;
      color: var(--bl-text-muted);
      font-weight: normal;
    }
    .kv-table td {
      color: var(--bl-text-soft);
    }
    .stub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    .hidden { display: none !important; }

    @media (max-width: 980px) {
      #main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) minmax(280px, 38vh);
      }
      #trace-pane {
        border-right: 0;
        border-bottom: 1px solid var(--bl-border);
      }
      #trace-summary {
        grid-template-columns: 1fr 1fr;
      }
      #filters {
        grid-template-columns: 1fr 1fr;
      }
      .span-header,
      .span-row {
        grid-template-columns: 280px minmax(240px, 1fr);
      }
      .toolbar-row {
        flex-wrap: wrap;
      }
      #trace-select,
      #theme-select {
        width: 100%;
      }
    }

  </style>
</head>
<body class="bl-tool-page bl-page-trace-analyzer">
  <div id="app"></div>
  <script src="assets/bunnyland-ui.js?v=20260718-formal-v1"></script>
  <script src="assets/bunnyland-api.js?v=20260718-formal-v1"></script>
  <script src="assets/bunnyland-trace.js"></script>
  <script type="module" src="/src/trace-analyzer/app.tsx"></script>
</body>
</html>
