<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Character Sheet</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <style>
    #api-url { width: 220px; }
    #character-select { min-width: 180px; font-size: var(--bl-text-sm); }

    #main {
      display: grid;
      grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
      gap: 0;
      background: var(--bl-bg-deep);
    }

    #identity-pane {
      min-width: 0;
      min-height: 0;
      padding: 14px;
      border-right: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
      overflow-y: auto;
    }

    #details-pane {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
    }

    .portrait-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      overflow: hidden;
      background: var(--bl-surface);
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .portrait-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--bl-accent-strong);
      background: linear-gradient(135deg, var(--bl-bg-subtle), var(--bl-surface));
      font-size: 72px;
      font-weight: 800;
    }

    #portrait-status {
      min-height: 20px;
      margin-top: 8px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    #portrait-status.failed { color: var(--bl-warn); }

    .upload-panel {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--bl-border-muted);
    }

    .upload-row {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }

    .upload-row input {
      min-width: 0;
      width: 100%;
      font-size: var(--bl-text-xs);
    }

    .upload-row button {
      padding-left: 8px;
      padding-right: 8px;
    }

    #image-upload-status {
      min-height: 18px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
    }

    #image-upload-status.failed { color: var(--bl-warn); }

    #character-name {
      margin: 12px 0 4px;
      color: var(--bl-text);
      font-size: 28px;
      line-height: 1.1;
    }

    #character-id {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      overflow-wrap: anywhere;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .pill {
      padding: 3px 7px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-xs);
      line-height: 1.3;
    }

    #traits .pill {
      max-width: 100%;
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .identity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      padding: 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
    }

    .stat-wide { grid-column: 1 / -1; }

    .stat-label {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      margin-top: 4px;
      color: var(--bl-text);
      font-size: var(--bl-text-md);
      overflow-wrap: anywhere;
    }

    .stat-main {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .stat-icon {
      font-size: var(--bl-text-md);
      line-height: 1;
    }

    .stat-detail {
      margin-top: 2px;
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      overflow-wrap: anywhere;
    }

    .section { margin-bottom: 18px; }

    .section-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .section-title {
      margin-bottom: 8px;
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .action-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-bottom: 8px;
    }

    #action-filter {
      width: 100%;
      min-width: 0;
    }

    #action-filter-clear {
      padding-left: 8px;
      padding-right: 8px;
    }

    .sheet-list {
      display: grid;
      gap: 6px;
    }

    #actions {
      max-height: 320px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .sheet-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }

    .sheet-row strong {
      color: var(--bl-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sheet-row span {
      color: var(--bl-text-dim);
      white-space: nowrap;
    }

    .sheet-row.unavailable { opacity: 0.68; }
    .sheet-row.entry { align-items: start; }
    .sheet-row.entry strong { white-space: normal; }

    .sheet-row.entry span {
      white-space: normal;
      text-align: right;
    }

    .metric-list {
      display: grid;
      gap: 8px;
    }

    .metric-row {
      padding: 8px 10px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
    }

    .metric-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }

    .metric-label {
      color: var(--bl-text);
      font-weight: 700;
    }

    .meter {
      height: 8px;
      overflow: hidden;
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-deep);
    }

    .meter-fill {
      height: 100%;
      min-width: 2px;
      background: var(--bl-accent);
    }

    .metric-row.warning .meter-fill { background: var(--bl-warn); }
    .metric-row.urgent .meter-fill,
    .metric-row.crisis .meter-fill { background: var(--bl-error); }

    .prose {
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      line-height: 1.45;
    }

    .sheet-empty {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
      line-height: 1.45;
    }

    #status-note {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    @media (max-width: 860px) {
      #main { grid-template-columns: 1fr; }
      #identity-pane { border-right: 0; border-bottom: 1px solid var(--bl-border); }
      .toolbar-row { flex-wrap: wrap; }
      .client-menu-button { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="assets/bunnyland-ui.js?v=20260624-admin-tools"></script>
  <script src="assets/bunnyland-api.js"></script>
  <script src="assets/bunnyland-play.js?v=20260715-room-claims"></script>
  <script type="module" src="/src/character-sheet/app.tsx"></script>
</body>
</html>
