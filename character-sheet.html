<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Character Sheet</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #api-url { width: 220px; }
    #character-select { min-width: 180px; font-size: var(--bl-text-sm); }

    #main {
      display: grid;
      grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
      gap: 0;
      background: var(--bl-bg-deep);
    }

    #identity-pane {
      min-width: 0;
      min-height: 0;
      padding: 14px;
      border-right: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
      overflow-y: auto;
    }

    #details-pane {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
    }

    .portrait-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      overflow: hidden;
      background: var(--bl-surface);
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .portrait-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--bl-accent-strong);
      background: linear-gradient(135deg, var(--bl-bg-subtle), var(--bl-surface));
      font-size: 72px;
      font-weight: 800;
    }

    #portrait-status {
      min-height: 20px;
      margin-top: 8px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    #portrait-status.failed { color: var(--bl-warn); }

    #character-name {
      margin: 12px 0 4px;
      color: var(--bl-text);
      font-size: 28px;
      line-height: 1.1;
    }

    #character-id {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      overflow-wrap: anywhere;
    }

    .identity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      padding: 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
    }

    .stat-label {
      color: var(--bl-text-dim);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      margin-top: 4px;
      color: var(--bl-text);
      font-size: var(--bl-text-md);
      overflow-wrap: anywhere;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      margin-bottom: 8px;
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sheet-list {
      display: grid;
      gap: 6px;
    }

    .sheet-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }

    .sheet-row strong {
      color: var(--bl-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sheet-row span {
      color: var(--bl-text-dim);
      white-space: nowrap;
    }

    .sheet-row.unavailable {
      opacity: 0.68;
    }

    .sheet-empty {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
      line-height: 1.45;
    }

    #status-note {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
    }

    @media (max-width: 860px) {
      #main { grid-template-columns: 1fr; }
      #identity-pane { border-right: 0; border-bottom: 1px solid var(--bl-border); }
      .toolbar-row { flex-wrap: wrap; }
      .client-menu-button { margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-row">
    <span style="color: var(--bl-text);">Bunnyland Character Sheet</span>
    <span class="toolbar-sep">|</span>
    <label for="api-url">Server:</label>
    <input type="text" id="api-url" value="/api/" spellcheck="false">
    <button id="btn-connect" type="button">Connect Live</button>
    <span id="api-status">○ Offline</span>
    <span class="toolbar-sep">|</span>
    <label for="character-select">Character:</label>
    <select id="character-select"><option value="">- choose -</option></select>
    <button id="btn-client-menu" class="client-menu-button" type="button">Menu</button>
  </div>
</div>

<div id="main" class="app-grid">
  <section id="identity-pane" aria-label="Character identity">
    <div class="portrait-frame" id="portrait-frame"></div>
    <div id="portrait-status"></div>
    <h1 id="character-name">No character selected</h1>
    <div id="character-id">Connect to a server, then choose a character.</div>
    <div class="identity-grid">
      <div class="stat">
        <div class="stat-label">Controller</div>
        <div class="stat-value" id="controller-value">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Room</div>
        <div class="stat-value" id="room-value">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Action</div>
        <div class="stat-value" id="ap-value">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Focus</div>
        <div class="stat-value" id="fp-value">-</div>
      </div>
    </div>
  </section>
  <section id="details-pane" aria-label="Character details">
    <div class="section">
      <div class="section-title">Visible Characters</div>
      <div id="visible-characters" class="sheet-empty">Select a character.</div>
    </div>
    <div class="section">
      <div class="section-title">Inventory</div>
      <div id="inventory" class="sheet-empty">Select a character.</div>
    </div>
    <div class="section">
      <div class="section-title">Exits</div>
      <div id="exits" class="sheet-empty">Select a character.</div>
    </div>
    <div class="section">
      <div class="section-title">Available Actions</div>
      <div id="actions" class="sheet-empty">Select a character.</div>
    </div>
    <div id="status-note"></div>
  </section>
</div>

<script src="assets/bunnyland-ui.js"></script>
<script src="assets/bunnyland-api.js"></script>
<script src="assets/bunnyland-play.js"></script>
<script>
'use strict';

BunnylandUI.initClientMenu();

const {
  actionAvailable,
  actionCost,
  actionLane,
  actionTitle,
  fetchCharacterList,
  fetchCharacterProjection,
  formatPoints,
  orderActionsByAvailability,
  portraitStatusMessage,
} = BunnylandPlay;

const POLL_INTERVAL_MS = 2000;

class CharacterSheetApp {
  constructor() {
    this.apiBase = null;
    this.connected = false;
    this.characters = [];
    this.selectedId = this._hashCharacterId();
    this.projection = null;
    this.portraitState = '';
    this._requestedPortraits = new Set();
    this._failedPortraits = new Set();
    this._pollTimer = null;

    this._bindUi();
    this.render();
    this._restoreServerParam();
    this._loadConfig();
  }

  _bindUi() {
    document.getElementById('btn-connect').addEventListener('click', () => {
      if (this.connected) this.disconnect();
      else this.connect(document.getElementById('api-url').value.trim());
    });
    document.getElementById('character-select').addEventListener('change', (event) => {
      this.selectCharacter(event.target.value, { updateHash: true });
    });
    window.addEventListener('hashchange', () => {
      const id = this._hashCharacterId();
      if (id !== this.selectedId) this.selectCharacter(id, { updateHash: false });
    });
  }

  _hashCharacterId() {
    return decodeURIComponent(location.hash.replace(/^#/, '')).trim();
  }

  _restoreServerParam() {
    BunnylandApi.applyServerParam({ connect: (server) => this.connect(server) });
  }

  async _loadConfig() {
    await BunnylandApi.applyConfigToInput({
      isConnected: () => this.connected,
      connect: (server) => this.connect(server),
    });
  }

  connect(url) {
    if (!url) return;
    this.disconnect();
    this.apiBase = BunnylandApi.normalizeBase(url);
    this.connected = true;
    document.getElementById('btn-connect').textContent = 'Disconnect';
    BunnylandApi.setServerInUrl(this.apiBase);
    this._setStatus('live', '● Connected');
    this.refresh();
    this._pollTimer = setInterval(() => this.refresh(), POLL_INTERVAL_MS);
  }

  disconnect() {
    clearInterval(this._pollTimer);
    this._pollTimer = null;
    this.connected = false;
    this.characters = [];
    this.projection = null;
    this.portraitState = '';
    document.getElementById('btn-connect').textContent = 'Connect Live';
    document.getElementById('character-select').innerHTML = '<option value="">- choose -</option>';
    if (this.apiBase) BunnylandApi.setServerInUrl('');
    this._setStatus('', '○ Offline');
    this.render();
  }

  async refresh() {
    if (!this.connected || !this.apiBase) return;
    try {
      const list = await fetchCharacterList(this.apiBase);
      this.characters = list.characters || [];
      this._syncSelector();
      if (this.selectedId && this.characters.some(character => character.id === this.selectedId)) {
        this.projection = await fetchCharacterProjection(this.apiBase, this.selectedId);
        if (this.projection?.portrait?.url) {
          this.portraitState = '';
        } else if (this._failedPortraits.has(this.selectedId)) {
          this.portraitState = 'failed';
        } else {
          this._queuePortrait(this.selectedId);
        }
      } else {
        this.projection = null;
      }
      this._setStatus('live', `● Connected · epoch ${this.projection?.worldEpoch || list.epoch || 0}s`);
      this.render();
    } catch (err) {
      this._setStatus('err', `⚠ ${err.message || err}`);
      document.getElementById('status-note').textContent = err.message || String(err);
    }
  }

  selectCharacter(id, { updateHash = false } = {}) {
    this.selectedId = id || '';
    this.projection = null;
    this.portraitState = '';
    if (updateHash) {
      const url = new URL(location.href);
      url.hash = this.selectedId ? encodeURIComponent(this.selectedId) : '';
      history.replaceState(null, '', url);
    }
    this.render();
    this.refresh();
  }

  _syncSelector() {
    const select = document.getElementById('character-select');
    const current = this.selectedId;
    const rows = this.characters.slice().sort((a, b) => a.name.localeCompare(b.name));
    select.innerHTML = '<option value="">- choose -</option>' +
      rows.map(character => `<option value="${BunnylandUI.escapeHtml(character.id)}">${BunnylandUI.escapeHtml(character.name)}</option>`).join('');
    select.value = rows.some(character => character.id === current) ? current : '';
  }

  _queuePortrait(characterId) {
    if (this._requestedPortraits.has(characterId)) {
      if (!this.portraitState) this.portraitState = 'queued';
      return;
    }
    this._requestedPortraits.add(characterId);
    this.portraitState = 'requesting';
    BunnylandApi.requestSceneImage(this.apiBase, characterId)
      .then((result) => {
        this.portraitState = result?.ok === false ? 'failed' : 'queued';
        if (result?.ok === false) this._failedPortraits.add(characterId);
        this.render();
      })
      .catch(() => {
        this.portraitState = 'failed';
        this._failedPortraits.add(characterId);
        this.render();
      });
  }

  _setStatus(kind, text) {
    const status = document.getElementById('api-status');
    status.className = kind;
    status.textContent = text;
  }

  _characterName() {
    return this.projection?.characterName ||
      this.characters.find(character => character.id === this.selectedId)?.name ||
      this.selectedId;
  }

  _initials() {
    const name = this._characterName() || '?';
    return name.split(/\s+/).filter(Boolean).slice(0, 2)
      .map(part => part[0]?.toUpperCase() || '')
      .join('') || '?';
  }

  _renderPortrait() {
    const frame = document.getElementById('portrait-frame');
    const status = document.getElementById('portrait-status');
    const portraitUrl = this.projection?.portrait?.url
      ? BunnylandApi.mediaUrl(this.apiBase, this.projection.portrait.url)
      : '';
    frame.innerHTML = portraitUrl
      ? `<img src="${BunnylandUI.escapeHtml(portraitUrl)}" alt="${BunnylandUI.escapeHtml(this._characterName())} portrait">`
      : `<div class="portrait-placeholder" data-testid="portrait-placeholder">${BunnylandUI.escapeHtml(this._initials())}</div>`;
    status.className = this.portraitState === 'failed' ? 'failed' : '';
    status.textContent = this.selectedId ? portraitStatusMessage(this.projection, this.portraitState) : '';
  }

  _row(label, meta = '') {
    return `<div class="sheet-row"><strong>${BunnylandUI.escapeHtml(label)}</strong><span>${BunnylandUI.escapeHtml(meta)}</span></div>`;
  }

  _renderList(id, rows, empty) {
    const target = document.getElementById(id);
    target.className = rows.length ? 'sheet-list' : 'sheet-empty';
    target.innerHTML = rows.length ? rows.join('') : empty;
  }

  render() {
    this._syncSelector();
    this._renderPortrait();
    const name = this._characterName();
    document.getElementById('character-name').textContent = name || 'No character selected';
    document.getElementById('character-id').textContent = this.selectedId || 'Connect to a server, then choose a character.';

    const pts = this.projection?.points || {};
    const controller = this.projection?.controller;
    const room = this.projection?.room || {};
    document.getElementById('controller-value').textContent = controller
      ? `${controller.controller_id} gen ${controller.generation}`
      : '-';
    document.getElementById('room-value').textContent = room.title || room.id || '-';
    document.getElementById('ap-value').textContent = this.projection
      ? `${formatPoints(pts.action)} / ${formatPoints(pts.action_max)}`
      : '-';
    document.getElementById('fp-value').textContent = this.projection
      ? `${formatPoints(pts.focus)} / ${formatPoints(pts.focus_max)}`
      : '-';

    const visible = (room.entities || [])
      .filter(entity => entity.is_character || entity.kind === 'character')
      .map(entity => this._row(entity.name || entity.id, entity.id === this.selectedId ? 'self' : entity.kind || 'character'));
    this._renderList('visible-characters', visible, 'No visible characters.');

    const inventory = (this.projection?.inventory || [])
      .map(item => this._row(item.label || item.name || item.id, item.kind || 'item'));
    this._renderList('inventory', inventory, 'No inventory items.');

    const exits = (room.exits || [])
      .map(exit => this._row(exit.direction || exit.label || exit.id, exit.locked ? 'locked' : exit.label || exit.id));
    this._renderList('exits', exits, 'No visible exits.');

    const actions = orderActionsByAvailability(this.projection?.actions || [])
      .map(action => {
        const cost = actionCost(action);
        const parts = [];
        if (cost.action) parts.push(`${cost.action} AP`);
        if (cost.focus) parts.push(`${cost.focus} FP`);
        const meta = [actionLane(action), parts.join(' + ') || 'free'].join(' · ');
        const reason = action.unavailable_reason || '';
        return `<div class="sheet-row${actionAvailable(action) ? '' : ' unavailable'}">` +
          `<strong>${BunnylandUI.escapeHtml(actionTitle(action))}</strong>` +
          `<span>${BunnylandUI.escapeHtml(reason || meta)}</span></div>`;
      });
    this._renderList('actions', actions, 'No actions available.');
  }
}

window.app = new CharacterSheetApp();
</script>
</body>
</html>
