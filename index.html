<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Bunnyland</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    body.welcome-page {
      display: block;
      min-height: 100vh;
      height: auto;
      overflow: auto;
      background:
        radial-gradient(circle at 15% 10%, var(--bl-accent-wash), transparent 28rem),
        linear-gradient(180deg, var(--bl-bg-deep), var(--bl-bg) 360px, var(--bl-bg-strong));
    }

    body.welcome-page > #app {
      height: auto;
      min-height: 100vh;
    }

    @supports (height: 100dvh) {
      body.welcome-page,
      body.welcome-page > #app { min-height: 100dvh; }
    }

    .welcome-shell {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 44px;
    }

    .welcome-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0 24px;
    }

    .welcome-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--bl-text);
      font-weight: bold;
      font-size: 18px;
    }

    .welcome-brand img {
      width: 34px;
      height: 34px;
      image-rendering: pixelated;
    }

    .welcome-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
      gap: 22px;
      align-items: stretch;
      padding: 26px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      background: var(--bl-overlay-strong);
      box-shadow: var(--bl-shadow-popover);
    }

    .eyebrow {
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      margin-top: 8px;
      color: var(--bl-text);
      font-size: 34px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .lede {
      margin-top: 14px;
      color: var(--bl-text-soft);
      font-size: 14px;
      line-height: 1.7;
      max-width: 760px;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 7px 11px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-surface);
      color: var(--bl-text);
      text-decoration: none;
      font-size: var(--bl-text-sm);
      white-space: nowrap;
    }

    .button-link:hover {
      background: var(--bl-surface-hover);
      border-color: var(--bl-accent);
    }

    .button-link.primary {
      border-color: var(--bl-accent);
      color: var(--bl-text-inverse);
      background: var(--bl-accent-wash-strong);
    }

    /* Discord highlight: mauve, so it reads as equal to "Play online" but distinct. */
    .button-link.discord {
      border-color: var(--bl-secondary);
      color: var(--bl-text-inverse);
      background: var(--bl-secondary-wash);
    }

    .button-link.discord:hover {
      border-color: var(--bl-secondary);
      background: var(--bl-secondary-wash-strong);
    }

    .alternative-label {
      margin-left: 5px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-xs);
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .button-link.disabled,
    .button-link[aria-disabled="true"] {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
      filter: grayscale(0.4);
    }

    .hero-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      padding: 18px;
      border: 1px solid var(--bl-border);
      border-radius: var(--bl-radius-md);
      background: var(--bl-bg);
    }

    .hero-panel img {
      width: 72px;
      height: 72px;
      align-self: flex-start;
      image-rendering: pixelated;
    }

    .hero-panel p {
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
      line-height: 1.6;
    }

    .section {
      margin-top: 32px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 10px;
    }

    h2 {
      color: var(--bl-text);
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .section-heading p {
      max-width: 560px;
      color: var(--bl-text-soft);
      font-size: 14px;
      line-height: 1.55;
    }

    .info-grid,
    .client-grid {
      display: grid;
      gap: 10px;
    }

    .info-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .client-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .info-card,
    .client-card {
      border: 1px solid var(--bl-border);
      border-radius: var(--bl-radius-md);
      background: var(--bl-overlay-strong);
    }

    .info-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      min-height: 200px;
      max-width: 100%;
      padding: 14px;
    }

    .info-card.feature-disabled {
      opacity: 0.64;
    }

    .info-card.feature-error {
      border-color: var(--bl-error);
    }

    .feature-state {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      line-height: 1.45;
    }

    .feature-state.available {
      color: var(--bl-ok);
    }

    .feature-state.unavailable {
      color: var(--bl-warning);
    }

    .feature-state.error {
      color: var(--bl-error);
    }

    /* Inside the flex column, gap owns vertical spacing, so drop the elements'
       own top margins to keep text, command, and button gaps identical. */
    .info-card p,
    .info-card .cmd {
      margin-top: 0;
    }

    .info-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .info-card h3,
    .client-card h3 {
      color: var(--bl-accent-strong);
      font-size: 13px;
      line-height: 1.35;
    }

    .info-card p,
    .client-card p {
      margin-top: 8px;
      color: var(--bl-text-soft);
      font-size: 14px;
      line-height: 1.6;
    }

    .client-card {
      display: flex;
      flex-direction: column;
      min-height: 260px;
      padding: 12px;
    }

    .client-role {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--bl-border-muted);
      color: var(--bl-text);
      font-size: var(--bl-text-xs);
      line-height: 1.5;
    }

    .client-role span {
      color: var(--bl-accent-strong);
      font-weight: bold;
    }

    .client-card .button-link {
      margin-top: auto;
      width: 100%;
    }

    .resource-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .resource-row a {
      display: block;
      padding: 12px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-md);
      background: var(--bl-surface);
      color: var(--bl-text-inverse);
      text-decoration: none;
      font-size: var(--bl-text-sm);
      font-weight: bold;
      line-height: 1.45;
    }

    .resource-row a:hover {
      border-color: var(--bl-accent);
      background: var(--bl-surface);
    }

    .resource-row span {
      display: block;
      margin-top: 4px;
      color: var(--bl-text-soft);
      font-size: var(--bl-text-xs);
      font-weight: normal;
    }

    @media (max-width: 1100px) {
      .client-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .welcome-hero,
      .info-grid,
      .resource-row {
        grid-template-columns: minmax(0, 1fr);
      }
      .client-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .welcome-shell {
        width: min(100% - 20px, 1160px);
        padding-top: 12px;
      }
      .welcome-header {
        flex-wrap: wrap;
      }
      .client-menu-button {
        margin-left: 0;
      }
      .welcome-hero {
        padding: 18px;
      }
      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }
      .section-heading > p {
        max-width: none;
      }
      h1 {
        font-size: 26px;
      }
      .info-card,
      .client-card {
        min-height: 0;
      }
      .client-grid {
        grid-template-columns: 1fr;
      }
    }

    .cmd {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      margin-top: 8px;
      margin-bottom: 20px;
      padding: 8px 10px;
      background: var(--bl-surface);
      border: 1px solid var(--bl-border);
      border-radius: var(--bl-radius-md);
    }
    .cmd code {
      flex: 1;
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      /* Hanging indent so wrapped/continued lines (e.g. --server …) read as one command. */
      padding-left: 2ch;
      text-indent: -2ch;
      color: var(--bl-text);
      font-size: 13px;
      line-height: 1.5;
    }
    .cmd-copy {
      flex: 0 0 auto;
      padding: 2px 9px;
      font-size: var(--bl-text-xs);
    }

    .play-list {
      list-style: none;
      margin: 4px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .play-list li {
      font-size: 14px;
      color: var(--bl-text-soft);
      line-height: 1.55;
    }
    .play-list strong { color: var(--bl-text); }
    .play-list a,
    .play-list a:visited {
      color: var(--bl-accent);
      text-decoration: underline;
    }
    .play-list a:hover { color: var(--bl-accent-strong); }
  </style>
</head>
<body class="welcome-page bl-page-welcome">
  <div id="app"></div>
  <script type="module" src="/src/ui-web-package.ts"></script>
  <script type="module" src="/src/index/page.tsx"></script>
</body>
</html>
