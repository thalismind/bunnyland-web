<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Inspector</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.13/css/litegraph.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: #181825;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
      font-size: 12px;
    }
    #toolbar label { color: #a6adc8; }
    #toolbar input[type=file] {
      font-size: 11px;
      color: #cdd6f4;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 3px;
      padding: 2px 6px;
      cursor: pointer;
    }
    #toolbar button {
      padding: 3px 10px;
      background: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }
    #toolbar button:hover:not(:disabled) { background: #45475a; }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #breadcrumb {
      flex: 1;
      font-size: 11px;
      color: #6c7086;
      padding-left: 4px;
    }
    #breadcrumb .crumb { color: #89b4fa; cursor: pointer; }
    #breadcrumb .crumb:hover { text-decoration: underline; }
    #breadcrumb .crumb-current { color: #cdd6f4; }
    #world-info { font-size: 10px; color: #585b70; }
    .toolbar-sep { color: #313244; }
    #api-url {
      font-size: 11px;
      background: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      border-radius: 3px;
      padding: 2px 6px;
      width: 190px;
    }
    #api-status { font-size: 11px; white-space: nowrap; }
    #parents-toggle {
      font-size: 11px;
      color: #a6adc8;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      cursor: pointer;
    }
    #parents-toggle input { cursor: pointer; }
    #api-status.live { color: #a6e3a1; }
    #api-status.error { color: #f38ba8; }

    /* ── Main layout ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Graph area ── */
    #graph-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #graph-canvas { display: block; }

    #drop-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: rgba(30, 30, 46, 0.95);
      z-index: 10;
      font-size: 14px;
      color: #a6adc8;
      pointer-events: none;
    }
    #drop-overlay.hidden { display: none; }
    #drop-overlay .title { font-size: 20px; color: #cdd6f4; }
    #drop-overlay .hint { font-size: 11px; color: #585b70; margin-top: 4px; }

    /* ── Inspector panel ── */
    #inspector {
      width: 370px;
      min-width: 260px;
      background: #181825;
      border-left: 1px solid #313244;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #inspector-header {
      padding: 8px 12px;
      border-bottom: 1px solid #313244;
      background: #1e1e2e;
      flex-shrink: 0;
    }
    #inspector-name {
      font-size: 14px;
      font-weight: bold;
      color: #cdd6f4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #inspector-id {
      font-size: 10px;
      color: #585b70;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #inspector-kind {
      font-size: 11px;
      margin-top: 3px;
      color: #a6adc8;
    }
    .control-badge {
      font-weight: bold;
      white-space: nowrap;
    }

    #inspector-body {
      flex: 1;
      overflow-y: auto;
    }
    #inspector-body::-webkit-scrollbar { width: 6px; }
    #inspector-body::-webkit-scrollbar-track { background: #181825; }
    #inspector-body::-webkit-scrollbar-thumb { background: #313244; border-radius: 3px; }

    #inspector-empty {
      padding: 20px;
      text-align: center;
      color: #585b70;
      font-size: 12px;
      line-height: 1.8;
    }

    /* ── Component sections ── */
    .comp-section {
      border-bottom: 1px solid #1e1e2e;
    }
    .comp-section > summary {
      padding: 5px 10px;
      cursor: pointer;
      font-size: 11px;
      color: #89dceb;
      background: #1e1e2e;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .comp-section > summary::before { content: '▶'; font-size: 9px; color: #45475a; }
    .comp-section[open] > summary::before { content: '▼'; }
    .comp-section > summary:hover { background: #252535; }
    .comp-section[open] > summary { color: #89b4fa; }

    .comp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .comp-table tr { border-bottom: 1px solid #1a1a2a; }
    .comp-table tr:hover { background: #1e1e2e; }
    .comp-table td {
      padding: 2px 8px;
      vertical-align: top;
    }
    .comp-table td.key {
      color: #89b4fa;
      width: 42%;
      white-space: nowrap;
      padding-right: 4px;
      padding-left: 20px;
    }
    .comp-table td.val { color: #cdd6f4; word-break: break-word; }

    .val-null { color: #585b70; font-style: italic; }
    .val-bool-t { color: #a6e3a1; }
    .val-bool-f { color: #f38ba8; }
    .val-num { color: #fab387; }
    .val-str { color: #a6e3a1; }

    /* nested object inside a table cell */
    .sub-table { margin: 2px 0 2px 8px; }
    .sub-table td.key { padding-left: 4px; color: #74c7ec; }

    /* ── Relationships section ── */
    .rel-section {
      padding: 5px 10px 8px 10px;
      border-bottom: 1px solid #1e1e2e;
    }
    .rel-title {
      font-size: 11px;
      color: #89dceb;
      margin-bottom: 4px;
    }
    .rel-row {
      font-size: 10px;
      color: #a6adc8;
      padding: 1px 0 1px 10px;
      line-height: 1.5;
    }
    .rel-edge-type { color: #89dceb; }
    .rel-target { color: #89b4fa; cursor: pointer; }
    .rel-target:hover { text-decoration: underline; }
    .rel-edge-data { color: #6c7086; }

    /* ── Meter bars (for hunger, thirst, etc.) ── */
    .meter-bar-row td.val { padding-top: 1px; }
    .meter-bar {
      display: inline-block;
      height: 6px;
      border-radius: 3px;
      vertical-align: middle;
      margin-right: 4px;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <label for="file-input">Snapshot:</label>
  <input type="file" id="file-input" accept=".json">
  <span class="toolbar-sep">|</span>
  <label for="api-url">Server:</label>
  <input type="text" id="api-url" value="http://localhost:8765" spellcheck="false">
  <button id="btn-connect">Connect Live</button>
  <span id="api-status">○ Offline</span>
  <button id="btn-back" disabled>← Back</button>
  <label id="parents-toggle" title="Show the breadcrumb path as parent nodes you can zoom out to">
    <input type="checkbox" id="toggle-parents" checked> parent nodes
  </label>
  <span id="breadcrumb"><span class="crumb-current">Overview</span></span>
  <span id="world-info"></span>
</div>

<div id="main">
  <div id="graph-wrapper">
    <canvas id="graph-canvas"></canvas>
    <div id="drop-overlay">
      <div class="title">🐰 Bunnyland Inspector</div>
      <div>Load a world snapshot JSON to begin</div>
      <div class="hint">Load a .json file, drag &amp; drop here, or Connect Live to a running server</div>
    </div>
  </div>
  <div id="inspector">
    <div id="inspector-header">
      <div id="inspector-name">No entity selected</div>
      <div id="inspector-id"></div>
      <div id="inspector-kind"></div>
    </div>
    <div id="inspector-body">
      <div id="inspector-empty">
        Load a snapshot and click any node<br>to inspect its ECS components.
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.13/build/litegraph.js"></script>
<script>
'use strict';

// ── Snapshot parsing ─────────────────────────────────────────────────────────

function parseSnapshot(json) {
  const entities = {};
  for (const id of Object.keys(json.entities || {})) {
    entities[id] = { id, components: {}, relationships: {} };
  }
  for (const [ctype, table] of Object.entries(json.components || {})) {
    for (const [eid, fields] of Object.entries(table)) {
      if (!entities[eid]) entities[eid] = { id: eid, components: {}, relationships: {} };
      entities[eid].components[ctype] = fields;
    }
  }
  for (const [rtype, table] of Object.entries(json.relationships || {})) {
    for (const [eid, edges] of Object.entries(table)) {
      if (!entities[eid]) entities[eid] = { id: eid, components: {}, relationships: {} };
      entities[eid].relationships[rtype] = edges;
    }
  }
  return {
    entities,
    meta: json.bunnyland || {},
    epoch: json.metadata?.epoch || 0,
  };
}

// Parse the live server format: entities array, relationships use target_id.
function parseApiSnapshot(data) {
  const entities = {};
  for (const e of data.entities || []) {
    const rels = {};
    for (const [rtype, edges] of Object.entries(e.relationships || {})) {
      rels[rtype] = edges.map(({ target_id, edge }) => ({ target: target_id, edge }));
    }
    entities[e.id] = { id: e.id, components: e.components || {}, relationships: rels };
  }
  return {
    entities,
    meta: data.metadata || {},
    epoch: data.world_epoch || 0,
  };
}

function entityType(entity) {
  const c = entity.components;
  if (c.RoomComponent) return 'room';
  if (c.CharacterComponent) return 'character';
  if (c.DoorComponent) return 'door';
  if (c.ContainerComponent) return 'container';
  if (c.PortableComponent) return 'item';
  return 'other';
}

function entityDisplayName(entity) {
  const c = entity.components;
  if (c.RoomComponent) return c.RoomComponent.title || entity.id;
  if (c.IdentityComponent?.name) return c.IdentityComponent.name;
  return entity.id.slice(0, 24);
}

function entitySubtitle(entity) {
  const c = entity.components;
  if (c.RoomComponent) {
    const r = c.RoomComponent;
    return [r.biome, r.indoor ? 'indoor' : 'outdoor'].filter(Boolean).join(' · ');
  }
  if (c.CharacterComponent) return c.CharacterComponent.species || '';
  if (c.DoorComponent) {
    return c.LockableComponent?.locked ? '🔒 locked' : '';
  }
  if (c.DescriptionComponent) return c.DescriptionComponent.short || '';
  if (c.IdentityComponent) return c.IdentityComponent.kind || '';
  return '';
}

// A character's controller is a separate entity reached by the ControlledBy edge; its
// component type says who is driving it: an LLM, a Discord player, or nobody (suspended).
const CONTROL_STYLE = {
  llm:       { icon: '🤖', label: 'LLM',       color: '#89b4fa' },
  discord:   { icon: '🎮', label: 'Discord',   color: '#cba6f7' },
  suspended: { icon: '💤', label: 'Suspended', color: '#6c7086' },
};

// Returns { kind, icon, label, color, detail } for whoever controls this entity, or null
// if it has no controller (most non-character entities).
function controlInfo(entity, world) {
  const edges = entity.relationships?.ControlledBy;
  if (!edges?.length) return null;
  const controller = world.entities[edges[0].target];
  if (!controller) return null;
  const c = controller.components;
  if (c.LLMControllerComponent) {
    const m = c.LLMControllerComponent;
    return { kind: 'llm', ...CONTROL_STYLE.llm,
             detail: [m.profile_name, m.model].filter(Boolean).join(' / ') };
  }
  if (c.DiscordControllerComponent) {
    const d = c.DiscordControllerComponent;
    return { kind: 'discord', ...CONTROL_STYLE.discord,
             detail: d.discord_user_id ? `user ${d.discord_user_id}` : '' };
  }
  if (c.SuspendedControllerComponent) {
    const s = c.SuspendedControllerComponent;
    return { kind: 'suspended', ...CONTROL_STYLE.suspended, detail: s.reason || '' };
  }
  return null;
}

// Edge types that express "what is inside / carried by" an entity. Rooms contain
// characters & objects (Contains); characters carry items (Holding) and wear them
// (Wearing); containers hold their contents (Contains). Walking these recursively is
// what lets the graph drill room → character → bag → … to any depth.
const CONTAINMENT_EDGES = ['Contains', 'Holding', 'Wearing'];

// Direct children of an entity: [{ target, rtype, edge }], skipping rooms (a Contains
// edge never points at a room, but be defensive) and dangling targets.
function entityChildren(entity, world) {
  const out = [];
  for (const rtype of CONTAINMENT_EDGES) {
    for (const { target, edge } of (entity.relationships[rtype] || [])) {
      const ce = world.entities[target];
      if (!ce || entityType(ce) === 'room') continue;
      out.push({ target, rtype, edge });
    }
  }
  return out;
}

function hasChildren(entity, world) {
  return entityChildren(entity, world).length > 0;
}

// ── Room layout ──────────────────────────────────────────────────────────────

const DIR_OFFSET = {
  north:     [0, -1], south:     [0,  1],
  east:      [1,  0], west:     [-1,  0],
  northeast: [1, -1], northwest: [-1, -1],
  southeast: [1,  1], southwest: [-1,  1],
  up:        [0, -1], down:      [0,  1],
};
const ROOM_SPACING = 280;

function layoutRooms(world, roomIds) {
  const positions = {};
  const visited = new Set();
  if (!roomIds.length) return positions;

  const queue = [{ id: roomIds[0], x: 0, y: 0 }];
  while (queue.length) {
    const { id, x, y } = queue.shift();
    if (visited.has(id)) continue;
    visited.add(id);
    positions[id] = [x, y];

    for (const { target, edge } of (world.entities[id]?.relationships.ExitTo || [])) {
      if (visited.has(target)) continue;
      const dir = (edge.direction || '').toLowerCase();
      const [dx, dy] = DIR_OFFSET[dir] || [1, 0];
      queue.push({ id: target, x: x + dx * ROOM_SPACING, y: y + dy * ROOM_SPACING });
    }
  }

  // Disconnected rooms fall below
  let col = 0;
  for (const id of roomIds) {
    if (!positions[id]) {
      positions[id] = [col * ROOM_SPACING, ROOM_SPACING * 2];
      col++;
    }
  }

  // Shift everything to start at (80, 60)
  const xs = Object.values(positions).map(p => p[0]);
  const ys = Object.values(positions).map(p => p[1]);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  for (const id of Object.keys(positions)) {
    positions[id] = [positions[id][0] - minX + 80, positions[id][1] - minY + 60];
  }
  return positions;
}

// ── LiteGraph node types ─────────────────────────────────────────────────────

const ENTITY_STYLE = {
  room:      { color: '#1a5f7a', bgcolor: '#0e3f52', titleColor: '#74c7ec', icon: '🏠' },
  character: { color: '#2a6a3a', bgcolor: '#1a4228', titleColor: '#a6e3a1', icon: '🐰' },
  container: { color: '#6a4a1a', bgcolor: '#402e0a', titleColor: '#fab387', icon: '📦' },
  item:      { color: '#4a3a6a', bgcolor: '#2a2048', titleColor: '#cba6f7', icon: '✦' },
  other:     { color: '#383848', bgcolor: '#222232', titleColor: '#a6adc8', icon: '⬡' },
  door:      { color: '#5a5030', bgcolor: '#332d18', titleColor: '#f9e2af', icon: '🚪' },
};

// Register one generic node type used for all entity kinds.
// We apply color/icon/widgets dynamically after creation.
(function registerNodeTypes() {
  for (const [kind, style] of Object.entries(ENTITY_STYLE)) {
    function EntityNode() {
      this.addInput('←', '');
      this.addOutput('→', '');
    }
    EntityNode.title = kind;
    EntityNode.prototype = Object.create(LGraphNode.prototype);
    EntityNode.prototype.constructor = EntityNode;
    LiteGraph.registerNodeType(`bunnyland/${kind}`, EntityNode);
  }
})();

// ── Inspector rendering ───────────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderScalar(v) {
  if (v === null || v === undefined) return '<span class="val-null">null</span>';
  if (typeof v === 'boolean') return `<span class="${v ? 'val-bool-t' : 'val-bool-f'}">${v}</span>`;
  if (typeof v === 'number') return `<span class="val-num">${v}</span>`;
  if (typeof v === 'string') return `<span class="val-str">"${esc(v)}"</span>`;
  return esc(String(v));
}

function renderValue(v, depth) {
  if (depth === undefined) depth = 0;
  if (v === null || v === undefined) return '<span class="val-null">null</span>';
  if (typeof v === 'boolean') return `<span class="${v ? 'val-bool-t' : 'val-bool-f'}">${v}</span>`;
  if (typeof v === 'number') return `<span class="val-num">${v}</span>`;
  if (typeof v === 'string') return `<span class="val-str">"${esc(v)}"</span>`;
  if (Array.isArray(v)) {
    if (!v.length) return '<span class="val-null">[]</span>';
    if (v.every(x => typeof x !== 'object' || x === null)) {
      return '[' + v.map(x => renderScalar(x)).join(', ') + ']';
    }
    return '<span class="val-null">[…' + v.length + ']</span>';
  }
  if (typeof v === 'object') {
    if (depth >= 1) {
      // Nested object: render as sub-table
      const rows = Object.entries(v).map(([k, val]) =>
        `<tr><td class="key">${esc(k)}</td><td class="val">${renderValue(val, depth + 1)}</td></tr>`
      ).join('');
      return `<table class="comp-table sub-table">${rows}</table>`;
    }
    // Top-level object - shouldn't happen in a cell, but handle gracefully
    return `<span class="val-null">{…}</span>`;
  }
  return esc(String(v));
}

// Special renderer for Meter objects (value/minimum/maximum)
function isMeter(v) {
  return v && typeof v === 'object' && 'value' in v && 'maximum' in v && 'minimum' in v;
}

function renderMeter(v) {
  const pct = Math.max(0, Math.min(1, (v.value - v.minimum) / (v.maximum - v.minimum || 1)));
  const color = pct > 0.7 ? '#f38ba8' : pct > 0.4 ? '#fab387' : '#a6e3a1';
  const barW = Math.round(pct * 100);
  return `<span class="meter-bar" style="width:${barW}px;background:${color}"></span>`
    + `<span class="val-num">${v.value.toFixed(1)}</span>`
    + `<span class="val-null"> / ${v.maximum}</span>`;
}

function renderComponentTable(fields) {
  const rows = Object.entries(fields).map(([k, v]) => {
    let valHtml;
    if (isMeter(v)) {
      valHtml = renderMeter(v);
    } else if (v && typeof v === 'object' && !Array.isArray(v)) {
      valHtml = renderValue(v, 1);
    } else {
      valHtml = renderValue(v, 0);
    }
    const meterClass = isMeter(v) ? ' meter-bar-row' : '';
    return `<tr class="${meterClass}"><td class="key">${esc(k)}</td><td class="val">${valHtml}</td></tr>`;
  }).join('');
  return `<table class="comp-table">${rows}</table>`;
}

function renderRelationships(entity, world) {
  const rels = entity.relationships;
  if (!Object.keys(rels).length) return '';

  let rows = '';
  for (const [rtype, edges] of Object.entries(rels)) {
    for (const { target, edge } of edges) {
      const targetEnt = world.entities[target];
      const targetName = targetEnt ? entityDisplayName(targetEnt) : target;
      const edgeSummary = edge && Object.keys(edge).length
        ? ' <span class="rel-edge-data">(' + esc(Object.entries(edge).map(([k,v]) => `${k}: ${JSON.stringify(v)}`).join(', ')) + ')</span>'
        : '';
      rows += `<div class="rel-row">
        <span class="rel-edge-type">${esc(rtype)}</span> →
        <span class="rel-target" onclick="window.app.selectEntity('${esc(target)}')">${esc(targetName)}</span>${edgeSummary}
      </div>`;
    }
  }

  return `<div class="rel-section"><div class="rel-title">🔗 Relationships</div>${rows}</div>`;
}

function showInspector(entityId, world) {
  const entity = world.entities[entityId];
  if (!entity) return;

  const type = entityType(entity);
  const name = entityDisplayName(entity);
  const sub  = entitySubtitle(entity);
  const style = ENTITY_STYLE[type] || ENTITY_STYLE.other;

  document.getElementById('inspector-name').textContent = style.icon + ' ' + name;
  document.getElementById('inspector-id').textContent = entityId;

  const ctrl = controlInfo(entity, world);
  const ctrlHtml = ctrl
    ? ` <span class="control-badge" style="color:${ctrl.color}">${ctrl.icon} ${esc(ctrl.label)}`
      + `${ctrl.detail ? ' · ' + esc(ctrl.detail) : ''}</span>`
    : '';
  document.getElementById('inspector-kind').innerHTML =
    `<span style="color:${style.titleColor}">${type}</span>${sub ? '  ·  ' + esc(sub) : ''}${ctrlHtml}`;

  let html = '';
  for (const [cname, fields] of Object.entries(entity.components)) {
    html += `<details class="comp-section" open>
      <summary>${esc(cname)}</summary>
      ${renderComponentTable(fields)}
    </details>`;
  }
  html += renderRelationships(entity, world);

  const body = document.getElementById('inspector-body');
  body.innerHTML = html || '<div id="inspector-empty">No components.</div>';
}

// ── Main application ─────────────────────────────────────────────────────────

class BunnylandInspector {
  constructor() {
    this.world = null;
    this.lgraph = new LGraph();
    this.lgcanvas = null;
    this.viewStack = []; // {label, entityId} drilldown path
    this._nodeMap = {};  // entityId → LGraphNode
    this.showParents = true; // render the breadcrumb path as parent nodes in drilldown

    this._ws = null;
    this._refreshTimer = null;
    this._apiBase = null;

    this._initCanvas();
    this._initFileInput();
    this._initDragDrop();
    document.getElementById('btn-back').addEventListener('click', () => this.navigateBack());
    document.getElementById('toggle-parents').addEventListener('change', (e) => {
      this.showParents = e.target.checked;
      if (this.viewStack.length) {
        this._showEntity(this.viewStack[this.viewStack.length - 1].entityId);
      }
    });
    document.getElementById('btn-connect').addEventListener('click', () => {
      if (this._ws) {
        this.disconnectLive();
      } else {
        const url = document.getElementById('api-url').value.trim();
        if (url) this.connectLive(url);
      }
    });
  }

  _initCanvas() {
    const canvas = document.getElementById('graph-canvas');
    this.lgcanvas = new LGraphCanvas(canvas, this.lgraph);

    // Styling
    this.lgcanvas.render_shadows = false;
    this.lgcanvas.render_canvas_border = false;
    this.lgcanvas.default_link_color = '#45475a';
    this.lgcanvas.highquality_render = false;
    this.lgcanvas.links_render_mode = LiteGraph.STRAIGHT_LINK;

    this.lgcanvas.onNodeSelected = (node) => {
      if (node?.entityId && this.world) {
        showInspector(node.entityId, this.world);
      }
    };

    this._resizeCanvas();
    window.addEventListener('resize', () => this._resizeCanvas());
  }

  _resizeCanvas() {
    const wrapper = document.getElementById('graph-wrapper');
    const canvas  = document.getElementById('graph-canvas');
    canvas.width  = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
    if (this.lgcanvas) this.lgcanvas.resize();
  }

  _initFileInput() {
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) this._readFile(file);
    });
  }

  _initDragDrop() {
    const wrapper = document.getElementById('graph-wrapper');
    wrapper.addEventListener('dragover', (e) => e.preventDefault());
    wrapper.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer?.files?.[0];
      if (file) this._readFile(file);
    });
  }

  _readFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const json = JSON.parse(e.target.result);
        this.loadSnapshot(json);
      } catch (err) {
        alert('Could not parse JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  loadSnapshot(json) {
    this.disconnectLive();
    this._applyWorld(parseSnapshot(json), { resetView: true });
  }

  // ── Live server connection ─────────────────────────────────────────────────

  connectLive(url) {
    this.disconnectLive();
    this._apiBase = url.replace(/\/$/, '');

    const wsUrl = this._apiBase.replace(/^http/, 'ws') + '/world/updates';
    const ws = new WebSocket(wsUrl);
    this._ws = ws;

    ws.onopen = () => {
      this._setApiStatus('live', '● Connected');
      document.getElementById('btn-connect').textContent = 'Disconnect';
    };

    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'snapshot') {
        // Server sends full snapshot on connect — use it directly.
        this._applyWorld(parseApiSnapshot(msg.data), { resetView: !this.world });
      } else if (msg.type === 'event') {
        // Debounce: re-fetch the snapshot 400 ms after the last event burst.
        clearTimeout(this._refreshTimer);
        this._refreshTimer = setTimeout(() => this._refreshFromApi(), 400);
      }
    };

    ws.onclose = () => {
      if (this._ws === ws) {
        this._ws = null;
        this._setApiStatus('', '○ Offline');
        document.getElementById('btn-connect').textContent = 'Connect Live';
      }
    };

    ws.onerror = () => {
      this._setApiStatus('error', '⚠ Connection failed');
    };
  }

  disconnectLive() {
    clearTimeout(this._refreshTimer);
    if (this._ws) {
      this._ws.onclose = null; // suppress the onclose handler firing
      this._ws.close();
      this._ws = null;
    }
    this._setApiStatus('', '○ Offline');
    document.getElementById('btn-connect').textContent = 'Connect Live';
  }

  async _refreshFromApi() {
    try {
      const res = await fetch(`${this._apiBase}/world/snapshot`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      this._applyWorld(parseApiSnapshot(data), { resetView: false });
      this._setApiStatus('live', `● Live · epoch ${this.world.epoch}s`);
    } catch (err) {
      this._setApiStatus('error', `⚠ ${err.message}`);
    }
  }

  _setApiStatus(cls, text) {
    const el = document.getElementById('api-status');
    el.className = cls;
    el.textContent = text;
  }

  // Apply a parsed world object, optionally preserving the current view.
  _applyWorld(world, { resetView = true } = {}) {
    const prevEntityId = !resetView && this.viewStack.length
      ? this.viewStack[this.viewStack.length - 1].entityId
      : null;

    this.world = world;
    document.getElementById('drop-overlay').classList.add('hidden');

    const m = world.meta;
    const entityCount = Object.keys(world.entities).length;
    document.getElementById('world-info').textContent =
      [m.seed && `seed: ${m.seed}`, m.generator && `gen: ${m.generator}`,
       `epoch: ${world.epoch}s`, `entities: ${entityCount}`].filter(Boolean).join(' · ');

    if (prevEntityId && world.entities[prevEntityId]) {
      // Stay on the same entity, rebuild its subgraph with fresh data.
      this._showEntity(prevEntityId);
    } else {
      this.viewStack = [];
      this.showRoomMap();
    }
  }

  // ── Views ──────────────────────────────────────────────────────────────────

  showRoomMap() {
    this._clearGraph();
    this._updateBreadcrumb('Room Map');

    const roomIds = Object.values(this.world.entities)
      .filter(e => e.components.RoomComponent)
      .map(e => e.id);

    const positions = layoutRooms(this.world, roomIds);
    const roomNodes = {};

    for (const id of roomIds) {
      const entity = this.world.entities[id];
      const [x, y] = positions[id] || [100, 100];
      const node = this._makeNode(entity, x, y, () => this._pushEntity(id));
      roomNodes[id] = node;
    }

    // ExitTo edges — deduplicate bidirectional pairs
    const linked = new Set();
    for (const id of roomIds) {
      for (const { target } of (this.world.entities[id].relationships.ExitTo || [])) {
        const key = [id, target].sort().join('|');
        if (linked.has(key)) continue;
        linked.add(key);
        const sn = roomNodes[id], tn = roomNodes[target];
        if (sn && tn) sn.connect(0, tn, 0);
      }
    }

    this._fitView();
  }

  _pushEntity(entityId) {
    const name = entityDisplayName(this.world.entities[entityId]);
    this.viewStack.push({ label: name, entityId });
    this._showEntity(entityId);
  }

  // Show one entity (room, character, container, …) as a header node with its direct
  // contents below it. Any child that itself has contents gets an enter button, so the
  // same view drills recursively: room → character inventory → bag → nested container → …
  // When showParents is on, the breadcrumb path is drawn as a chain of parent nodes that
  // flows into the header, each carrying a "zoom out to here" button.
  _showEntity(entityId) {
    this._clearGraph();
    this._updateBreadcrumb();

    const entity = this.world.entities[entityId];
    const NODE_W = 200, GAP = 16;

    // Render the ancestor chain (Room Map root + every entity above this one) as a row of
    // parent nodes leading into the header. The header sits just after the chain.
    let headerX = 300;
    let prevNode = null;
    if (this.showParents && this.viewStack.length) {
      let x = 40;
      prevNode = this._makeRootNode(x, 40);
      x += NODE_W + GAP;
      const ancestors = this.viewStack.slice(0, -1); // entities above the current one
      ancestors.forEach((crumb, depth) => {
        const ae = this.world.entities[crumb.entityId];
        const node = this._makeNode(ae, x, 40, null, () => this._goToDepth(depth));
        prevNode.connect(0, node, 0);
        prevNode = node;
        x += NODE_W + GAP;
      });
      headerX = x;
    }

    // Header node for the current entity
    const headerNode = this._makeNode(entity, headerX, 40, null);
    if (prevNode) prevNode.connect(0, headerNode, 0);

    // Collect and classify direct contents across all containment edges
    const contents = { character: [], container: [], item: [], other: [] };
    for (const { target } of entityChildren(entity, this.world)) {
      const ce = this.world.entities[target];
      const t = entityType(ce);
      (contents[t] || contents.other).push(target);
    }

    // Lay out contents in type rows, centered under the header.
    const centerX = headerX + NODE_W / 2;
    const typeRows = [
      { key: 'character', y: 220 },
      { key: 'container', y: 360 },
      { key: 'item',      y: 500 },
      { key: 'other',     y: 500 },
    ];

    const usedRows = new Set();
    let maxContentY = 40;
    for (const { key, y } of typeRows) {
      const ids = contents[key];
      if (!ids?.length) continue;

      // Merge 'item' and 'other' into same row
      const rowKey = (key === 'other') ? 'item' : key;
      const yCoord = usedRows.has(rowKey) ? y + 60 : y;
      usedRows.add(rowKey);
      maxContentY = Math.max(maxContentY, yCoord);

      const totalW = ids.length * NODE_W + (ids.length - 1) * GAP;
      let x = Math.max(40, centerX - totalW / 2);

      for (const cid of ids) {
        const ce = this.world.entities[cid];
        const enter = hasChildren(ce, this.world) ? () => this._pushEntity(cid) : null;
        const node = this._makeNode(ce, x, yCoord, enter);
        headerNode.connect(0, node, 0);
        x += NODE_W + GAP;
      }
    }

    // Rooms also show their exits as door nodes you can step through.
    this._layoutDoors(entity, headerNode, centerX, maxContentY + 160);

    this._fitView();
  }

  // Draw a room's ExitTo edges as door nodes, each labelled with its destination and a
  // button to walk there. An exit with no matching return edge is flagged one-way.
  _layoutDoors(room, headerNode, centerX, y) {
    const exits = room.relationships?.ExitTo || [];
    if (!exits.length) return;

    const NODE_W = 200, GAP = 16;
    const totalW = exits.length * NODE_W + (exits.length - 1) * GAP;
    let x = Math.max(40, centerX - totalW / 2);

    for (const { target, edge } of exits) {
      const dest = this.world.entities[target];
      if (!dest) continue;
      const returns = (dest.relationships?.ExitTo || []).some(e => e.target === room.id);
      const node = this._makeDoorNode(edge, dest, !returns, x, y);
      headerNode.connect(0, node, 0);
      x += NODE_W + GAP;
    }
  }

  _makeDoorNode(edge, dest, oneWay, x, y) {
    const style = ENTITY_STYLE.door;
    const dir = (edge.direction || '').trim();
    const destName = entityDisplayName(dest);

    const node = LiteGraph.createNode('bunnyland/door');
    node.title   = style.icon + ' ' + (dir ? dir.charAt(0).toUpperCase() + dir.slice(1) : 'Exit');
    node.color   = style.color;
    node.bgcolor = style.bgcolor;

    const flags = [
      oneWay ? 'one-way ⇒' : null,
      edge.locked ? '🔒 locked' : null,
      edge.hidden ? 'hidden' : null,
    ].filter(Boolean);
    const sub = '→ ' + destName + (flags.length ? '  ·  ' + flags.join('  ·  ') : '');
    {
      const w = node.addWidget('text', '', sub, () => {});
      w.type = 'label';
      w.draw = function (ctx, _n, _w, wy, H) {
        ctx.fillStyle = oneWay ? '#f9e2af' : '#888a9a';
        ctx.font = '10px "Courier New", monospace';
        ctx.fillText(this.value, 8, wy + H * 0.72);
      };
    }

    node.addWidget('button', 'Go to Room →', null, () => this._goToRoom(dest.id));
    node.size = [200, 24 + 22 + 26 + 14];
    node.pos = [x, y];
    this.lgraph.add(node);
    return node;
  }

  // Jump to a room as a fresh top-level drilldown (breadcrumb: Room Map › Room).
  _goToRoom(roomId) {
    const name = entityDisplayName(this.world.entities[roomId]);
    this.viewStack = [{ label: name, entityId: roomId }];
    this._showEntity(roomId);
  }

  // A small synthetic node standing in for the top-level room map at the head of the
  // parent chain, with a button to zoom all the way back out.
  _makeRootNode(x, y) {
    const node = LiteGraph.createNode('bunnyland/other');
    node.title   = '🗺 Room Map';
    node.color   = ENTITY_STYLE.other.color;
    node.bgcolor = ENTITY_STYLE.other.bgcolor;
    node.addWidget('button', '↑ Room Map', null, () => this._goToRoot());
    node.size = [200, 24 + 26 + 14];
    node.pos = [x, y];
    this.lgraph.add(node);
    return node;
  }

  navigateBack() {
    if (!this.viewStack.length) return;
    this.viewStack.pop();
    if (!this.viewStack.length) {
      this.showRoomMap();
    } else {
      const { entityId } = this.viewStack[this.viewStack.length - 1];
      this._showEntity(entityId);
    }
  }

  // ── Node factory ───────────────────────────────────────────────────────────

  _makeNode(entity, x, y, enterFn, backFn) {
    const type  = entityType(entity);
    const style = ENTITY_STYLE[type] || ENTITY_STYLE.other;
    const name  = style.icon + ' ' + entityDisplayName(entity);

    // Tag controlled entities (characters) with who is driving them, after the subtitle.
    let sub = entitySubtitle(entity);
    const ctrl = this.world ? controlInfo(entity, this.world) : null;
    if (ctrl) sub = [sub, `${ctrl.icon} ${ctrl.label}`].filter(Boolean).join('  ·  ');

    const node = LiteGraph.createNode(`bunnyland/${type}`);
    node.title   = name;
    node.color   = style.color;
    node.bgcolor = style.bgcolor;
    node.entityId = entity.id;

    // Non-interactive subtitle label (custom widget type 'label' avoids LiteGraph's
    // text-edit prompt while still reserving vertical space in the node body).
    if (sub) {
      const w = node.addWidget('text', '', sub, () => {});
      w.type = 'label'; // unknown type → LiteGraph skips mouse handling
      w.draw = function(ctx, _node, widget_width, y, H) {
        ctx.fillStyle = '#888a9a';
        ctx.font = '10px "Courier New", monospace';
        ctx.fillText(this.value, 8, y + H * 0.72);
      };
    }

    // Widget: drill-in button, labelled for what the entity holds.
    if (enterFn) {
      const label = type === 'room' ? 'Enter Room →'
        : type === 'character' ? 'Inventory →'
        : type === 'container' ? 'Open →'
        : 'Enter →';
      node.addWidget('button', label, null, () => enterFn());
    }

    // Widget: zoom-out button on a parent node, mirroring the drill-in label.
    if (backFn) {
      const label = type === 'room' ? '↑ Room'
        : type === 'character' ? '↑ Inventory'
        : type === 'container' ? '↑ Contents'
        : '↑ Back';
      node.addWidget('button', label, null, () => backFn());
    }

    node.size = [
      200,
      24 + (sub ? 22 : 0) + ((enterFn || backFn) ? 26 : 0) + 14,
    ];
    node.pos = [x, y];

    // Selection → inspector
    node.onSelected = () => {
      if (this.world) showInspector(entity.id, this.world);
    };

    this.lgraph.add(node);
    this._nodeMap[entity.id] = node;
    return node;
  }

  // ── Utilities ──────────────────────────────────────────────────────────────

  _clearGraph() {
    this.lgraph.clear();
    this._nodeMap = {};
    this.lgcanvas.setDirty(true, true);
  }

  _fitView() {
    // Frame all current nodes: scale down if they're wider/taller than the canvas
    // (parent chains can run wide) and center them.
    const nodes = this.lgraph._nodes;
    const ds = this.lgcanvas.ds;
    if (!nodes.length) {
      ds.scale = 1;
      ds.offset = [0, 0];
      this.lgcanvas.setDirty(true, true);
      return;
    }

    const titleH = LiteGraph.NODE_TITLE_HEIGHT || 20;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of nodes) {
      minX = Math.min(minX, n.pos[0]);
      minY = Math.min(minY, n.pos[1] - titleH);
      maxX = Math.max(maxX, n.pos[0] + n.size[0]);
      maxY = Math.max(maxY, n.pos[1] + n.size[1]);
    }

    const margin = 60;
    const cw = this.lgcanvas.canvas.width;
    const ch = this.lgcanvas.canvas.height;
    const w = (maxX - minX) + margin * 2;
    const h = (maxY - minY) + margin * 2;
    const scale = Math.max(0.2, Math.min(1, Math.min(cw / w, ch / h)));
    ds.scale = scale;
    // screenX = (graphX + offsetX) * scale; place the content box, then center the slack.
    ds.offset = [
      -minX + margin + (cw / scale - w) / 2,
      -minY + margin + (ch / scale - h) / 2,
    ];
    this.lgcanvas.setDirty(true, true);
  }

  _updateBreadcrumb(label) {
    // label overrides (for top-level "Room Map")
    const crumb = document.getElementById('breadcrumb');

    const parts = [];

    // Always show "Room Map" as root
    if (this.viewStack.length > 0) {
      parts.push(`<span class="crumb" onclick="window.app._goToRoot()">Room Map</span>`);
    } else {
      parts.push(`<span class="crumb-current">${esc(label || 'Room Map')}</span>`);
    }

    // Show the drilldown path
    for (let i = 0; i < this.viewStack.length; i++) {
      const { label: lbl } = this.viewStack[i];
      if (i === this.viewStack.length - 1) {
        parts.push(`<span class="crumb-current">${esc(lbl)}</span>`);
      } else {
        parts.push(`<span class="crumb" onclick="window.app._goToDepth(${i})">${esc(lbl)}</span>`);
      }
    }

    crumb.innerHTML = parts.join(' › ');
    document.getElementById('btn-back').disabled = this.viewStack.length === 0;
  }

  _goToRoot() {
    this.viewStack = [];
    this.showRoomMap();
  }

  _goToDepth(depth) {
    this.viewStack = this.viewStack.slice(0, depth + 1);
    const { entityId } = this.viewStack[this.viewStack.length - 1];
    this._showEntity(entityId);
  }

  selectEntity(entityId) {
    if (!this.world) return;
    showInspector(entityId, this.world);
    const node = this._nodeMap[entityId];
    if (node) this.lgcanvas.selectNode(node, false);
  }
}

// ── Boot ─────────────────────────────────────────────────────────────────────
window.app = new BunnylandInspector();

// Optional deploy-specific settings from config.json next to index.html:
//   { "serverUrl": "http://host:port", "autoConnect": true }
// serverUrl pre-fills the Server field; autoConnect also opens the live connection.
// A missing or invalid file is fine — the client just keeps its defaults.
(async function applyConfig() {
  let cfg;
  try {
    const res = await fetch('config.json', { cache: 'no-store' });
    if (!res.ok) return; // no config deployed
    cfg = await res.json();
  } catch (_) {
    return; // not served over http, or unparseable — ignore
  }
  if (cfg && typeof cfg.serverUrl === 'string' && cfg.serverUrl) {
    document.getElementById('api-url').value = cfg.serverUrl;
    if (cfg.autoConnect) window.app.connectLive(cfg.serverUrl);
  }
})();

// Allow loading the test snapshot from the CLI for development
// e.g. fetch('/snapshot.json').then(r=>r.json()).then(j=>app.loadSnapshot(j))
</script>
</body>
