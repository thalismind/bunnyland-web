<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bunnyland Web REPL</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <link rel="stylesheet" href="assets/bunnyland-themes.css">
  <link rel="stylesheet" href="assets/bunnyland-responsive.css">
  <style>
    #api-url { width: 190px; }
    #player-select, #claim-fallback, #claim-timeout { font-size: var(--bl-text-sm); }
    #claim-timeout { width: 56px; }

    #main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      background: var(--bl-bg-deep);
    }

    #terminal-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--bl-border);
      background: var(--bl-bg-deep);
    }

    #repl-log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      font-size: var(--bl-text-md);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .log-row {
      margin-bottom: 8px;
      color: var(--bl-text-soft);
    }
    .log-row.command { color: var(--bl-accent); }
    .log-row.ok { color: var(--bl-ok); }
    .log-row.error { color: var(--bl-error); }
    .log-row.event { color: var(--bl-text); }
    .log-row.rejection { color: var(--bl-warn); }

    .entity-link {
      border: 0;
      padding: 0;
      color: var(--bl-accent-strong);
      background: transparent;
      text-decoration: underline;
      font-size: inherit;
      white-space: normal;
    }
    .entity-link:hover { background: transparent; color: var(--bl-accent); }

    #prompt-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
    }
    #prompt-label { color: var(--bl-accent); }
    #repl-input {
      width: 100%;
      font-size: 14px;
      padding: 7px 9px;
      background: var(--bl-bg);
    }

    #side-pane {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      background: var(--bl-bg-strong);
    }

    .side-section { margin-bottom: 16px; }
    .side-title {
      margin-bottom: 7px;
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .icon-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 7px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      white-space: nowrap;
    }
    .action-icon { margin-right: 6px; }
    .side-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .side-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }
    .side-row strong {
      color: var(--bl-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side-row span { color: var(--bl-text-dim); }
    .side-row.unavailable {
      opacity: 0.62;
      background: var(--bl-bg-subtle);
      border-color: var(--bl-border-muted);
    }
    .side-row.unavailable strong { color: var(--bl-text-muted); }
    .side-row .reason {
      color: var(--bl-warn);
      font-size: var(--bl-text-xs);
    }
    .side-empty {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
      line-height: 1.45;
    }
    .help-chip {
      display: inline-block;
      margin: 0 4px 5px 0;
      padding: 3px 6px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      color: var(--bl-text-soft);
      background: var(--bl-surface);
      font-size: var(--bl-text-xs);
    }

    @media (max-width: 860px) {
      #main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
      #terminal-pane { border-right: 0; border-bottom: 1px solid var(--bl-border); }
      #side-pane { max-height: 32vh; }
      .toolbar-row { flex-wrap: wrap; }
      .client-menu-button { margin-left: 0; }
    }

  </style>
</head>
<body class="bl-tool-page bl-page-web-repl">
  <div id="app"></div>
  <script src="assets/bunnyland-ui.js?v=20260719-world-graph"></script>
  <script src="assets/bunnyland-api.js?v=20260718-formal-v1"></script>
  <script src="assets/bunnyland-play.js?v=20260718-formal-v1"></script>
  <script type="module" src="/src/web-repl/app.tsx"></script>
</body>
</html>
