<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bunnyland Web REPL</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="assets/bunnyland-ui.css">
  <style>
    #api-url { width: 190px; }
    #player-select, #claim-fallback, #claim-timeout { font-size: var(--bl-text-sm); }
    #claim-timeout { width: 56px; }

    #main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      background: var(--bl-bg-deep);
    }

    #terminal-pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--bl-border);
      background: var(--bl-bg-deep);
    }

    #repl-log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      font-size: var(--bl-text-md);
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .log-row {
      margin-bottom: 8px;
      color: var(--bl-text-soft);
    }
    .log-row.command { color: var(--bl-accent); }
    .log-row.ok { color: var(--bl-ok); }
    .log-row.error { color: var(--bl-error); }
    .log-row.event { color: var(--bl-text); }
    .log-row.rejection { color: var(--bl-warn); }

    .entity-link {
      border: 0;
      padding: 0;
      color: var(--bl-accent-strong);
      background: transparent;
      text-decoration: underline;
      font-size: inherit;
      white-space: normal;
    }
    .entity-link:hover { background: transparent; color: var(--bl-accent); }

    #prompt-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--bl-border);
      background: var(--bl-bg-strong);
    }
    #prompt-label { color: var(--bl-accent); }
    #repl-input {
      width: 100%;
      font-size: 14px;
      padding: 7px 9px;
      background: var(--bl-bg);
    }

    #side-pane {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      background: var(--bl-bg-strong);
    }

    .side-section { margin-bottom: 16px; }
    .side-title {
      margin-bottom: 7px;
      color: var(--bl-accent-strong);
      font-size: var(--bl-text-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .icon-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 7px;
      color: var(--bl-text-muted);
      font-size: var(--bl-text-xs);
      white-space: nowrap;
    }
    .action-icon { margin-right: 6px; }
    .side-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .side-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid var(--bl-border-muted);
      border-radius: var(--bl-radius-sm);
      background: var(--bl-bg-subtle);
      color: var(--bl-text-soft);
      font-size: var(--bl-text-sm);
    }
    .side-row strong {
      color: var(--bl-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side-row span { color: var(--bl-text-dim); }
    .side-row.unavailable {
      opacity: 0.62;
      background: var(--bl-bg-subtle);
      border-color: var(--bl-border-muted);
    }
    .side-row.unavailable strong { color: var(--bl-text-muted); }
    .side-row .reason {
      color: var(--bl-warn);
      font-size: var(--bl-text-xs);
    }
    .side-empty {
      color: var(--bl-text-muted);
      font-size: var(--bl-text-sm);
      line-height: 1.45;
    }
    .help-chip {
      display: inline-block;
      margin: 0 4px 5px 0;
      padding: 3px 6px;
      border: 1px solid var(--bl-border-control);
      border-radius: var(--bl-radius-sm);
      color: var(--bl-text-soft);
      background: var(--bl-surface);
      font-size: var(--bl-text-xs);
    }

    @media (max-width: 860px) {
      #main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
      #terminal-pane { border-right: 0; border-bottom: 1px solid var(--bl-border); }
      #side-pane { max-height: 32vh; }
      .toolbar-row { flex-wrap: wrap; }
      .client-menu-button { margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="toolbar">
  <div class="toolbar-row" id="toolbar-row1">
    <span class="toolbar-brand"><img src="favicon.png" alt=""> Bunnyland Web REPL</span>
    <span class="toolbar-sep">|</span>
    <label for="api-url">Server:</label>
    <input type="text" id="api-url" value="/api/" spellcheck="false">
    <button id="btn-connect">Connect Live</button>
    <span id="api-status">○ Offline</span>
    <button id="btn-client-menu" class="client-menu-button" type="button">Menu</button>
  </div>
  <div class="toolbar-row" id="toolbar-row2">
    <label for="player-select">Character:</label>
    <select id="player-select"><option value="">— select to play —</option></select>
    <button id="btn-claim-menu" type="button" disabled>Claim</button>
    <button id="btn-request-image" type="button" title="Request an image of your character's current scene">📷 Image</button>
  </div>
</div>

<dialog id="claim-dialog">
  <form method="dialog" class="claim-dialog-form">
    <h3>Claim</h3>
    <label for="claim-fallback">Idle controller</label>
    <select id="claim-fallback">
      <option value="suspend">Suspended</option>
      <option value="llm">LLM</option>
      <option value="controller">Existing controller</option>
    </select>
    <label for="claim-fallback-controller">Idle controller ID</label>
    <input type="text" id="claim-fallback-controller" spellcheck="false" placeholder="entity_...">
    <label for="claim-timeout">Idle timeout minutes</label>
    <input type="number" id="claim-timeout" min="5" max="60" step="1" value="30">
    <div class="dialog-actions">
      <button id="btn-dialog-claim" type="button">Claim</button>
      <button id="btn-dialog-save-fallback" type="button">Save Idle</button>
      <button id="btn-dialog-release-controller" type="button">Idle</button>
      <button id="btn-dialog-release-claim" type="button">Release</button>
      <button type="submit">Close</button>
    </div>
  </form>
</dialog>

<div id="main" class="app-grid">
  <section id="terminal-pane" aria-label="REPL transcript">
    <div id="repl-log"></div>
    <form id="prompt-row" autocomplete="off">
      <span id="prompt-label">&gt;</span>
      <input id="repl-input" type="text" spellcheck="false" list="repl-completions" aria-label="Command">
      <datalist id="repl-completions"></datalist>
      <button id="btn-send" type="submit">Send</button>
    </form>
  </section>
  <aside id="side-pane" aria-label="Current context">
    <div class="side-section">
      <div class="side-title">Status</div>
      <div id="side-status" class="side-empty">Connect to a running server.</div>
    </div>
    <div class="side-section">
      <div class="side-title">Actions</div>
      <label class="icon-toggle" title="Show action and event icons">
        <input id="show-action-icons" type="checkbox" checked> Icons
      </label>
      <div id="side-actions" class="side-empty">Pick a player to load available actions.</div>
    </div>
    <div class="side-section">
      <div class="side-title">Targets</div>
      <div id="side-targets" class="side-empty">Visible target names appear here.</div>
    </div>
    <div class="side-section">
      <div class="side-title">Quick Commands</div>
      <div>
        <span class="help-chip">help</span>
        <span class="help-chip">who</span>
        <span class="help-chip">play &lt;name&gt;</span>
        <span class="help-chip">look</span>
        <span class="help-chip">inventory</span>
        <span class="help-chip">points</span>
        <span class="help-chip">image</span>
        <span class="help-chip">sheet</span>
        <span class="help-chip">queued</span>
      </div>
    </div>
  </aside>
</div>

<script src="assets/bunnyland-ui.js?v=20260624-admin-tools"></script>
<script src="assets/bunnyland-api.js"></script>
<script src="assets/bunnyland-play.js"></script>
<script>
'use strict';

BunnylandUI.initClientMenu();

const {
  actionIcon,
  actionArguments,
  actionAvailable,
  actionCost,
  actionLane,
  actionTitle,
  actionTool,
  actionUnavailableReason,
  allTargets,
  cancelQueuedCommand,
  clearClaimControl,
  claimWebController,
  claimSettings,
  controlFromResponse,
  drainNarratedEvents,
  fetchCharacterList,
  fetchCharacterProjection,
  fetchQueuedCommands,
  fetchRecentEvents,
  formatPoints,
  characterSheetHref,
  iconPreference,
  imageRequestMessage,
  latestImageCompletion,
  latestImageFailure,
  IMAGE_AFFORDANCE,
  isReferenceArg,
  orderActionsByAvailability,
  persistentClientId,
  playerControl,
  queuedCountdownSeconds,
  releaseWebClaim,
  releaseWebController,
  resolveTargetName,
  setIconPreference,
  storeClaimControl,
  storedClaimControl,
  suggestTargetNames,
  submitCommand,
  syncClaimControl,
  targetCandidates,
  targetPrefix,
  updateWebControllerFallback,
} = BunnylandPlay;

const POLL_INTERVAL_MS = 2000;
const CLIENT_ID_KEY = 'bunnyland.webRepl.clientId';
const ICON_PREF_KEY = 'bunnyland.webRepl.showIcons';
const META_COMMANDS = ['help', 'who', 'look', 'inventory', 'inv', 'points', 'play', 'image', 'img', 'sheet', 'profile', 'refresh', 'queued', 'cancel', 'clear'];

function splitArgs(rest) {
  const tokens = rest.trim().split(/\s+/).filter(Boolean);
  const args = {};
  let current = '';
  for (const token of tokens) {
    if (token.includes('=')) {
      const [key, ...parts] = token.split('=');
      args[key] = parts.join('=');
      current = key;
    } else if (current) {
      args[current] = `${args[current]} ${token}`.trim();
    }
  }
  return args;
}

class WebRepl {
  constructor() {
    this.apiBase = null;
    this.connected = false;
    this.characters = [];
    this.epoch = 0;
    this.playerId = '';
    this.projection = null;
    this.queuedCommands = [];
    this.queueProjection = null;
    this.control = null;
    this.seenEventIds = new Set();
    this.eventsPrimed = false;
    this.showActionIcons = iconPreference(ICON_PREF_KEY, true);
    this.history = [];
    this.historyIndex = 0;
    this.clientId = persistentClientId(CLIENT_ID_KEY, 'web-repl');
    this._pollTimer = null;

    this._bindUi();
    this._restoreServerParam();
    this._loadConfig();
    this._write('Type help for commands. Connect, then choose a player or use play <name>.', '');
    this.render();
  }

  _bindUi() {
    document.getElementById('btn-connect').addEventListener('click', () => {
      if (this.connected) this.disconnect();
      else this.connect(document.getElementById('api-url').value.trim());
    });
    document.getElementById('player-select').addEventListener('change', (e) => {
      if (e.target.value) this.selectPlayer(e.target.value);
      else this._dropPlayer();
    });
    document.getElementById('btn-claim-menu').addEventListener('click', () => {
      this._syncClaimDialog();
      if (this.playerId) document.getElementById('claim-dialog')?.showModal();
    });
    document.getElementById('btn-dialog-claim').addEventListener('click', () => this._claimPlayer());
    document.getElementById('btn-dialog-save-fallback').addEventListener('click', () => this._updateClaimFallback());
    document.getElementById('btn-dialog-release-controller').addEventListener('click', () => this._releaseController());
    document.getElementById('btn-dialog-release-claim').addEventListener('click', () => this._releaseClaim());
    document.getElementById('btn-request-image').addEventListener('click', () => this._requestImage());
    document.getElementById('prompt-row').addEventListener('submit', (e) => {
      e.preventDefault();
      this.dispatchInput();
    });
    document.getElementById('repl-input').addEventListener('keydown', (e) => this._inputKey(e));
    document.getElementById('repl-input').addEventListener('input', () => this._updateCompletions());
    document.getElementById('show-action-icons').addEventListener('change', (e) => {
      this.showActionIcons = e.target.checked;
      setIconPreference(ICON_PREF_KEY, this.showActionIcons);
      this.render();
    });
    document.getElementById('repl-log').addEventListener('click', (e) => {
      const button = e.target.closest('.entity-link');
      if (!button) return;
      const input = document.getElementById('repl-input');
      input.value = `${input.value}${input.value && !input.value.endsWith(' ') ? ' ' : ''}${button.dataset.insert}`;
      input.focus();
      this._updateCompletions();
    });
  }

  _restoreServerParam() {
    BunnylandApi.applyServerParam({ connect: (server) => this.connect(server) });
  }

  async _loadConfig() {
    await BunnylandApi.applyConfigToInput({
      isConnected: () => this.connected,
      connect: (server) => this.connect(server),
    });
  }

  connect(url) {
    if (!url) return;
    this.disconnect();
    this.apiBase = BunnylandApi.normalizeBase(url);
    this.connected = true;
    this._setStatus('live', '● Connected');
    document.getElementById('btn-connect').textContent = 'Disconnect';
    BunnylandApi.setServerInUrl(this.apiBase);
    this.refresh({ announce: true });
    this._pollTimer = setInterval(() => this.refresh(), POLL_INTERVAL_MS);
  }

  disconnect() {
    clearInterval(this._pollTimer);
    this._pollTimer = null;
    this.connected = false;
    this.characters = [];
    this.playerId = '';
    this.projection = null;
    this.queuedCommands = [];
    this.queueProjection = null;
    this.control = null;
    this.seenEventIds = new Set();
    this.eventsPrimed = false;
    this._setStatus('', '○ Offline');
    document.getElementById('btn-connect').textContent = 'Connect Live';
    BunnylandApi.setServerInUrl('');
    this.render();
  }

  async refresh({ announce = false } = {}) {
    if (!this.apiBase) return;
    try {
      const lobby = await fetchCharacterList(this.apiBase);
      this.characters = lobby.characters;
      this.epoch = lobby.epoch;
      this._refreshPlayerOptions();
      if (this.playerId && !this.characters.some(c => c.id === this.playerId)) this._dropPlayer();
      if (this.playerId) {
        const projection = await fetchCharacterProjection(this.apiBase, this.playerId, this.control);
        this.projection = projection?.characterId === this.playerId ? projection : null;
        this.control = syncClaimControl(this.control, this.projection, this.playerId);
        const queued = await fetchQueuedCommands(this.apiBase, this.playerId, this.control);
        this.queuedCommands = queued?.characterId === this.playerId ? queued.commands : [];
        this.queueProjection = queued?.characterId === this.playerId ? queued : null;
      }
      await this._refreshRecentEvents();
      this._setStatus('live', `● Live · epoch ${this.epoch}s`);
      if (announce) this._write('Connected.', 'ok');
      this.render();
    } catch (err) {
      this._setStatus('error', `⚠ ${err.message}`);
      if (announce) this._write(`Connection failed: ${err.message}`, 'error');
    }
  }

  _setStatus(cls, text) {
    const el = document.getElementById('api-status');
    el.className = cls;
    el.textContent = text;
  }

  _refreshPlayerOptions() {
    const select = document.getElementById('player-select');
    const current = this.playerId;
    const rows = this.characters.slice().sort((a, b) => a.name.localeCompare(b.name));
    select.innerHTML = '<option value="">- none -</option>' +
      rows.map(c => `<option value="${BunnylandUI.escapeHtml(c.id)}">${BunnylandUI.escapeHtml(c.name)}</option>`).join('');
    select.value = rows.some(c => c.id === current) ? current : '';
  }

  _dropPlayer() {
    this.playerId = '';
    this.projection = null;
    this.queuedCommands = [];
    this.queueProjection = null;
    this.control = null;
    document.getElementById('player-select').value = '';
    document.getElementById('btn-claim-menu').disabled = true;
    this.render();
  }

  async selectPlayer(nameOrId) {
    if (!this.connected) {
      this._write('Connect to a server first.', 'error');
      return;
    }
    const chosen = this._resolveCharacter(nameOrId);
    if (!chosen) {
      this._write(`No such player: ${nameOrId}. Try who.`, 'error');
      return;
    }
    this.playerId = chosen.id;
    document.getElementById('player-select').value = chosen.id;
    const control = await this._claimPlayer();
    if (!control) {
      this._write(`Could not claim ${chosen.name}.`, 'error');
      return;
    }
    await this.refresh();
    this._write(`You are now ${chosen.name}.`, 'ok');
  }

  _resolveCharacter(nameOrId) {
    const exactId = this.characters.find(c => c.id === nameOrId);
    if (exactId) return exactId;
    const query = String(nameOrId || '').trim().toLowerCase();
    if (!query) return null;
    return this.characters.find(c => c.name.toLowerCase() === query) ||
      this.characters.slice()
        .sort((a, b) => a.name.length - b.name.length || a.name.localeCompare(b.name))
        .find(c => c.name.toLowerCase().startsWith(query)) || null;
  }

  _claimSettings() {
    return claimSettings();
  }

  async _claimPlayer() {
    if (!this.apiBase || !this.playerId) return null;
    try {
      const stored = storedClaimControl(CLIENT_ID_KEY, this.playerId);
      const data = await claimWebController(this.apiBase, {
        ...this._claimSettings(),
        character_id: this.playerId,
        client_id: this.clientId,
        claim_id: stored?.claimId || undefined,
        label: 'web-repl',
      }, stored);
      this.control = controlFromResponse(data, this.playerId, { active: true });
      storeClaimControl(CLIENT_ID_KEY, this.control);
      return this.control;
    } catch (err) {
      console.warn('Could not claim Bunnyland web REPL controller', err);
      return null;
    }
  }

  async _updateClaimFallback() {
    if (!this.apiBase || !this.playerId || !this.control) return;
    try {
      const data = await updateWebControllerFallback(this.apiBase, {
        ...this._claimSettings(),
        character_id: this.playerId,
        client_id: this.clientId,
        claim_id: this.control.claimId,
      }, this.control);
      this.control = controlFromResponse(data, this.playerId, { active: this.control.active !== false });
      storeClaimControl(CLIENT_ID_KEY, this.control);
    } catch (err) {
      console.warn('Could not update Bunnyland web REPL fallback', err);
    }
  }

  async _releaseController() {
    if (!this.apiBase || !this.playerId || !this.control) return;
    try {
      const data = await releaseWebController(this.apiBase, {
        ...this._claimSettings(),
        character_id: this.playerId,
        client_id: this.clientId,
        claim_id: this.control.claimId,
      }, this.control);
      this.control = controlFromResponse(data, this.playerId, { active: false });
      storeClaimControl(CLIENT_ID_KEY, this.control);
      await this.refresh();
      this._write('Character is idle.', 'system');
    } catch (err) {
      console.warn('Could not release Bunnyland web REPL controller', err);
      this._write(`Could not release control: ${err.message || err}`, 'error');
    }
  }

  async _releaseClaim() {
    if (!this.apiBase || !this.playerId || !this.control) return;
    const characterId = this.playerId;
    try {
      await releaseWebClaim(this.apiBase, {
        character_id: characterId,
        client_id: this.clientId,
        claim_id: this.control.claimId,
      }, this.control);
      clearClaimControl(CLIENT_ID_KEY, characterId);
      document.getElementById('claim-dialog')?.close();
      this._dropPlayer();
      this._write('Released claim.', 'system');
    } catch (err) {
      console.warn('Could not release Bunnyland web REPL claim', err);
      this._write(`Could not release claim: ${err.message || err}`, 'error');
    }
  }

  _playerControl() {
    return playerControl(this.control, this.projection, this.playerId);
  }

  _claimButtonLabel() {
    if (!this.playerId || !this.control) return 'Claim';
    return this.control.active === false ? 'Resume' : 'Idle';
  }

  _syncClaimDialog() {
    document.getElementById('btn-dialog-claim').textContent =
      this.control?.active === false ? 'Resume' : 'Claim';
  }

  async dispatchInput() {
    const input = document.getElementById('repl-input');
    const line = input.value.trim();
    if (!line) return;
    input.value = '';
    this.history.push(line);
    this.historyIndex = this.history.length;
    this._write(`> ${line}`, 'command');
    await this.dispatch(line);
    this._updateCompletions();
  }

  async dispatch(line) {
    const [verb, ...restParts] = line.trim().split(/\s+/);
    const rest = restParts.join(' ');
    if (verb === 'help') return this._writeHelp(rest);
    if (verb === 'who') return this._writePlayers();
    if (verb === 'look') return this._writeLook();
    if (verb === 'inventory' || verb === 'inv') return this._writeInventory();
    if (verb === 'points') return this._writePoints();
    if (verb === 'queued') return this._writeQueued();
    if (verb === 'cancel') return this._cancelQueued(rest);
    if (verb === 'refresh') {
      await this.refresh();
      return this._write('Refreshed.', 'ok');
    }
    if (verb === 'clear') {
      document.getElementById('repl-log').innerHTML = '';
      return;
    }
    if (verb === 'play') {
      if (!rest) return this._write('Usage: play <player name>', 'error');
      return this.selectPlayer(rest);
    }
    if (verb === 'image' || verb === 'img') return this._requestImage();
    if (verb === 'sheet' || verb === 'profile') return this._openSheet(rest);
    return this._act(line);
  }

  async _requestImage() {
    if (!this.apiBase || !this.playerId) {
      return this._write('Pick a player first: play <name>.', 'error');
    }
    try {
      const result = await BunnylandApi.requestSceneImage(this.apiBase, this.playerId, this.control);
      this._write(imageRequestMessage(result), 'ok');
    } catch (err) {
      this._write(`${IMAGE_AFFORDANCE.REQUEST_EMOJI} ${err.message}`, 'error');
    }
  }

  _sheetTarget(name) {
    const query = String(name || '').trim();
    if (!query) return this.playerId || '';
    if (['me', 'self', 'player', 'current', 'you'].includes(query.toLowerCase())) return this.playerId || '';
    const lobby = this._resolveCharacter(query);
    if (lobby) return lobby.id;
    const visible = this._allTargets().filter(target => target.kind === 'character');
    const resolved = resolveTargetName(query, visible);
    return resolved?.value || '';
  }

  _openSheet(name = '') {
    if (!this.apiBase || !this.playerId) {
      return this._write(this.apiBase ? 'Pick a player first: play <name>.' : 'Connect to a server first.', 'error');
    }
    const characterId = this._sheetTarget(name);
    if (!characterId) {
      return this._write(`No character sheet target: ${name}. Try who.`, 'error');
    }
    const href = characterSheetHref(this.apiBase, characterId);
    const opened = window.open(href, '_blank', 'noopener');
    this._write(opened ? `Opened sheet: ${href}` : `Sheet URL: ${href}`, 'ok');
  }

  _writeHelp(topic) {
    const action = topic ? this._actionByName(topic) : null;
    if (action) {
      const keys = actionArguments(action).map(arg => arg.key).filter(Boolean).join(', ') || '(none)';
      this._write(`${actionTool(action)} - ${actionTitle(action)}\n  parameters: ${keys}`);
      return;
    }
    const commands = this._actions().map(actionTool).sort().join(', ') || '(load a player first)';
    this._write(
      `Commands: ${commands}\n` +
      `Meta: ${META_COMMANDS.join(', ')}\n` +
      `Forms: move direction=north, take item_id=a brass key, go north, take brass key, say hello.`
    );
  }

  _writePlayers() {
    if (!this.characters.length) {
      this._write('No players.');
      return;
    }
    const parts = [];
    for (const character of this.characters) {
      parts.push(this._link(character.name, character.name) + (character.id === this.playerId ? ' (you)' : ''));
    }
    this._writeHtml(parts.join('<br>'));
  }

  _writeLook() {
    if (!this.projection?.room?.id) {
      this._write('No room.');
      return;
    }
    const room = this.projection.room;
    const rows = [`<strong>${BunnylandUI.escapeHtml(room.title || room.id)}</strong>`];
    for (const entity of room.entities || []) {
      rows.push(`  ${this._link(entity.name || entity.id, entity.name || entity.id)}${entity.id === this.playerId ? ' (you)' : ''}`);
    }
    if ((room.exits || []).length) {
      const exits = room.exits.map(exit => this._link(exit.direction ? `${exit.direction} -> ${exit.label || exit.id}` : (exit.label || exit.id), exit.direction || exit.label || exit.id));
      rows.push(`  exits: ${exits.join(', ')}`);
    }
    if ((this.projection.inventory || []).length) {
      rows.push(`  carrying: ${this.projection.inventory.map(item => this._link(item.label || item.name || item.id, item.label || item.name || item.id)).join(', ')}`);
    }
    this._writeHtml(rows.join('<br>'));
  }

  _writeInventory() {
    const inventory = this.projection?.inventory || [];
    if (!this.playerId) return this._write('Pick a player first: play <name>.', 'error');
    if (!inventory.length) return this._write("You aren't carrying anything.");
    this._writeHtml(inventory.map(item => {
      const label = item.label || item.name || item.id;
      const kind = item.kind ? ` (${BunnylandUI.escapeHtml(item.kind)})` : '';
      return `  ${this._link(label, label)}${kind}`;
    }).join('<br>'));
  }

  _writePoints() {
    if (!this.playerId) {
      this._write('Pick a player first: play <name>.', 'error');
      return;
    }
    const pts = this.projection?.points || {};
    this._write(`AP ${formatPoints(pts.action)}/${formatPoints(pts.action_max)}   FP ${formatPoints(pts.focus)}/${formatPoints(pts.focus_max)}`);
  }

  _writeQueued() {
    if (!this.playerId) return this._write('Pick a player first: play <name>.', 'error');
    if (!this.queuedCommands.length) return this._write('No queued actions.');
    const countdown = queuedCountdownSeconds(this.queueProjection);
    if (countdown != null) this._write(`Next tick in ${countdown}s.`);
    this._write(this.queuedCommands.map(command => {
      const payload = Object.entries(command.payload || {}).map(([k, v]) => `${k}=${v}`).join(' ');
      return `${command.command_id}: ${command.command_type}${payload ? ` ${payload}` : ''}`;
    }).join('\n'));
  }

  async _cancelQueued(commandId) {
    if (!this.playerId) return this._write('Pick a player first: play <name>.', 'error');
    if (!commandId) return this._write('Usage: cancel <command id>', 'error');
    const control = this._playerControl() || await this._claimPlayer();
    if (!control) return this._write('Could not claim a web controller for this player.', 'error');
    try {
      const result = await cancelQueuedCommand(this.apiBase, this.playerId, commandId, control);
      if (result?.cancelled) this._write(`Cancelled ${commandId}.`, 'ok');
      else this._write(result?.reason || 'Command was not cancelled.', 'error');
      await this.refresh();
    } catch (err) {
      this._write(`Cancel failed: ${err.message}`, 'error');
    }
  }

  async _act(line) {
    const parsed = this._parseAction(line);
    if (!parsed) {
      const verb = line.split(/\s+/, 1)[0];
      this._write(`I don't understand '${verb}'. Type help.`, 'error');
      return;
    }
    if (!this.playerId) {
      this._write('Pick a player first: play <name>.', 'error');
      return;
    }
    const action = this._actionByName(parsed.tool);
    if (!action) {
      this._write(`I don't understand '${parsed.tool}'. Type help.`, 'error');
      return;
    }
    const payload = this._resolvePayload(action, parsed.arguments);
    if (payload.error) {
      this._write(payload.error, 'error');
      return;
    }
    const control = this._playerControl() || await this._claimPlayer();
    if (!control) {
      this._write('Could not claim a web controller for this player.', 'error');
      return;
    }
    const cost = actionCost(action);
    try {
      const result = await submitCommand(this.apiBase, {
        character_id: this.playerId,
        controller_id: control.controllerId,
        controller_generation: control.generation,
        ...(control.claimId ? { claim_id: control.claimId } : {}),
        command_type: action.command_type || actionTool(action),
        payload: payload.value,
        cost: { action: cost.action, focus: cost.focus },
        lane: actionLane(action),
        on_insufficient_points: 'queue',
      }, control);
      if (result?.queued === false) {
        this._write(result.reason || 'Command rejected.', 'error');
        await this.refresh();
        return;
      }
      const detail = Object.entries(payload.value).map(([key, value]) => `${key}=${value}`).join(' ');
      this._write(`» ${action.command_type || actionTool(action)}${detail ? ` ${detail}` : ''}`, 'ok');
      await this.refresh();
    } catch (err) {
      this._write(`Command failed: ${err.message}`, 'error');
    }
  }

  _parseAction(line) {
    const [command, ...restParts] = line.trim().split(/\s+/);
    const rest = restParts.join(' ');
    if (command === 'go') {
      const action = this._actionByName('move');
      if (!action || !rest) return null;
      const args = actionArguments(action);
      const key = args.find(arg => arg.key === 'direction')?.key ||
        args.find(arg => arg.target_group === 'exits')?.key ||
        args.find(arg => arg.kind === 'entity')?.key || 'direction';
      return { tool: actionTool(action), arguments: { [key]: rest } };
    }
    const action = this._actionByName(command);
    if (!action) return null;
    if (!rest) return { tool: actionTool(action), arguments: {} };
    if (/\S+=/.test(rest)) return { tool: actionTool(action), arguments: splitArgs(rest) };

    const args = actionArguments(action).filter(arg => arg.key);
    const required = args.filter(arg => arg.required);
    const fields = required.length ? required : args;
    if (fields.length === 1) return { tool: actionTool(action), arguments: { [fields[0].key]: rest } };

    const entityArg = fields.find(arg => this._isReferenceArg(arg));
    const textArg = fields.find(arg => !this._isReferenceArg(arg) && (arg.kind || 'string') === 'string');
    if (entityArg && textArg) {
      const match = this._targetPrefix(rest, this._candidatesForArg(entityArg));
      if (match) {
        return {
          tool: actionTool(action),
          arguments: { [entityArg.key]: match.raw, [textArg.key]: match.remaining },
        };
      }
    }
    return null;
  }

  _actions() {
    return this.projection?.actions || [];
  }

  _actionByName(name) {
    return this._actions().find(action =>
      actionTool(action) === name || action.command_type === name || action.title === name);
  }

  _isReferenceArg(arg) {
    return isReferenceArg(arg);
  }

  _resolvePayload(action, rawArgs) {
    const out = {};
    for (const arg of actionArguments(action)) {
      if (!arg.key) continue;
      const raw = rawArgs[arg.key];
      if ((raw == null || raw === '') && arg.required) {
        return { error: `${arg.title || arg.key} is required.` };
      }
      if (raw == null || raw === '') continue;
      if (this._isReferenceArg(arg)) {
        const resolved = this._resolveName(raw, this._candidatesForArg(arg));
        if (!resolved) {
          const hints = this._suggestNames(raw, this._candidatesForArg(arg));
          const suffix = hints.length ? ` Did you mean: ${hints.join(', ')}?` : '';
          return { error: `I don't see '${raw}' (${arg.key.replace(/_id$/, '').replaceAll('_', ' ')}) here.${suffix}` };
        }
        out[arg.key] = resolved.value;
      } else {
        out[arg.key] = raw;
      }
    }
    for (const [key, value] of Object.entries(rawArgs)) {
      if (!(key in out) && !actionArguments(action).some(arg => arg.key === key)) out[key] = value;
    }
    return { value: out };
  }

  _candidatesForArg(arg) {
    return targetCandidates(this.projection, arg);
  }

  _allTargets() {
    return allTargets(this.projection);
  }

  _resolveName(value, candidates) {
    return resolveTargetName(value, candidates);
  }

  _suggestNames(value, candidates) {
    return suggestTargetNames(value, candidates);
  }

  _targetPrefix(rest, candidates) {
    return targetPrefix(rest, candidates);
  }

  async _refreshRecentEvents() {
    if (!this.apiBase) return;
    try {
      const data = await fetchRecentEvents(this.apiBase);
      this._drainEvents(data.events || [], { prime: !this.eventsPrimed });
      this.eventsPrimed = true;
    } catch (err) {
      console.warn('Could not refresh Bunnyland web REPL events', err);
    }
  }

  _drainEvents(messages, { prime = false } = {}) {
    const drained = drainNarratedEvents(messages, {
      seenIds: this.seenEventIds,
      playerId: this.playerId,
      roomOf: () => this.projection?.room?.id || null,
      nameFor: (id) => this._nameFor(id),
    });
    this.seenEventIds = drained.seenIds;
    const image = latestImageCompletion(messages, { base: this.apiBase, purpose: 'event' });
    if (image && image.url !== this._eventImageUrl) {
      this._eventImageUrl = image.url;
      if (!prime) {
        this._writeHtml(
          `${IMAGE_AFFORDANCE.DELIVER_EMOJI} scene image ready: `
          + `<a href="${encodeURI(image.url)}" target="_blank" rel="noopener">view image</a>`
        );
      }
    }
    const failure = latestImageFailure(messages, { purpose: 'event' });
    if (failure && failure.epoch !== this._eventImageFailureEpoch) {
      this._eventImageFailureEpoch = failure.epoch;
      if (!prime) {
        this._write(`${IMAGE_AFFORDANCE.FAIL_EMOJI} image request failed: ${failure.reason}`, 'error');
      }
    }
    if (prime) return;
    for (const line of drained.lines) {
      const prefix = this.showActionIcons && line.icon ? `${line.icon} ` : '';
      this._write(`${prefix}${line.text}`, line.kind || 'event');
    }
  }

  _nameFor(entityId) {
    if (entityId === this.playerId) {
      return this.characters.find(c => c.id === entityId)?.name || entityId;
    }
    const target = this._allTargets().find(item => item.value === entityId);
    return target?.label || this.characters.find(c => c.id === entityId)?.name || null;
  }

  _write(text, kind = '') {
    const row = document.createElement('div');
    row.className = `log-row ${kind}`.trim();
    row.textContent = text;
    document.getElementById('repl-log').appendChild(row);
    row.scrollIntoView({ block: 'end' });
  }

  _writeHtml(html, kind = '') {
    const row = document.createElement('div');
    row.className = `log-row ${kind}`.trim();
    row.innerHTML = html;
    document.getElementById('repl-log').appendChild(row);
    row.scrollIntoView({ block: 'end' });
  }

  _link(label, insert) {
    return `<button class="entity-link" type="button" data-insert="${BunnylandUI.escapeHtml(insert)}">${BunnylandUI.escapeHtml(label)}</button>`;
  }

  _inputKey(e) {
    const input = e.currentTarget;
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (this.historyIndex > 0) this.historyIndex -= 1;
      input.value = this.history[this.historyIndex] || '';
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (this.historyIndex < this.history.length) this.historyIndex += 1;
      input.value = this.history[this.historyIndex] || '';
    } else if (e.key === 'Tab') {
      const options = this._completionOptions(input.value);
      if (options.length === 1) {
        e.preventDefault();
        input.value = options[0];
      }
    }
  }

  _updateCompletions() {
    const input = document.getElementById('repl-input');
    const list = document.getElementById('repl-completions');
    list.innerHTML = this._completionOptions(input.value)
      .slice(0, 12)
      .map(value => `<option value="${BunnylandUI.escapeHtml(value)}"></option>`)
      .join('');
  }

  _completionOptions(line) {
    const words = [...META_COMMANDS, ...this._actions().map(actionTool)];
    if (!line.includes(' ')) return [...new Set(words)].sort().filter(word => word.startsWith(line));
    const [command, ...restParts] = line.split(/\s+/);
    const rest = restParts.join(' ');
    if (command === 'help') return this._actions().map(actionTool).filter(word => word.startsWith(rest)).map(word => `help ${word}`);
    if (command === 'play') return this.characters.map(c => c.name).filter(name => name.startsWith(rest)).map(name => `play ${name}`);
    const action = this._actionByName(command);
    if (!action) return [];
    const current = line.split(/\s+/).at(-1);
    if (current.includes('=')) {
      const [key, prefix] = current.split('=');
      const arg = actionArguments(action).find(item => item.key === key);
      const base = line.slice(0, line.length - current.length) + `${key}=`;
      if (arg && this._isReferenceArg(arg)) {
        return this._candidatesForArg(arg)
          .map(item => item.label)
          .filter(label => label.startsWith(prefix))
          .map(label => base + label);
      }
      if (arg?.kind === 'boolean') {
        return ['false', 'true'].filter(value => value.startsWith(prefix)).map(value => base + value);
      }
    }
    const base = line.slice(0, line.length - current.length);
    return actionArguments(action)
      .map(arg => arg.key)
      .filter(key => key && key.startsWith(current))
      .map(key => `${base}${key}=`);
  }

  render() {
    const status = document.getElementById('side-status');
    const actions = document.getElementById('side-actions');
    const targets = document.getElementById('side-targets');
    document.getElementById('show-action-icons').checked = this.showActionIcons;
    const player = this.characters.find(c => c.id === this.playerId);
    const claimMenu = document.getElementById('btn-claim-menu');
    claimMenu.disabled = !this.playerId;
    claimMenu.textContent = this._claimButtonLabel();
    const pts = this.projection?.points || {};
    status.innerHTML = player
      ? `<div class="side-row"><strong>${BunnylandUI.escapeHtml(player.name)}</strong><span>epoch ${this.epoch}s</span></div>` +
        `<div class="side-row"><strong>AP ${formatPoints(pts.action)}/${formatPoints(pts.action_max)}</strong><span>FP ${formatPoints(pts.focus)}/${formatPoints(pts.focus_max)}</span></div>`
      : `<div class="side-empty">${this.connected ? 'Pick a player.' : 'Connect to a running server.'}</div>`;

    const actionRows = orderActionsByAvailability(this._actions()).map(action => {
      const cost = actionCost(action);
      const parts = [];
      if (cost.action) parts.push(`${cost.action} AP`);
      if (cost.focus) parts.push(`${cost.focus} FP`);
      const reason = actionUnavailableReason(action);
      const meta = [parts.join(' + ') || 'free', reason].filter(Boolean).join(' - ');
      const icon = this.showActionIcons
        ? `<span class="action-icon">${BunnylandUI.escapeHtml(actionIcon(action))}</span>`
        : '';
      return `<div class="side-row${actionAvailable(action) ? '' : ' unavailable'}" title="${BunnylandUI.escapeHtml(reason)}">` +
        `<strong>${icon}${BunnylandUI.escapeHtml(actionTool(action))}</strong>` +
        `<span${reason ? ' class="reason"' : ''}>${BunnylandUI.escapeHtml(meta)}</span></div>`;
    }).join('');
    actions.innerHTML = actionRows || '<div class="side-empty">Pick a player to load available actions.</div>';

    const targetRows = this._allTargets().slice(0, 24).map(target =>
      `<div class="side-row"><strong>${BunnylandUI.escapeHtml(target.label)}</strong><span>${BunnylandUI.escapeHtml(target.kind || target.value)}</span></div>`
    ).join('');
    targets.innerHTML = targetRows || '<div class="side-empty">Visible target names appear here.</div>';
    this._updateCompletions();
  }
}

window.app = new WebRepl();
</script>
</body>
</html>
